<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#05070f}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter,system-ui,sans-serif;color:#fff;background:radial-gradient(circle at 50% 50%,#0f1f4d 0%,#05070f 70%)}
.abs{position:absolute;left:0;width:1080px;text-align:center}
.line{font-weight:900;letter-spacing:-.03em;line-height:1;font-size:150px}
.chip{position:absolute;left:540px;top:960px;display:flex;align-items:center;gap:18px;padding:22px 38px;border-radius:999px;font-size:54px;font-weight:800;white-space:nowrap;box-shadow:0 12px 40px rgba(0,0,0,.45)}
.chip span{font-size:62px}
.dot{position:absolute;left:540px;top:960px;width:16px;height:16px;border-radius:50%}
.ring{position:absolute;left:540px;top:960px;width:100px;height:100px;margin:-50px 0 0 -50px;border-radius:50%;border:10px solid #7dd3fc}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#orb{position:absolute;left:540px;top:960px;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;background:radial-gradient(circle,#fff 0%,#60a5fa 35%,#2563eb 65%,transparent 72%)}
#brand{position:absolute;left:0;width:1080px;text-align:center;top:1700px}
#brand b{display:inline-block;font-size:56px;padding:26px 56px;border-radius:999px;background:linear-gradient(90deg,#2563eb,#7c3aed)}
.g{background:linear-gradient(90deg,#60a5fa,#c084fc,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1080" data-height="1920">
  <div id="orb"></div>
  <div class="abs line" id="l1" style="top:170px">Tu negocio</div>
  <div class="abs line" id="l2" style="top:330px">vive en</div>
  <div class="abs line g" id="l3" style="top:490px;font-size:210px">6 apps.</div>
  <div class="abs line" id="q" style="top:300px;font-size:130px">¿Y si fuera<br><span class="g">una sola?</span></div>
  <div class="abs line g" id="one" style="top:360px;font-size:340px">UNA.</div>
  <div class="abs line" id="sub" style="top:760px;font-size:78px;font-weight:800">Todo tu negocio.<br>Un solo lugar.</div>
  <div id="brand"><b id="bp">Market · market.com.bo</b></div>
  <div id="flash"></div>
</div>
<script>
let seed=11;const rnd=()=>{seed=(seed*9301+49297)%233280;return seed/233280};
const root=document.getElementById('root');
const items=[['🛒','Tienda','#16a34a'],['💳','Cobros QR','#2563eb'],['💬','WhatsApp','#15803d'],['📅','Reservas','#db2777'],['🏋️','Gimnasio','#d97706'],['📇','CRM','#7c3aed']];
const chaos=[[-290,-170,-12],[270,-40,9],[-270,110,7],[280,270,-10],[-260,450,12],[250,620,-7]];
const grid=[[-250,330],[250,330],[-250,490],[250,490],[-250,650],[250,650]];
const chips=items.map((it,i)=>{const d=document.createElement('div');d.className='chip';d.setAttribute('data-layout-allow-overlap','');d.setAttribute('data-layout-allow-occlusion','');d.style.background=it[2];
  d.innerHTML='<span>'+it[0]+'</span>'+it[1];d.style.marginLeft='0';root.appendChild(d);gsap.set(d,{xPercent:-50,yPercent:-50,x:chaos[i][0],y:chaos[i][1],rotation:chaos[i][2],scale:0});return d});
const dots=[];for(let i=0;i<48;i++){const d=document.createElement('div');d.className='dot';
  d.style.background=['#60a5fa','#c084fc','#f472b6','#fde047','#fff'][i%5];root.appendChild(d);gsap.set(d,{opacity:0,xPercent:-50,yPercent:-50});dots.push(d)}
const rings=[0,1].map(()=>{const r=document.createElement('div');r.className='ring';root.appendChild(r);gsap.set(r,{scale:0,opacity:0});return r});
gsap.set(['#l1','#l2','#l3','#q','#one','#sub','#bp'],{opacity:0});
gsap.set('#orb',{scale:0,opacity:0});

const tl=gsap.timeline({paused:true});
// 0–2.3 caos
chips.forEach((c,i)=>{tl.to(c,{scale:1,duration:.4,ease:'back.out(2.5)'},.1+i*.12);
  tl.to(c,{x:chaos[i][0]+(i%2?18:-18),y:chaos[i][1]+(i%2?-14:14),rotation:chaos[i][2]+(i%2?4:-4),duration:.12,repeat:15,yoyo:true,ease:'sine.inOut'},.5)});
[['#l1',.25],['#l2',.8],['#l3',1.3]].forEach(([s,t])=>tl.fromTo(s,{opacity:0,scale:1.9,y:-40},{opacity:1,scale:1,y:0,duration:.28,ease:'power4.out'},t));
tl.to('#l3',{scale:1.06,duration:.1,repeat:5,yoyo:true},1.7);
tl.to(['#l1','#l2','#l3'],{opacity:0,y:-60,duration:.25,ease:'power2.in'},2.35);
// 2.6 pregunta
tl.fromTo('#q',{opacity:0,scale:.6},{opacity:1,scale:1,duration:.35,ease:'back.out(2)'},2.6);
// 3.3 succión
chips.forEach((c,i)=>tl.to(c,{x:0,y:0,rotation:540,scale:.15,duration:.55,ease:'power4.in'},3.3+i*.03));
tl.to('#q',{opacity:0,scale:.5,duration:.25},3.45);
tl.set(chips,{opacity:0},3.85);tl.set(chips,{opacity:1},5.69);
// 3.9 explosión
tl.set('#flash',{opacity:1},3.9).to('#flash',{opacity:0,duration:.5,ease:'power2.out'},3.92);
tl.fromTo('#orb',{scale:0,opacity:1},{scale:1.2,opacity:1,duration:.5,ease:'power3.out',immediateRender:false},3.9).to('#orb',{scale:.9,duration:1.2,ease:'sine.inOut',repeat:3,yoyo:true},4.4);
rings.forEach((r,i)=>tl.fromTo(r,{scale:0,opacity:1},{scale:i?18:11,opacity:0,duration:1.1,ease:'power2.out',immediateRender:false},3.9+i*.18));
dots.forEach((d,i)=>{const a=rnd()*Math.PI*2,r=300+rnd()*620;
  tl.fromTo(d,{x:0,y:0,opacity:1,scale:1},{x:Math.cos(a)*r,y:Math.sin(a)*r,opacity:0,scale:.2,duration:.9+rnd()*.6,ease:'power3.out',immediateRender:false},3.9)});
gsap.set('#root',{x:0});tl.to('#root',{x:14,duration:.04,repeat:9,yoyo:true},3.9);
tl.fromTo('#one',{opacity:0,scale:3.2},{opacity:1,scale:1,duration:.45,ease:'power4.out'},3.95);
tl.fromTo('#sub',{opacity:0,y:50},{opacity:1,y:0,duration:.5,ease:'power3.out'},4.7);
// 5.7 orden
chips.forEach((c,i)=>tl.fromTo(c,{x:0,y:0,rotation:0,scale:0},{x:grid[i][0],y:grid[i][1],rotation:0,scale:1,duration:.55,ease:'back.out(1.8)',immediateRender:false},5.7+i*.15));
tl.to('#orb',{opacity:.35,duration:.5},5.5);
// 7.6 marca
tl.fromTo('#bp',{opacity:0,scale:.6},{opacity:1,scale:1,duration:.5,ease:'back.out(2)'},7.6);
tl.to('#bp',{scale:1.05,duration:.35,repeat:3,yoyo:true,ease:'sine.inOut'},8.2);
window.__timelines['main']=tl;tl.seek(0);
</script>
</body>
</html>
