rules:
    label: Reglas
    view:
        list: $/aero/chatbots/models/rule/columns.yaml
        toolbarButtons: create|delete
        recordsPerPage: 20
        defaultSort:
            column: priority
            direction: desc
    form:
        fields:
            priority:
                label: Prioridad
                type: number
                span: left
                default: 0
                comment: "A mayor número, más prioridad. Si dos reglas matchean, gana la de mayor prioridad."
            is_active:
                label: Activa
                type: switch
                span: right
                default: true
            trigger_keywords:
                label: Palabras clave
                type: taglist
                mode: array
                customTags: true
                span: full
                required: true
                comment: "El bot responde si el mensaje entrante contiene cualquiera de estas palabras (sin distinguir mayúsculas)."
            quick_reply_id:
                label: Respuesta rápida
                type: dropdown
                span: full
                emptyOption: — Escribir una respuesta propia —
                comment: "Vincula una respuesta de CRM → Respuestas rápidas (texto, botones o menú). Si eliges una, no hace falta escribir el texto de abajo."
            response_text:
                label: Respuesta propia
                type: textarea
                size: small
                span: full
                trigger:
                    action: show
                    field: quick_reply_id
                    condition: value[]
                comment: "WhatsApp solo soporta *negrita*, _cursiva_, ~tachado~ y `monoespaciado` — títulos, listas y enlaces con formato Markdown no se ven como tal, llegan con los símbolos literales. Para emojis, usá el atajo del sistema: Win+. en Windows, Cmd+Ctrl+Space en Mac."
