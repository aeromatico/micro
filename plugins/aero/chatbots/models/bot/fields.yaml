fields:
    name:
        label: Nombre del bot
        span: left
        comment: "Para identificarlo en la lista y en el sistema (logs, notificaciones). Opcional — si lo dejás vacío, se genera uno solo a partir de la cuenta. Aplica a los tres modos activos."

    reply_mode:
        label: Modo de respuesta
        type: balloon-selector
        span: full
        default: autoresponder
        options:
            disabled: Desactivar
            autoresponder: Chatbot
            ai: "Chatbot IA"
            super_ai: "Super Chatbot IA"
        comment: "Desactivar = la cuenta queda completamente desconectada del bot, no responde nada (ni reglas ni IA). Chatbot = solo reglas + mensaje por defecto (pestaña Chatbot). Chatbot IA y Super Chatbot IA = usan el conector/modelo/prompt de abajo; Super Chatbot IA además consulta datos reales del tenant (pestaña Super Chatbot IA)."

    account_id:
        label: Cuenta
        type: dropdown
        span: left
        required: true
        comment: "Número o cuenta social conectada en Aero.Hello que este bot va a contestar. Aplica a los tres modos activos (no a Desactivar)."
        trigger:
            action: show
            field: reply_mode
            condition: value[autoresponder][ai][super_ai]

    ai_connector_id:
        label: Conector de IA
        type: dropdown
        span: left
        emptyOption: "(elegir un conector)"
        comment: "Los conectores se administran en Aero.Connector. Aplica a los modos Chatbot IA y Super Chatbot IA."
        trigger:
            action: show
            field: reply_mode
            condition: value[ai][super_ai]

    ai_model:
        label: Modelo
        type: dropdown
        span: right
        dependsOn: ai_connector_id
        emptyOption: "(elegir un conector primero)"
        comment: "Catálogo predefinido de modelos del conector elegido."
        trigger:
            action: show
            field: reply_mode
            condition: value[ai][super_ai]

    ai_system_prompt:
        label: Prompt del sistema
        type: textarea
        size: small
        span: full
        comment: "Define cómo se presenta el bot en la conversación (nombre de personaje, tono, comportamiento) — distinto del 'Nombre del bot' de arriba, que es solo para identificarlo en el sistema. Aplica a los modos Chatbot IA y Super Chatbot IA. Vacío = se usa un prompt genérico de atención por WhatsApp en español."
        trigger:
            action: show
            field: reply_mode
            condition: value[ai][super_ai]

tabs:
    suppressTabs: true
    fields:
        tenant_id:
            label: Tenant
            type: dropdown
            span: left
            comment: "Solo lo elige el superadmin; a un tenant admin se le asigna automáticamente y el campo queda oculto."

        fallback_message:
            label: Mensaje por defecto
            type: textarea
            size: small
            span: full
            comment: "Se envía cuando el mensaje entrante no matchea ninguna regla, SOLO en modo Chatbot. En modo Chatbot IA/Super Chatbot IA, si la IA falla no se responde nada antes que mandar un texto genérico. Vacío = el bot no responde en ese caso. WhatsApp solo soporta *negrita*, _cursiva_, ~tachado~ y `monoespaciado`. Para emojis, usá el atajo del sistema: Win+. en Windows, Cmd+Ctrl+Space en Mac."

secondaryTabs:
    fields:
        handoff_minutes:
            label: Pausa tras respuesta humana (minutos)
            type: number
            span: left
            default: 15
            comment: "Si un agente responde manualmente la conversación, el bot deja de contestar por este tiempo. Opcional, usa 15 si lo dejás vacío."

        ai_tool_categories:
            label: Fuentes de datos en tiempo real
            type: checkboxlist
            span: full
            comment: "Exclusivo del modo Super Chatbot IA. El bot podrá consultar datos reales y actualizados de las fuentes que marques acá en vez de depender solo del prompt."
