1.0.0:
    - "Primera versión: chatbots de reglas simples por cuenta de Aero.Hello, con
      pausa automática (handoff) cuando un humano responde manualmente."
    - create_bots_table.php
    - create_rules_table.php
    - create_conversation_states_table.php
    - create_logs_table.php

1.0.1:
    - Otorga los permisos de chatbots a los roles tenant_admin y superadmin.
    - grant_tenant_admin_permissions.php

1.1.0:
    - "Respuestas con IA: cuando ninguna regla matchea, el bot puede usar un
      Connector de Aero.Connector (OpenRouter, OpenCode Zen, Kilocode, etc.)
      y un modelo del catálogo predefinido, antes de caer al mensaje por
      defecto. Cobro opcional en créditos por respuesta de IA."
    - add_ai_fields_to_bots_table.php

1.2.0:
    - "Catálogo de modelos de IA y su costo en créditos pasa a ser un menú
      global 'Configuración' solo para superadmin (antes eran campos en cada
      bot, editables por tenant admins)."
    - create_ai_models_table.php
    - drop_ai_credit_fields_from_bots_table.php

1.3.0:
    - "Interruptor explícito 'Modo IA activo': antes la IA se intentaba
      automáticamente con solo elegir un conector. Ahora hay que prenderla a
      propósito, para alternar entre modo IA y modo respondedor simple sin
      perder la configuración."
    - add_ai_enabled_to_bots_table.php

1.4.0:
    - "El switch 'Modo IA activo' pasa a ser un selector de 3 modos:
      Autorespondedor / IA / Súper IA (reservado). La config de IA se muda a
      su propio tab superior 'Chatbot IA', y el tab 'Reglas' se renombra a
      'Chatbot'. Reintento automático + logging cuando la IA falla."
    - add_reply_mode_to_bots_table.php
