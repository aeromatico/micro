1.0.0:
    - "Primera version: catalogo de servicios con categorias, modalidad de cobro y vinculo opcional a plugins."
    - create_services_tables.php
    - grant_services_to_superadmin.php
1.1.0:
    - "Precio en dinero, en creditos (Aero.Credits) o ambos, e indicador de funciones PRO con su lista."
    - add_pricing_modes_and_pro_to_services.php
1.2.0:
    - "Pestana Documentacion: enlaza uno o mas articulos de Aero.Docs a cada servicio."
    - create_service_article_table.php
1.3.0:
    - "Relaciones plugin-servicio: Construido con / Se integra con / Recomendado para."
    - migrate_plugin_link_relations.php
1.4.0:
    - "Campo code (HTML de la pagina de la oferta) y generador de ofertas con IA a partir de los plugins ligados."
    - add_code_to_services.php
1.5.0:
    - "Switch Publico (is_active) y En el megamenu (in_megamenu); componente Services para el megamenu y la pagina /servicio/{slug}."
    - add_in_megamenu_to_services.php
1.6.0:
    - "Colecciones de servicios: agrupan servicios afines (un servicio puede estar en varias), con su propia seccion en el menu."
    - create_service_collections_table.php
1.7.0:
    - "Pestana Precio y entrega: ahora es un repetidor de Planes (varios planes por servicio, cada uno con su modalidad, precio y entrega)."
    - add_plans_to_services.php
1.8.0:
    - "Compra de servicios: el tenant paga un plan con sus créditos o su saldo en Bs (Aero.Credits) desde el nuevo panel «Servicios» (sin permiso, como Wallet); el superadmin entrega o cancela cada compra desde Servicios → Compras. plan_snapshot congela el plan comprado aunque el catálogo cambie después."
    - create_service_purchases_table.php
1.9.0:
    - "Un servicio puede tener varias categorías (tabla pivote; se migran las existentes). Formulario reorganizado por pestañas: General, Contenido, Planes, Página, Plataforma, Publicación."
    - create_category_service_table.php
1.10.0:
    - "Jerarquía Colección → Categorías → Servicios (ambas múltiples). El vínculo directo colección↔servicio se migra a categorías y se elimina."
    - create_collection_category_table.php
1.11.0:
    - "Guías interactivas en el servicio: pestaña Documentación con relación múltiple a las guías de Aero.Docs; las publicadas se muestran dentro de /servicio/{slug}."
    - create_service_guide_table.php

1.12.0:
    - "Menú público de servicios: GET /api/v1/services/menu (solo lectura, caché 10 min, throttle) devuelve el megamenú agrupado por categoría con enlaces absolutos a market.com.bo, para que otros sitios (boliviahost.com) lo incrusten. El megamenú y el endpoint comparten Classes\\PublicMenu."

1.13.0:
    - "Ícono (nombre de Lucide) por servicio, editable en la pestaña General, y semilla inicial para los servicios publicados. El menú público (/api/v1/services/menu) ahora incluye icon y summary de cada servicio."
    - add_icon_to_services.php
    - seed_service_icons.php

1.14.0:
    - "Video de YouTube por servicio: campo ID o URL en la pestaña Contenido (se normaliza al ID de 11 caracteres y se valida). La página pública /plugin/{slug} lo muestra como tarjeta con póster y reproductor diferido (youtube-nocookie, carga el iframe solo al pulsar play)."
    - add_youtube_to_services.php

1.15.0:
    - "Video local como alternativa a YouTube: interruptor «Usar video local (Medios)» que alterna entre el campo de YouTube y un archivo de la biblioteca de medios (mp4/webm/mov) con póster opcional. La página /plugin/{slug} lo reproduce con el mismo diseño (video nativo, play diferido)."
    - add_video_media_to_services.php

1.16.0:
    - "Videos del servicio como repetidor: cada video lleva título, fuente (YouTube o Medios) y versión horizontal 16:9 y/o vertical 9:16 con póster opcional. El video único anterior pasa a ser el primer ítem. En /plugin/{slug} el visitante cambia de video y de formato; en móvil se muestra por defecto la versión vertical."
    - add_videos_repeater_to_services.php

1.16.1:
    - "Precios de los servicios: ahora el precio se adapta al tipo de cobro (suscripción con «/ mes», «/ trimestre» o «/ año», pago único aclarado, gratis, créditos o «A cotizar»), y las fichas de rubro muestran «A cotizar» cuando aún no hay planes."
