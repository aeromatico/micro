fields:
    name:
        label: Nombre
        span: left
        required: true
    slug:
        label: Slug
        span: right
        preset:
            field: name
            type: slug
    icon:
        label: Icono
        comment: Clase de icono opcional (ej. icon-shopping-cart).
        span: left
    sort_order:
        label: Orden
        type: number
        default: 0
        span: right
    description:
        label: Descripción
        type: textarea
        size: small
    services:
        label: Servicios
        commentAbove: Servicios de esta categoría (un servicio puede estar en varias).
        type: relation
        nameFrom: name
    collections:
        label: Colecciones
        commentAbove: Colecciones en las que aparece esta categoría.
        type: relation
        nameFrom: name
    is_active:
        label: Activa
        type: switch
        default: true
