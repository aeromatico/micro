fields:
    name:
        label: Nombre
        span: left
        required: true
    slug:
        label: Slug
        span: right
        preset:
            field: name
            type: slug
    icon:
        label: Icono
        comment: Clase de icono opcional (ej. icon-th-large).
        span: left
    sort_order:
        label: Orden
        type: number
        default: 0
        span: right
    summary:
        label: Resumen
        comment: Una línea para tarjetas y listados.
        type: text
    description:
        label: Descripción
        type: textarea
        size: small
    categories:
        label: Categorías
        commentAbove: Categorías incluidas en esta colección; sus servicios aparecen en ella.
        type: relation
        nameFrom: name
    is_active:
        label: Activa
        type: switch
        default: true
