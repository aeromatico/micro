fields:
    name:
        label: Nombre del servicio
        span: left
        required: true
    slug:
        label: Slug
        span: right
        preset:
            field: name
            type: slug

tabs:
    fields:
        categories:
            tab: General
            label: Categorías
            commentAbove: Puede pertenecer a varias; aparece en el megamenú bajo cada una. Las categorías se agrupan en colecciones.
            type: relation
            nameFrom: name
            span: left
        icon:
            tab: General
            label: Ícono
            comment: Nombre de un ícono de Lucide (p. ej. message-circle, qr-code). Lo usan los menús de otros sitios.
            type: text
            span: left
        summary:
            tab: General
            label: Resumen
            comment: Una línea para tarjetas y listados.
            type: textarea
            size: small
            span: right
        videos:
            tab: Contenido
            label: Videos
            commentAbove: Se muestran en la página pública del servicio, justo debajo del encabezado. Cada video puede tener versión horizontal (16:9, escritorio) y vertical (9:16, shorts; es la que se muestra por defecto en móvil). Si hay más de uno, el visitante cambia de video.
            type: repeater
            prompt: Agregar video
            titleFrom: title
            minItems: 0
            form:
                fields:
                    title:
                        label: Título del video
                        comment: Aparece en el selector cuando hay más de un video.
                        placeholder: Cómo funciona
                        span: left
                    use_media:
                        label: Usar video local (Medios)
                        comment: Apagado, el video es de YouTube. Encendido, se usa un archivo de la biblioteca de medios.
                        type: switch
                        span: right
                    youtube:
                        label: YouTube · horizontal 16:9
                        commentAbove: URL (watch, youtu.be…) o ID de 11 caracteres.
                        placeholder: https://www.youtube.com/watch?v=...
                        span: left
                        trigger:
                            action: hide
                            field: use_media
                            condition: checked
                    youtube_vertical:
                        label: YouTube · vertical 9:16 (Short)
                        commentAbove: Opcional. URL del Short o ID.
                        placeholder: https://www.youtube.com/shorts/...
                        span: right
                        trigger:
                            action: hide
                            field: use_media
                            condition: checked
                    media:
                        label: Video local · horizontal 16:9
                        commentAbove: mp4 (H.264), webm o mov de la biblioteca de medios.
                        type: mediafinder
                        mode: file
                        span: left
                        trigger:
                            action: show
                            field: use_media
                            condition: checked
                    media_vertical:
                        label: Video local · vertical 9:16
                        commentAbove: Opcional. Versión pensada para móvil / shorts.
                        type: mediafinder
                        mode: file
                        span: right
                        trigger:
                            action: show
                            field: use_media
                            condition: checked
                    poster:
                        label: Póster horizontal (opcional)
                        commentAbove: Imagen antes de reproducir. Vacío = primer cuadro del video.
                        type: mediafinder
                        mode: image
                        imageWidth: 200
                        span: left
                    poster_vertical:
                        label: Póster vertical (opcional)
                        type: mediafinder
                        mode: image
                        imageWidth: 120
                        span: right
        description:
            tab: Contenido
            label: Descripción completa
            type: markdown
            size: giant
        features:
            tab: Contenido
            label: Qué incluye
            type: repeater
            prompt: Agregar ítem
            form:
                fields:
                    text:
                        label: Ítem
                        type: text
        requirements:
            tab: Contenido
            label: Qué necesitamos del cliente
            type: repeater
            prompt: Agregar requisito
            form:
                fields:
                    text:
                        label: Requisito
                        type: text
        code:
            tab: Página
            label: Página de la oferta (HTML)
            commentAbove: Contenido HTML de la página del servicio. Lo genera «Generar oferta con IA» (php artisan services:build-offer) y se puede editar a mano.
            type: codeeditor
            language: html
            size: giant
            stretch: true
        cover:
            tab: General
            label: Imagen de portada
            type: fileupload
            mode: image
            imageWidth: 240
            imageHeight: 160

        plans:
            tab: Precio y entrega
            label: Planes
            commentAbove: Uno o más planes que el cliente puede elegir para este servicio (p. ej. Básico / PRO, o Mensual / Anual).
            type: repeater
            prompt: Agregar plan
            titleFrom: name
            form:
                fields:
                    name:
                        label: Nombre del plan
                        span: left
                        required: true
                    price_from:
                        label: Mostrar como "desde"
                        type: switch
                        span: right
                    type:
                        label: Modalidad de cobro
                        type: dropdown
                        options: Aero\Services\Classes\PlanOptions::typeOptions
                        span: left
                        default: one_time
                    billing_period:
                        label: Periodo de cobro
                        type: dropdown
                        options: Aero\Services\Classes\PlanOptions::billingPeriodOptions
                        span: right
                        trigger:
                            action: show
                            field: type
                            condition: value[recurring]
                    pricing_mode:
                        label: Se ofrece en
                        type: dropdown
                        options: Aero\Services\Classes\PlanOptions::pricingModeOptions
                        default: money
                        span: left
                        trigger:
                            action: hide
                            field: type
                            condition: value[free]
                    delivery_days:
                        label: Plazo de entrega (días)
                        type: number
                        span: right
                    section_money:
                        label: Dinero (Bs)
                        type: section
                        comment: Precio cobrado del saldo en Bs del cliente.
                        trigger:
                            action: show
                            field: pricing_mode
                            condition: value[money] value[both]
                    price:
                        label: Precio
                        comment: Déjalo vacío para "a cotizar".
                        type: number
                        step: 0.01
                        span: left
                        trigger:
                            action: show
                            field: pricing_mode
                            condition: value[money] value[both]
                    currency:
                        label: Moneda
                        type: dropdown
                        options: Aero\Services\Classes\PlanOptions::currencyOptions
                        default: BOB
                        span: right
                        trigger:
                            action: show
                            field: pricing_mode
                            condition: value[money] value[both]
                    setup_fee:
                        label: Costo de implementación en Bs (una vez)
                        comment: Se suma al precio solo en el primer cobro.
                        type: number
                        step: 0.01
                        span: left
                        trigger:
                            action: show
                            field: pricing_mode
                            condition: value[money] value[both]
                    section_credits:
                        label: Créditos (monedas)
                        type: section
                        comment: Precio cobrado de las monedas del cliente.
                        trigger:
                            action: show
                            field: pricing_mode
                            condition: value[credits] value[both]
                    credit_type:
                        label: Tipo de crédito
                        type: dropdown
                        options: Aero\Services\Classes\PlanOptions::creditTypeOptions
                        emptyOption: '— Elige —'
                        span: left
                        trigger:
                            action: show
                            field: pricing_mode
                            condition: value[credits] value[both]
                    credit_price:
                        label: Precio en créditos
                        comment: Créditos por cobro (por periodo si es recurrente).
                        type: number
                        span: right
                        trigger:
                            action: show
                            field: pricing_mode
                            condition: value[credits] value[both]
                    credit_setup_fee:
                        label: Costo de implementación en créditos (una vez)
                        comment: Se suma al precio solo en el primer cobro, en el mismo tipo de crédito.
                        type: number
                        span: left
                        trigger:
                            action: show
                            field: pricing_mode
                            condition: value[credits] value[both]

        plugin_links:
            tab: Plataforma
            label: Plugins ligados
            commentAbove: 'Opcional; vacío = servicio genérico. Se lee siempre desde el servicio: «Este servicio está CONSTRUIDO CON el plugin X» (es su base) · «se INTEGRA CON el plugin X» (se conecta, pero funciona sin él) · «es RECOMENDADO PARA quienes usan el plugin X» (le conviene a esos clientes).'
            type: repeater
            prompt: Ligar un plugin
            form:
                fields:
                    plugin:
                        label: Plugin
                        type: dropdown
                        showSearch: true
                        options: Aero\Services\Classes\PluginCatalog::pluginOptions
                        span: left
                    relation:
                        label: Relación
                        type: dropdown
                        options: Aero\Services\Classes\PluginCatalog::relationOptions
                        default: integrates
                        span: right
                    note:
                        label: Nota
                        comment: Detalle opcional, p. ej. qué parte se integra.
                        type: text

        articles:
            tab: Documentación
            label: Documentos del servicio
            commentAbove: Artículos de Aero.Docs que explican o acompañan este servicio. Se pueden elegir varios.
            type: relation
            nameFrom: select_label
            scope: platform

        guides:
            tab: Documentación
            label: Guías interactivas del servicio
            commentAbove: Guías de Aero.Docs que se muestran dentro de la página pública del servicio, una debajo de otra. Se pueden elegir varias; solo se ven las que están publicadas.
            type: relation
            nameFrom: select_label
            scope: platform

        is_active:
            tab: Publicación
            label: Público
            comment: Visible en el sitio, en /plugin/{slug}. Apagado = borrador.
            type: switch
            default: true
            span: left
        in_megamenu:
            tab: Publicación
            label: Mostrar en el megamenú
            comment: Aparece en el menú «Servicios» del sitio (solo si es público).
            type: switch
            span: right
        has_pro:
            tab: Publicación
            label: Tiene funciones PRO
            comment: Marca si parte del servicio requiere el plan PRO.
            type: switch
            span: right
        pro_features:
            tab: Publicación
            label: Funciones PRO
            type: repeater
            prompt: Agregar función PRO
            form:
                fields:
                    text:
                        label: Función
                        type: text
            trigger:
                action: show
                field: has_pro
                condition: checked
        is_featured:
            tab: Publicación
            label: Destacado
            type: switch
            span: left
        sort_order:
            tab: Publicación
            label: Orden
            type: number
            default: 0
            span: left
