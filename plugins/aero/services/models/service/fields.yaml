fields:
    name:
        label: Nombre del servicio
        span: left
        required: true
    slug:
        label: Slug
        span: right
        preset:
            field: name
            type: slug
    category_id:
        label: Categoría
        type: dropdown
        emptyOption: '— Sin categoría —'
        span: left
    summary:
        label: Resumen
        comment: Una línea para tarjetas y listados.
        span: right
        type: text
tabs:
    fields:
        description:
            tab: Descripción
            label: Descripción completa
            type: markdown
            size: giant
        features:
            tab: Descripción
            label: Qué incluye
            type: repeater
            prompt: Agregar ítem
            form:
                fields:
                    text:
                        label: Ítem
                        type: text
        requirements:
            tab: Descripción
            label: Qué necesitamos del cliente
            type: repeater
            prompt: Agregar requisito
            form:
                fields:
                    text:
                        label: Requisito
                        type: text
        code:
            tab: Página
            label: Página de la oferta (HTML)
            commentAbove: Contenido HTML de la página del servicio. Lo genera «Generar oferta con IA» (php artisan services:build-offer) y se puede editar a mano.
            type: codeeditor
            language: html
            size: giant
            stretch: true
        cover:
            tab: Descripción
            label: Imagen de portada
            type: fileupload
            mode: image
            imageWidth: 240
            imageHeight: 160

        type:
            tab: Precio y entrega
            label: Modalidad de cobro
            type: dropdown
            span: left
            default: one_time
        billing_period:
            tab: Precio y entrega
            label: Periodo de cobro
            type: dropdown
            span: right
            trigger:
                action: show
                field: type
                condition: value[recurring]
        pricing_mode:
            tab: Precio y entrega
            label: Se ofrece en
            type: dropdown
            default: money
        price:
            tab: Precio y entrega
            label: Precio
            comment: Déjalo vacío para "a cotizar".
            type: number
            step: 0.01
            span: left
            trigger:
                action: show
                field: pricing_mode
                condition: value[money] value[both]
        currency:
            tab: Precio y entrega
            label: Moneda
            type: dropdown
            span: right
            default: BOB
            options:
                BOB: Bolivianos (BOB)
                USD: Dólares (USD)
            trigger:
                action: show
                field: pricing_mode
                condition: value[money] value[both]
        price_from:
            tab: Precio y entrega
            label: Mostrar como "desde"
            type: switch
            span: left
        setup_fee:
            tab: Precio y entrega
            label: Costo de implementación (una vez)
            type: number
            step: 0.01
            span: right
            trigger:
                action: show
                field: pricing_mode
                condition: value[money] value[both]
        credit_price:
            tab: Precio y entrega
            label: Precio en créditos
            comment: Créditos por cobro (por periodo si es recurrente).
            type: number
            span: left
            trigger:
                action: show
                field: pricing_mode
                condition: value[credits] value[both]
        credit_type:
            tab: Precio y entrega
            label: Tipo de crédito
            type: dropdown
            emptyOption: '— Elige —'
            span: right
            trigger:
                action: show
                field: pricing_mode
                condition: value[credits] value[both]
        delivery_days:
            tab: Precio y entrega
            label: Plazo de entrega (días)
            type: number
            span: left

        plugin_links:
            tab: Plataforma
            label: Plugins ligados
            commentAbove: 'Opcional; vacío = servicio genérico. Se lee siempre desde el servicio: «Este servicio está CONSTRUIDO CON el plugin X» (es su base) · «se INTEGRA CON el plugin X» (se conecta, pero funciona sin él) · «es RECOMENDADO PARA quienes usan el plugin X» (le conviene a esos clientes).'
            type: repeater
            prompt: Ligar un plugin
            form:
                fields:
                    plugin:
                        label: Plugin
                        type: dropdown
                        showSearch: true
                        options: Aero\Services\Classes\PluginCatalog::pluginOptions
                        span: left
                    relation:
                        label: Relación
                        type: dropdown
                        options: Aero\Services\Classes\PluginCatalog::relationOptions
                        default: integrates
                        span: right
                    note:
                        label: Nota
                        comment: Detalle opcional, p. ej. qué parte se integra.
                        type: text

        articles:
            tab: Documentación
            label: Documentos del servicio
            commentAbove: Artículos de Aero.Docs que explican o acompañan este servicio. Se pueden elegir varios.
            type: relation
            nameFrom: select_label
            scope: platform

        is_active:
            tab: Publicación
            label: Activo
            type: switch
            default: true
            span: left
        has_pro:
            tab: Publicación
            label: Tiene funciones PRO
            comment: Marca si parte del servicio requiere el plan PRO.
            type: switch
            span: right
        pro_features:
            tab: Publicación
            label: Funciones PRO
            type: repeater
            prompt: Agregar función PRO
            form:
                fields:
                    text:
                        label: Función
                        type: text
            trigger:
                action: show
                field: has_pro
                condition: checked
        is_featured:
            tab: Publicación
            label: Destacado
            type: switch
            span: right
        sort_order:
            tab: Publicación
            label: Orden
            type: number
            default: 0
            span: left
