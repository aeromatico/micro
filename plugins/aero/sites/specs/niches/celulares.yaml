name: Celulares y Accesorios
handle: celulares
icon: icon-mobile

features:
  pages: true
  contact: true
  seo: true
  store: false   # fase futura: catálogo/tienda integrada

default_pages:
  - title: "Inicio"
    slug: ""
    layout: home
    is_published: true
    sort_order: 1
    content: "<h1>Bienvenidos a {name}</h1><p>Celulares, accesorios y servicio técnico. Consultá disponibilidad.</p>"
  - title: "Productos y Servicios"
    slug: "productos"
    layout: default
    is_published: true
    sort_order: 2
  - title: "Nosotros"
    slug: "nosotros"
    layout: default
    is_published: true
    sort_order: 3
  - title: "Contacto"
    slug: "contacto"
    layout: contact
    is_published: true
    sort_order: 99

seo_defaults:
  title_format: "%s | {name}"
  default_description: "{name} — Celulares, accesorios y servicio técnico. Consultá disponibilidad."
  sitemap_enabled: true
  robots_txt: "User-agent: *\nAllow: /"

contact_defaults:
  form_enabled: true
  success_message: "¡Gracias! Te responderemos a la brevedad sobre tu consulta o pedido."

recommended_notification: whatsapp

base_prompt: |
  [Nombre del negocio] vende [celulares nuevos/usados, accesorios, repuestos] y ofrece
  [reparación y servicio técnico] en [ciudad/zona]. Llevamos [X años] en el rubro y trabajamos
  con [marcas/proveedores]. Nos destacamos por [diferenciador: precio, garantía, rapidez de
  reparación, variedad de accesorios]. Buscamos transmitir confianza en la calidad y garantía
  del servicio.
tone_instructions: "Directo y confiable, priorizando precio, garantía y rapidez de servicio sobre lenguaje comercial genérico."
target_audience: "Personas buscando comprar o reparar un celular, comparando por precio, garantía y confianza en el vendedor."
