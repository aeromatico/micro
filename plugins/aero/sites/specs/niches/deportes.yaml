name: Artículos Deportivos
handle: deportes
icon: icon-futbol-o

features:
  pages: true
  contact: true
  seo: true
  store: false   # fase futura: catálogo/tienda integrada

default_pages:
  - title: "Inicio"
    slug: ""
    layout: home
    is_published: true
    sort_order: 1
    content: "<h1>Bienvenidos a {name}</h1><p>Todo lo que necesitás para tu deporte favorito, en un solo lugar.</p>"
  - title: "Productos"
    slug: "productos"
    layout: default
    is_published: true
    sort_order: 2
  - title: "Nosotros"
    slug: "nosotros"
    layout: default
    is_published: true
    sort_order: 3
  - title: "Contacto"
    slug: "contacto"
    layout: contact
    is_published: true
    sort_order: 99

seo_defaults:
  title_format: "%s | {name}"
  default_description: "{name} — Artículos e indumentaria deportiva. Encontrá lo que necesitás para entrenar."
  sitemap_enabled: true
  robots_txt: "User-agent: *\nAllow: /"

contact_defaults:
  form_enabled: true
  success_message: "¡Gracias! Te responderemos a la brevedad sobre tu consulta o pedido."

recommended_notification: whatsapp

base_prompt: |
  [Nombre del negocio] vende artículos e indumentaria deportiva en [ciudad/zona], especializado
  en [deportes/marcas/categorías: fútbol, running, gimnasio, ciclismo, etc.]. Contamos con
  [X años] en el rubro y trabajamos con [marcas propias/reconocidas]. Nos destacamos por
  [diferenciador: variedad, precio, asesoramiento, calidad, envíos]. Buscamos transmitir
  pasión por el deporte y confianza en la calidad de los productos.
tone_instructions: "Dinámico y cercano al lenguaje deportivo, entusiasta sin ser exagerado; priorizar variedad y calidad de producto sobre adjetivos vacíos."
target_audience: "Deportistas amateur y aficionados buscando equipamiento, comparando por precio, variedad y calidad de marca."
