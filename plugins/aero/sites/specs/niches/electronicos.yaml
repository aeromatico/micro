name: Electrónicos
handle: electronicos
icon: icon-desktop

features:
  pages: true
  contact: true
  seo: true
  store: false   # fase futura: catálogo/tienda integrada

default_pages:
  - title: "Inicio"
    slug: ""
    layout: home
    is_published: true
    sort_order: 1
    content: "<h1>Bienvenidos a {name}</h1><p>Tecnología y electrónica al mejor precio. Consultá nuestro catálogo.</p>"
  - title: "Productos"
    slug: "productos"
    layout: default
    is_published: true
    sort_order: 2
  - title: "Nosotros"
    slug: "nosotros"
    layout: default
    is_published: true
    sort_order: 3
  - title: "Contacto"
    slug: "contacto"
    layout: contact
    is_published: true
    sort_order: 99

seo_defaults:
  title_format: "%s | {name}"
  default_description: "{name} — Electrónica y tecnología. Conocé nuestro catálogo de productos."
  sitemap_enabled: true
  robots_txt: "User-agent: *\nAllow: /"

contact_defaults:
  form_enabled: true
  success_message: "¡Gracias! Te responderemos a la brevedad sobre tu consulta o pedido."

recommended_notification: whatsapp

base_prompt: |
  [Nombre del negocio] vende [electrodomésticos, computadoras, audio, electrónica en general]
  en [ciudad/zona]. Llevamos [X años] en el rubro y ofrecemos [garantía, servicio técnico,
  marcas trabajadas]. Nos destacamos por [diferenciador: precio, garantía, financiamiento,
  atención técnica]. Buscamos transmitir confianza técnica sin caer en tecnicismos
  innecesarios.
tone_instructions: "Directo y confiable, priorizando especificaciones y garantía sobre lenguaje comercial genérico; evitar tecnicismos innecesarios."
target_audience: "Personas comparando dónde comprar tecnología, sensibles a precio, garantía y confianza en el vendedor."
