name: Tienda Rápida WhatsApp
handle: tienda_whatsapp
icon: icon-shopping-cart

features:
  pages: true
  contact: true
  seo: true
  store: false   # fase futura: catálogo de productos

default_pages:
  - title: "Inicio"
    slug: ""
    layout: home
    is_published: true
    sort_order: 1
    content: "<h1>Bienvenidos a {name}</h1><p>Compra fácil y rápido por WhatsApp. ¡Pide lo que necesitas ahora!</p>"
  - title: "Catálogo"
    slug: "catalogo"
    layout: default
    is_published: true
    sort_order: 2
  - title: "Cómo Comprar"
    slug: "como-comprar"
    layout: default
    is_published: true
    sort_order: 3
  - title: "Contacto"
    slug: "contacto"
    layout: contact
    is_published: true
    sort_order: 99

seo_defaults:
  title_format: "%s | {name}"
  default_description: "{name} — Compra fácil y rápido por WhatsApp. Envíos disponibles."
  sitemap_enabled: true
  robots_txt: "User-agent: *\nAllow: /"

contact_defaults:
  form_enabled: true
  success_message: "¡Pedido recibido! Te contactaremos por WhatsApp para confirmar."

recommended_notification: whatsapp

base_prompt: |
  [Nombre de la tienda] vende [tipo de productos] por WhatsApp en [ciudad/zona]. Ofrecemos
  [productos/catálogo principal] con [diferenciador: precios, variedad, rapidez de entrega,
  atención personalizada, envíos, etc.]. Atendemos principalmente a [tipo de cliente objetivo].
  Buscamos transmitir cercanía y confianza para que el cliente compre fácil y rápido por
  WhatsApp.
tone_instructions: "Cercano y práctico, como hablarle a un cliente por WhatsApp. Emojis con moderación solo si el negocio lo amerita."
target_audience: "Compradores que buscan rapidez y confianza para comprar por WhatsApp, sensibles al precio y la atención personalizada."
