name: Radio Emisora
handle: radioemisora
icon: icon-music

features:
  pages: true
  contact: true
  seo: true
  podcast: false   # fase futura: episodios / podcasts

default_pages:
  - title: "Inicio"
    slug: ""
    layout: home
    is_published: true
    sort_order: 1
    content: "<h1>Bienvenidos a {name}</h1><p>Tu radio en línea. Escúchanos en vivo las 24 horas del día.</p>"
  - title: "En Vivo"
    slug: "en-vivo"
    layout: full
    is_published: true
    sort_order: 2
  - title: "Programación"
    slug: "programacion"
    layout: default
    is_published: true
    sort_order: 3
  - title: "El Equipo"
    slug: "el-equipo"
    layout: default
    is_published: true
    sort_order: 4
  - title: "Contacto"
    slug: "contacto"
    layout: contact
    is_published: true
    sort_order: 99

seo_defaults:
  title_format: "%s | {name} Radio"
  default_description: "{name} — Tu radio en línea. Escúchanos en vivo las 24 horas."
  sitemap_enabled: true
  robots_txt: "User-agent: *\nAllow: /"

contact_defaults:
  form_enabled: true
  success_message: "¡Gracias por escribirnos! Te responderemos a la brevedad."

recommended_notification: telegram

base_prompt: |
  [Nombre de la radio] transmite [género musical/tipo de contenido] desde [ciudad/zona].
  Llevamos [X años] al aire y contamos con programas como [nombres de programas destacados].
  Nos escuchan principalmente [tipo de oyente]. Nos destacamos por [diferenciador: locutores,
  variedad musical, cobertura en vivo, interacción con oyentes, etc.]. Buscamos transmitir
  energía y cercanía con la comunidad.
tone_instructions: "Enérgico y cercano, con personalidad de marca radial (puede ser informal según el estilo de la radio)."
target_audience: "Oyentes actuales y potenciales, además de posibles anunciantes/patrocinadores."
