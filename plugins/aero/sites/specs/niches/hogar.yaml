name: Artículos para el Hogar
handle: hogar
icon: icon-bed

features:
  pages: true
  contact: true
  seo: true
  store: false   # fase futura: catálogo/tienda integrada

default_pages:
  - title: "Inicio"
    slug: ""
    layout: home
    is_published: true
    sort_order: 1
    content: "<h1>Bienvenidos a {name}</h1><p>Todo para decorar y equipar tu hogar, en un solo lugar.</p>"
  - title: "Productos"
    slug: "productos"
    layout: default
    is_published: true
    sort_order: 2
  - title: "Nosotros"
    slug: "nosotros"
    layout: default
    is_published: true
    sort_order: 3
  - title: "Contacto"
    slug: "contacto"
    layout: contact
    is_published: true
    sort_order: 99

seo_defaults:
  title_format: "%s | {name}"
  default_description: "{name} — Muebles y artículos para el hogar. Conocé nuestro catálogo."
  sitemap_enabled: true
  robots_txt: "User-agent: *\nAllow: /"

contact_defaults:
  form_enabled: true
  success_message: "¡Gracias! Te responderemos a la brevedad sobre tu consulta o pedido."

recommended_notification: whatsapp

base_prompt: |
  [Nombre del negocio] vende [muebles, decoración, menaje, electrodomésticos, etc.] para el
  hogar en [ciudad/zona]. Llevamos [X años] en el rubro y trabajamos con [marcas/proveedores].
  Nos destacamos por [diferenciador: variedad, precio, calidad, envíos, facilidades de pago].
  Buscamos transmitir confianza y variedad de surtido.
tone_instructions: "Cálido y práctico, evocando el hogar sin sonar cursi; priorizar variedad, calidad y precio sobre adjetivos vacíos."
target_audience: "Personas amoblando o renovando su hogar, comparando por variedad, precio y facilidades de pago."
