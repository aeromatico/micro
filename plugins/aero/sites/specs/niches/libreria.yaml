name: Librería
handle: libreria
icon: icon-book

features:
  pages: true
  contact: true
  seo: true
  store: false   # fase futura: catálogo/tienda integrada

default_pages:
  - title: "Inicio"
    slug: ""
    layout: home
    is_published: true
    sort_order: 1
    content: "<h1>Bienvenidos a {name}</h1><p>Libros, útiles escolares y de oficina. Todo para estudiar y trabajar.</p>"
  - title: "Productos"
    slug: "productos"
    layout: default
    is_published: true
    sort_order: 2
  - title: "Nosotros"
    slug: "nosotros"
    layout: default
    is_published: true
    sort_order: 3
  - title: "Contacto"
    slug: "contacto"
    layout: contact
    is_published: true
    sort_order: 99

seo_defaults:
  title_format: "%s | {name}"
  default_description: "{name} — Librería, útiles escolares y de oficina."
  sitemap_enabled: true
  robots_txt: "User-agent: *\nAllow: /"

contact_defaults:
  form_enabled: true
  success_message: "¡Gracias! Te responderemos a la brevedad sobre tu consulta o pedido."

recommended_notification: whatsapp

base_prompt: |
  [Nombre de la librería] vende [libros, útiles escolares, artículos de oficina, papelería,
  etc.] en [ciudad/zona]. Llevamos [X años] atendiendo a [tipo de cliente: estudiantes,
  oficinas, colegios]. Nos destacamos por [diferenciador: variedad, precio, atención,
  servicios de fotocopiado/impresión]. Buscamos transmitir confianza y variedad de surtido.
tone_instructions: "Cercano y práctico, priorizando variedad y utilidad del surtido sobre lenguaje comercial genérico."
target_audience: "Estudiantes, padres de familia y oficinas buscando útiles y materiales, comparando por variedad y precio."
