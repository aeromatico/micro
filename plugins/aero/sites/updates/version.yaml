    - add_ai_guidance_to_archetypes.php

1.11.0:
    - Selección de arquetipo por afinidad de keywords (en vez de al azar), validación
      del JSON generado contra campos requeridos del catálogo + límites de longitud,
      imagen de fondo opcional en el Hero, y efectos de scroll-reveal/hover con
      toggle simple (DesignTheme.enable_animations).
    - add_enable_animations_to_design_themes.php

1.12.0:
    - Paleta dual (claro/oscuro) por DesignTheme + toggle de modo claro/oscuro
      en el tema microsites, catálogo de temas gestionable desde el admin,
      selector de DesignTheme + personalización de color en SiteSettings,
      y fondos neutros/transparentes por defecto en los bloques Puck.
    - add_dual_palette_to_design_themes.php

1.13.0:
    - Tercera fuente configurable por DesignTheme para encabezados secundarios
      (h2-h6), separada del h1 y del body.
    - add_second_heading_font.php
1.14.0:
    - Habilita el menú "Mensajería" (API keys propias de un tenant sobre
      Aero.Hello) para el rol tenant_admin.
    - grant_hello_api_keys_to_tenant_admin.php

1.15.0:
    - "TenantInvite: invitar a alguien por email/WhatsApp a colaborar en un
      tenant. Crea el Backend\\User si no existe (rol tenant_admin, activación
      vía el flujo nativo de reset password) o solo agrega el TenantUser si ya
      tenía cuenta (p.ej. dueño de otro tenant); en ambos casos el acceso es
      inmediato vía TenantUser + ResolvesCurrentTenant. Notifica por
      Aero.Notify (evento sites.user.invited) si está instalado."
    - create_tenant_invites_table.php

1.16.0:
    - Otorga al rol tenant_admin el resto del contenido de Hello (bandeja,
      llamadas, contactos, plantillas, campañas, publicaciones): cada tenant
      ya gestiona todo su contenido de mensajería, la plataforma se queda
      solo con las conexiones (perfiles/números, cuentas conectadas).
    - grant_hello_content_to_tenant_admin.php

1.17.0:
    - "Habilita la gestión de API keys del gateway Aero.Api (tab
      'Configuración') para el rol tenant_admin, aislada por tenant vía
      owner_type/owner_id — cada uno ve y crea solo las suyas, un superadmin
      sigue viendo todas."
    - grant_api_keys_to_tenant_admin.php

1.18.0:
    - "Prompt base por arquetipo: al elegir un arquetipo en el panel de
      generación con IA, autocompleta el campo de descripción del negocio con
      un texto de ejemplo ya afinado para ese arquetipo (el usuario solo lo
      edita), en vez de partir de un campo en blanco. Cargado por ahora solo
      para el arquetipo Estándar."
    - add_base_prompt_to_archetypes.php

1.19.0:
    - "Selector de 'Modelo de IA' en el panel de generación: además del
      proveedor único de Aero.AiFields (default), se puede elegir un
      Connector de Aero.Connector puntual — deja comparar redacción/estilo
      entre modelos (frontera y chinos) para el mismo prompt. Aumenta
      max_tokens (8000→16000) y agrega timeouts explícitos también del lado
      de SiteGenerator al llamar por Connector, por el mismo motivo que la
      1.17.x (modelos 'reasoning' gastan tokens de pensamiento del mismo
      presupuesto). También suma guía de paleta/tono del DesignTheme
      asignado al prompt del sistema, para que la IA elija tokens de
      color/estilo coherentes con el tema visual del tenant en vez de
      ignorarlo."
    - add_connector_id_to_ai_generations.php

1.20.0:
    - "Prompt base propio por arquetipo (antes solo lo tenía 'Estándar'): cada
      uno de los 9 arquetipos restantes suma su propio texto de ejemplo para
      autocompletar la descripción del negocio, en vez de heredar todos el
      mismo prompt genérico del nicho — así 'Portafolio visual' y 'Enfoque en
      resultados' (por ejemplo) ya no muestran idéntico texto solo por
      compartir nicho inmuebles."
    - add_base_prompt_variants_to_archetypes.php

1.21.0:
    - "Habilita el Dashboard central de October (con sus widgets) para el rol
      tenant_admin, agregando el permiso 'dashboard' que le faltaba — al no
      tenerlo, el menú Dashboard (order=10) quedaba oculto y el tenant
      aterrizaba directo en 'Sitio web' (order=100) tras iniciar sesión."
    - grant_dashboard_to_tenant_admin.php

1.22.0:
    - "Logo de texto opcional en Branding: nombre + fuente de Google Fonts a
      elección, usado en el header/footer del sitio solo cuando no hay logo
      de imagen (la imagen sigue teniendo prioridad si existe)."
    - add_logo_text_to_tenants.php

1.23.0:
    - "Arquetipos 'Estándar' y 'Con estadísticas' pasan a niche_type=NULL
      (universal) — se sembraron con niche_type='generic' por error, dejando
      sin ningún arquetipo a cualquier nicho sin arquetipos propios (incluidos
      los 14 nichos nuevos). Ahora actúan como fallback universal para
      cualquier nicho, presente o futuro, sin arquetipos dedicados."
    - make_generic_archetypes_universal.php

1.24.0:
    - "Los 10 arquetipos existentes quedan relacionados a TODOS los nichos
      (niche_type=NULL en los 8 que todavía tenían uno fijo: consultorio,
      inmuebles, radioemisora, tienda_whatsapp) — cualquier tenant, sea cual
      sea su rubro, ve el catálogo completo de arquetipos en el panel de
      generación con IA, no solo los del propio nicho."
    - relate_all_archetypes_to_all_niches.php

1.25.0:
    - "Rediseño del Editor de Contenidos: pestañas Branding (extraída a un
      trait HasBrandingForm reutilizable) y Componentes (galería de bloques
      embebida) sumadas junto a Inicio; selector de Connector de IA
      disponible también acá; galería de componentes abierta a tenant admins
      como referencia. Nueva sección 'Páginas' (CRUD standalone, separado de
      Inicio) para gestionar el resto de páginas del sitio. Página → Contenido
      ahora tiene selector de tipo (globo): Editor Visual (Puck, como antes),
      Editor HTML (redactor de texto enriquecido) o Código (HTML propio
      pegado a mano) — Contenidos → Inicio también suma la opción Código. En
      pantallas chicas, Editor Visual muestra una invitación a usar una
      computadora en vez del editor de bloques (inutilizable a mano)."
    - add_content_mode_to_pages.php

1.26.0:
    - "Alta pública de tenants en producción: página /alta en el tema master
      con wizard de 2 pasos (subdominio + rubro, luego pago QR propio vía
      aero/qrbo) y creación del administrador al confirmarse el pago. El
      tenant se reserva como 'pending_payment' apenas se elige subdominio
      (bloquea el handle) y se activa solo cuando el webhook de aero/qrbo
      confirma el cobro."
    - add_signup_fields_to_tenants.php

1.27.0:
    - "Baja del sistema de notificaciones propio (NotificationChannel/
      NotificationDispatcher/drivers, controller notificationchannels y su
      pantalla standalone): el contacto ahora dispara
      'sites.contact.submitted' en Aero.Notify (ver
      Jobs\\DispatchContactNotification) y los canales propios del tenant
      (SMTP, WhatsApp, Telegram, Twilio) pasan a Aero\\Notify\\Models\\Channel
      — administrables desde el mismo lugar (SiteSettings → pestaña Canales)
      pero ahora reusables por cualquier evento del gateway, no solo el
      contacto. Requiere que Aero.Notify 1.3.0+ ya haya corrido su migración
      de copia de datos antes de esta baja."
    - drop_notification_channels_table.php

1.28.0:
    - "Primeros disparos reales de Aero.Notify más allá del contacto:
      TenantProvisioner::provisionAdmin() dispara 'sites.tenant.created' (un
      único choke point, cubre alta desde backend y SignupWizard);
      Tenant::afterSave() dispara 'sites.tenant.suspended' cuando status
      cambia a suspended. Ambos guardados con class_exists() (Aero.Sites no
      requiere Aero.Notify). Sin campo 'reason' en Tenant: se manda null, es
      variable opcional del evento."

1.29.0:
    - "Dominio propio opcional en el alta (solo plan Pro, +Bs
      Settings::getDomainRegistrationPrice(), default 129): la disponibilidad
      se busca en vivo desde el navegador contra la API pública de
      clouds.com.bo (otro sitio propio, sin pasar por nuestro backend). El
      dominio elegido se guarda en Tenant::signup_domain y se suma al monto
      del QR de alta — el registro real del dominio queda pendiente, es un
      paso manual del equipo, no hay automatización de compra todavía."
    - add_signup_domain_to_tenants.php

1.30.0:
    - "El cargo por registrar dominio propio baja de Bs 129 a Bs 99 (default,
      configurable en Settings > Sites). Nuevo: junto a cada resultado
      disponible de la búsqueda se muestra el precio de renovación (año 2 en
      adelante) en Bs — costo mayorista en USD que informa clouds.com.bo más
      un margen configurable (30% default), convertido con la tasa cacheada
      de Aero.Api\\Classes\\Currency\\CurrencyRateService (misma tasa de
      api/v1/currencies, sin llamada HTTP propia ni API key nuestra). Sin
      tasa disponible (Aero.Api no instalado o sin refrescar nunca), el
      precio de renovación simplemente no se muestra — nunca un número
      inventado."

1.31.0:
    - "El dominio propio del alta (plan Pro) ahora tiene dos modos:
      'register' (nuevo, cobra Settings::getDomainRegistrationPrice(), sin
      cambios) o 'existing' (el cliente ya lo tiene, gratis — solo avisa
      cuál es para que el equipo lo apunte a la plataforma después de
      activarse). Nueva columna signup_domain_source distingue cuál de los
      dos fue."
    - add_signup_domain_source_to_tenants.php

1.32.0:
    - "El QR de alta ahora vence en minutos, no en días:
      Settings::getSignupPaymentTtlMinutes() (default 3) reemplaza a
      signup_pending_ttl_hours. aero.sites:release-expired-signups pasa de
      cada hora a cada minuto y, antes de purgar el tenant, anula el QR
      contra el banco (Aero.Pay\\Classes\\PaymentDriverManager::cancelQr) —
      antes quedaba 'pending' del lado del banco hasta su propio
      vencimiento (varios días). El wizard muestra una cuenta regresiva
      real (SignupWizard::onCreateSignup ahora manda expires_at, un
      timestamp preciso — due_date sigue siendo de día completo, no sirve
      para esto) y un estado final si el tiempo se agota. Verificado
      end-to-end contra el banco real (Banco Económico): QR generado,
      forzado a expirar, anulado contra el banco y tenant purgado sin
      errores."
