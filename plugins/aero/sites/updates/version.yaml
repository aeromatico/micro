    - create_archetypes_table.php
    - add_archetype_handle_to_ai_generations.php

1.10.0:
    - Instrucciones de construcción por bloque + tono/público objetivo por arquetipo,
      inyectadas en el prompt de la IA para resultados iniciales más homogéneos.
    - add_ai_guidance_to_archetypes.php

1.11.0:
    - Selección de arquetipo por afinidad de keywords (en vez de al azar), validación
      del JSON generado contra campos requeridos del catálogo + límites de longitud,
      imagen de fondo opcional en el Hero, y efectos de scroll-reveal/hover con
      toggle simple (DesignTheme.enable_animations).
    - add_enable_animations_to_design_themes.php

1.12.0:
    - Paleta dual (claro/oscuro) por DesignTheme + toggle de modo claro/oscuro
      en el tema microsites, catálogo de temas gestionable desde el admin,
      selector de DesignTheme + personalización de color en SiteSettings,
      y fondos neutros/transparentes por defecto en los bloques Puck.
    - add_dual_palette_to_design_themes.php

1.13.0:
    - Tercera fuente configurable por DesignTheme para encabezados secundarios
      (h2-h6), separada del h1 y del body.
    - add_second_heading_font.php
1.14.0:
    - Habilita el menú "Mensajería" (API keys propias de un tenant sobre
      Aero.Hello) para el rol tenant_admin.
    - grant_hello_api_keys_to_tenant_admin.php

1.15.0:
    - "TenantInvite: invitar a alguien por email/WhatsApp a colaborar en un
      tenant. Crea el Backend\\User si no existe (rol tenant_admin, activación
      vía el flujo nativo de reset password) o solo agrega el TenantUser si ya
      tenía cuenta (p.ej. dueño de otro tenant); en ambos casos el acceso es
      inmediato vía TenantUser + ResolvesCurrentTenant. Notifica por
      Aero.Notify (evento sites.user.invited) si está instalado."
    - create_tenant_invites_table.php

1.17.0:
    - "Habilita la gestión de API keys del gateway Aero.Api (tab
      'Configuración') para el rol tenant_admin, aislada por tenant vía
      owner_type/owner_id — cada uno ve y crea solo las suyas, un superadmin
      sigue viendo todas."
    - grant_api_keys_to_tenant_admin.php
