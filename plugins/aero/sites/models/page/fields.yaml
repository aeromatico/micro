tabs:
    fields:
        title:
            label: Título
            type: text
            span: full
            required: true
            tab: Contenido

        slug:
            label: Slug (URL)
            type: text
            span: left
            comment: "Vacío = homepage. Ejemplo: sobre-nosotros"
            tab: Contenido
            preset:
                field: title
                type: slug

        layout:
            label: Layout
            type: dropdown
            span: right
            options:
                default: Estándar
                home: Homepage
                full: Pantalla completa
                landing: Landing page
                contact: Contacto
            tab: Contenido

        content_mode:
            label: Tipo de contenido
            type: balloon-selector
            span: full
            default: puck
            options:
                puck: Editor Visual
                richeditor: Editor HTML
                code: Código
            comment: "Editor Visual = bloques arrastrables. Editor HTML = redactor de texto enriquecido. Código = pegá tu propio HTML."
            tab: Contenido

        puck_data:
            label: Editor Visual
            type: puckEditor
            span: full
            tab: Contenido
            trigger:
                action: show
                field: content_mode
                condition: value[puck]

        content_richeditor:
            label: Editor HTML
            type: richeditor
            size: huge
            span: full
            valueFrom: content
            tab: Contenido
            trigger:
                action: show
                field: content_mode
                condition: value[richeditor]

        content_raw:
            label: Código
            type: codeeditor
            language: html
            size: huge
            span: full
            valueFrom: content
            comment: "HTML propio. Se guarda y se muestra tal cual en la página."
            tab: Contenido
            trigger:
                action: show
                field: content_mode
                condition: value[code]

        is_published:
            label: Publicado
            type: checkbox
            default: true
            tab: Contenido

        og_image:
            label: Imagen destacada (OG Image)
            type: fileupload
            mode: image
            imageWidth: 1200
            imageHeight: 630
            tab: SEO

        meta_title:
            label: Meta título
            type: text
            span: full
            placeholder: "Deja vacío para usar el título de la página"
            tab: SEO

        meta_description:
            label: Meta descripción
            type: textarea
            size: small
            span: full
            tab: SEO
