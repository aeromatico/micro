tabs:
    fields:
        content_mode:
            label: Tipo de contenido
            type: balloon-selector
            span: full
            default: puck
            options:
                puck: Editor Visual
                richeditor: Editor HTML
                code: Código
            comment: "Editor Visual = bloques arrastrables, con generación por IA. Editor HTML = redactor de texto enriquecido. Código = pega tu propio HTML (sin IA)."
            tab: Contenido

        title:
            label: Título
            type: text
            span: full
            required: true
            tab: Contenido

        slug:
            label: Slug (URL)
            type: text
            span: left
            comment: "Vacío = homepage. Ejemplo: sobre-nosotros"
            tab: Contenido
            preset:
                field: title
                type: slug

        layout:
            label: Layout
            type: dropdown
            span: right
            options:
                default: Estándar
                home: Homepage
                full: Pantalla completa
                landing: Landing page
                contact: Contacto
            tab: Contenido

        puck_data:
            label: Editor Visual
            type: puckEditor
            span: full
            tab: Contenido
            trigger:
                action: show
                field: content_mode
                condition: value[puck]

        content_richeditor:
            label: Editor HTML
            type: richeditor
            size: huge
            span: full
            valueFrom: content
            tab: Contenido
            trigger:
                action: show
                field: content_mode
                condition: value[richeditor]

        content_raw:
            label: Código
            type: codeeditor
            language: html
            size: huge
            span: full
            valueFrom: content
            comment: "HTML propio. Se guarda y se muestra tal cual en la página."
            tab: Contenido
            trigger:
                action: show
                field: content_mode
                condition: value[code]

        is_published:
            label: Mostrar como público
            type: switch
            default: true
            comment: "Apagada, la página no se ve en el sitio (responde 404)."
            tab: Contenido

        show_in_menu:
            label: Incluir en menús
            type: switch
            default: false
            tab: Contenido

        menu_positions:
            label: Posiciones de menú
            type: checkboxlist
            span: full
            options: getMenuPositionsOptions
            comment: "Dónde aparece la página. Cada tema decide cómo pinta cada posición."
            tab: Contenido
            trigger:
                action: show
                field: show_in_menu
                condition: checked

        og_image:
            label: Imagen destacada (OG Image)
            type: fileupload
            mode: image
            imageWidth: 1200
            imageHeight: 630
            tab: SEO

        meta_title:
            label: Meta título
            type: text
            span: full
            placeholder: "Deja vacío para usar el título de la página"
            tab: SEO

        meta_description:
            label: Meta descripción
            type: textarea
            size: small
            span: full
            tab: SEO
