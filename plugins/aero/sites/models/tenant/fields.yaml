tabs:
    fields:
        name:
            label: Nombre del sitio
            type: text
            span: left
            required: true
            tab: General

        handle:
            label: Handle (slug)
            type: text
            span: right
            required: true
            comment: "Identificador único: solo letras, números y guiones."
            tab: General

        root_domain_id:
            label: Dominio raíz
            type: dropdown
            span: left
            required: true
            comment: "El tenant vivirá en {handle}.{dominio}"
            tab: General

        niche_type:
            label: Tipo de niche
            type: dropdown
            span: right
            required: true
            tab: General

        status:
            label: Estado
            type: dropdown
            span: left
            options:
                active: Activo
                inactive: Inactivo
                suspended: Suspendido
                pending_payment: 'Pendiente de pago (alta reservada)'
            tab: General

        plan:
            label: Plan contratado
            type: dropdown
            span: right
            emptyOption: '— Sin plan (creado desde el backend) —'
            options: getPlanOptions
            tab: General

        plan_price:
            label: Precio pagado al activarse (Bs)
            type: number
            span: left
            disabled: true
            tab: General

        signup_domain:
            label: Dominio propio pedido en el alta
            type: text
            span: left
            disabled: true
            comment: "Vacío si eligió quedarse con el subdominio."
            tab: General

        signup_domain_source:
            label: Origen del dominio
            type: dropdown
            span: right
            disabled: true
            emptyOption: '— Sin dominio propio —'
            options:
                register: 'Nuevo — pendiente registrarlo (equipo)'
                existing: 'Ya lo tenía — pendiente apuntar DNS (equipo)'
            tab: General

        primary_color:
            label: Color primario
            type: colorpicker
            span: right
            default: '#6366f1'
            tab: General

        logo:
            label: Logo
            type: fileupload
            mode: image
            imageWidth: 400
            imageHeight: 200
            tab: Branding

        favicon:
            label: Favicon
            type: fileupload
            mode: image
            imageWidth: 64
            imageHeight: 64
            tab: Branding

        tenantUsers:
            label: Usuarios con acceso
            type: relation
            span: full
            tab: Accesos
            context: update
