columns:
    id:
        label: '#'
        type: number
        width: 60px

    name:
        label: Nombre
        type: text
        searchable: true

    handle:
        label: Handle
        type: text
        searchable: true

    niche_type:
        label: Niche
        type: text

    status:
        label: Estado
        type: text
        width: 140px

    plan:
        label: Plan
        relation: plan
        select: name
        width: 90px

    billing_period:
        label: Periodo
        type: selectable
        options:
            trial: Prueba
            monthly: Mensual
            annual: Anual
        width: 90px

    plan_expires_at:
        label: Vence
        type: date
        width: 110px

    signup_domain_source:
        label: Dominio propio
        type: selectable
        options:
            register: 'Nuevo (pendiente)'
            existing: 'Ya lo tenía (pendiente)'
        width: 150px

    rootDomain[domain]:
        label: Dominio raíz
        relation: rootDomain
        select: domain
        type: text

    created_at:
        label: Creado
        type: datetime
        width: 160px
