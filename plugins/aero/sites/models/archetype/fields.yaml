fields:
    name:
        label: Nombre
        type: text
        span: left
        required: true
        placeholder: 'Ej: Confianza y credenciales'

    handle:
        label: Handle
        type: text
        span: right
        required: true
        placeholder: consultorio-confianza
        comment: Identificador único (solo letras, números y guiones).

    niche_type:
        label: Nicho / área
        type: dropdown
        span: left
        required: false

    is_active:
        label: Activo
        type: checkbox
        default: true
        span: right

    description:
        label: Descripción
        type: textarea
        size: small
        span: full
        placeholder: Notas sobre cuándo conviene usar este arquetipo (se muestra en el panel de generación).

    tone_instructions:
        label: Tono y estilo de escritura
        type: textarea
        size: small
        span: full
        placeholder: 'Ej: Cálido y profesional, evitar promesas exageradas.'
        comment: Se inyecta en el prompt de la IA para toda la generación (no por bloque). Vacío = hereda el del nicho (specs/niches/{handle}.yaml).

    target_audience:
        label: Público objetivo
        type: textarea
        size: small
        span: full
        placeholder: 'Ej: Pacientes evaluando dónde atenderse, sensibles al trato y la confianza.'
        comment: Se inyecta en el prompt de la IA para toda la generación (no por bloque). Vacío = hereda el del nicho (specs/niches/{handle}.yaml).

    base_prompt:
        label: Prompt base (autocompletado)
        type: textarea
        size: small
        span: full
        placeholder: 'Ej: [Nombre del negocio] es una clínica dental con [X años] de experiencia...'
        comment: Al elegir este arquetipo en el panel de generación, este texto llena automáticamente el campo de descripción del negocio (el usuario lo edita antes de generar). Dejar vacío para heredar el prompt base del nicho (specs/niches/{handle}.yaml) en vez de uno propio.

    recommended_tones:
        label: Tonos de tema afines
        type: checkboxlist
        span: full
        options:
            corporate: Corporativo
            elegant: Elegante
            minimal: Minimalista
            warm: Cálido
            bold: Audaz
            playful: Divertido
        comment: Se usan para elegir automáticamente un DesignTheme coherente al generar.

    blocks:
        label: Secuencia de bloques
        type: repeater
        span: full
        prompt: Agregar bloque
        titleFrom: block
        form:
            fields:
                block:
                    type: dropdown
                    options:
                        Hero: Hero
                        TextBlock: Texto
                        FeatureGrid: Características
                        ImageBlock: Imagen
                        CTASection: Llamado a la acción
                        Divider: Separador
                        Banner: Banner
                        Badge: Badge
                        FAQ: FAQ (Acordeón)
                        Tabs: Pestañas
                        Testimonials: Testimonios
                        Gallery: Galería
                        Video: Video
                        LogoCloud: Logos
                        Stats: Estadísticas
                        Rating: Valoración
                instruction:
                    label: Instrucción de construcción para la IA
                    type: textarea
                    size: tiny
                    placeholder: 'Ej: Enfatiza años de experiencia en el subtítulo, sin frases genéricas.'
