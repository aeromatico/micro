        context: update
    status_label:
        label: Estado del seguimiento
        span: right
        disabled: true
        context: update
    phase_label:
        label: Fase del pedido
        span: left
        disabled: true
        context: update
    eta_text:
        label: Hora estimada
        span: right
        disabled: true
        context: update
    message:
        label: Mensaje del proveedor
        span: full
        disabled: true
        context: update
    links:
        type: partial
        path: links
        context: update
    timeline:
        type: partial
        path: timeline
        context: update
