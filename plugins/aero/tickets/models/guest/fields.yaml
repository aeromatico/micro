fields:
  event_id:
    label: Evento
    type: dropdown
    emptyOption: — Elegir —
    required: true
    span: left
  name:
    label: Nombre completo del invitado
    required: true
    span: right
  invitation_kind:
    label: Tipo de invitación
    type: dropdown
    span: left
    default: single
    comment: 'Individual: solo el invitado. Pareja: él/ella y 1 acompañante. Familia o grupo: define los acompañantes.'
  companions_allowed:
    label: Acompañantes permitidos
    type: number
    min: 0
    max: 49
    default: 0
    span: right
    trigger: {action: show, field: invitation_kind, condition: value[family][group]}
  email:
    label: Correo electrónico
    span: left
  phone:
    label: WhatsApp
    span: right
    placeholder: 70000000 o +59170000000
  ticket_type_id:
    label: Entrada (gratuita, cortesía o de pago)
    type: dropdown
    emptyOption: — La primera gratuita o de cortesía del evento —
    comment: 'Cada persona que asista recibe su propia entrada. Si es de pago, se genera una orden y la entrada vale al confirmarse el cobro.'
  notes:
    label: Observaciones del organizador
    type: textarea
    size: small
  status_panel:
    type: partial
    path: field_panel
    context: update
    span: full
