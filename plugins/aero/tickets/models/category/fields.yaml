fields:
  name:
    label: Nombre
    required: true
    span: left
  slug:
    label: Slug
    span: right
    preset:
      field: name
      type: slug
  sort_order:
    label: Orden
    type: number
    span: left
    default: 0
  is_active:
    label: Activa
    type: switch
    span: right
    default: true
