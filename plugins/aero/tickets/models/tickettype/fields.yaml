fields:
  event_id:
    label: Evento
    type: dropdown
    emptyOption: — Elegir —
    required: true
    span: left
  kind:
    label: ¿Qué clase de entrada es?
    type: dropdown
    span: right
    comment: 'Esto define cómo funciona. Gratuita: no se cobra, se emite al inscribirse. De pago: se cobra y se emite cuando confirmas el pago. Cortesía: la entregas tú (prensa, invitados especiales); no se vende en línea.'
  name:
    label: Nombre que verá el cliente
    required: true
    span: left
    placeholder: General, VIP, Preventa, Estudiante…
    comment: 'Solo es el nombre comercial: no cambia cómo funciona la entrada (eso lo define la clase). Puedes tener varias del mismo tipo con distinto nombre y precio.'
  price:
    label: Precio
    type: number
    step: any
    min: 0
    span: left
    trigger: {action: show, field: kind, condition: value[paid]}
  currency:
    label: Moneda
    type: dropdown
    span: right
    default: BOB
    comment: 'Hoy solo bolivianos; USD llegará en una versión futura.'
    trigger: {action: show, field: kind, condition: value[paid]}
  fee_percent:
    label: Comisión por servicio (%)
    type: number
    step: any
    min: 0
    span: left
    comment: 'Vacío = comisión por defecto de la plataforma.'
    trigger: {action: show, field: kind, condition: value[paid]}
  fee_fixed:
    label: Comisión fija (Bs)
    type: number
    step: any
    min: 0
    span: right
    trigger: {action: show, field: kind, condition: value[paid]}
  fee_payer:
    label: Quién paga la comisión
    type: dropdown
    emptyOption: — Según la plataforma —
    span: left
    trigger: {action: show, field: kind, condition: value[paid]}
  price_breakdown:
    type: partial
    path: field_breakdown
    span: full
    context: update
  stock:
    type: partial
    path: field_stock
    span: full
    context: update
  quantity:
    label: Cantidad disponible
    type: number
    min: 1
    span: left
    comment: 'Vacío = sin límite propio (rige la capacidad del evento).'
  max_per_order:
    label: Máximo por pedido
    type: number
    min: 1
    max: 50
    span: right
  sales_start:
    label: Venta desde
    type: datepicker
    mode: datetime
    span: left
  sales_end:
    label: Venta hasta
    type: datepicker
    mode: datetime
    span: right
  description:
    label: Qué incluye (opcional, lo ve el cliente)
    type: textarea
    size: small
  is_active:
    label: Activa
    type: switch
    span: left
    default: true
  sort_order:
    label: Posición en la lista
    type: number
    span: right
    default: 0
    comment: 'Solo ordena cómo se muestran las entradas (menor número, primero). No afecta precios ni cupos.'
