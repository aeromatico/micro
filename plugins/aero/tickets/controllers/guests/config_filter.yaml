scopes:
  event_id:
    label: Evento
    type: dropdown
    modelClass: Aero\Tickets\Models\Guest
    options: getEventIdOptions
    conditions: event_id = :value
  rsvp:
    label: Respuesta
    type: dropdown
    options:
      pending: Sin respuesta
      confirmed: Confirmaron
      declined: Rechazaron
    conditions: rsvp = ':value' and status = 'active'
  status:
    label: Invitación
    type: dropdown
    options:
      active: Vigentes
      revoked: Revocadas
    conditions: status = ':value'
  invitation_kind:
    label: Tipo
    type: dropdown
    options:
      single: Individual
      couple: Pareja
      family: Familia
      group: Grupo
    conditions: invitation_kind = ':value'
