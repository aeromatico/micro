fields:
    name:
        label: Nombre
        type: text
        span: auto
        required: true

    color:
        label: Color
        type: colorpicker
        span: auto
        availableColors: ['#4f46e5', '#ef4444', '#f97316', '#eab308', '#22c55e', '#06b6d4', '#3b82f6', '#ec4899']

    is_active:
        label: Activo
        type: switch
        span: auto
        comment: Un inbox inactivo deja de aceptar mensajes nuevos del widget.

    welcome_message:
        label: Mensaje de bienvenida
        type: textarea
        size: small
        span: full
        comment: Se envía automáticamente al abrir una conversación nueva. Déjalo vacío para no enviar nada.

    widget_key:
        label: Widget key
        type: text
        span: full
        readOnly: true
        comment: Público, va en el snippet. No es secreto.

    embed_snippet:
        label: Código para el sitio
        type: textarea
        size: small
        span: full
        readOnly: true
        comment: Pégalo antes de "</head>" en el sitio donde quieras el chat.

    _embed_instructions:
        type: partial
        path: embed_instructions
        span: full

secondaryTabs:
    fields:
        telegram_connector_id:
            label: Bot de Telegram
            type: dropdown
            tab: Telegram
            span: left
            emptyOption: Sin conectar
            comment: Crea el bot en "Conectores → Conectores" (tipo Telegram, con el token de @BotFather) y elígelo acá.

        telegram_bot_token:
            label: Token del bot
            type: text
            tab: Telegram
            span: left
            comment: Pega el token que te dio @BotFather. Se guarda cifrado; déjalo vacío para no cambiar el que ya está conectado.

        telegram_chat_id:
            label: Chat ID
            type: text
            tab: Telegram
            span: right
            comment: ID del chat o grupo donde quieres recibir los mensajes. Agrega el bot a ese chat y escribe cualquier mensaje para poder obtenerlo.

        _telegram_connect:
            type: partial
            path: telegram_connect
            tab: Telegram
            context: update
