tabs:
    fields:
        name:
            tab: Perfil
            label: Nombre
            span: left
        slug:
            tab: Perfil
            label: Identificador
            span: right
            comment: Se usa en URLs y en el catálogo. Solo letras, números y guiones.
        role:
            tab: Perfil
            label: Rol
            span: left
        category:
            tab: Perfil
            label: Categoría
            type: dropdown
            span: right
            comment: 'Se administran en Staff → Categorías.'
        quality:
            tab: Perfil
            label: Calidad
            type: dropdown
            span: left
            default: 3
            comment: 'De 1 a 5 estrellas. Es lo que ve el cliente en lugar de la rareza.'
        status:
            tab: Perfil
            label: Estado
            type: dropdown
            span: right
            default: online
            comment: 'En entrenamiento: se muestra pero aún no se puede contratar. Online: disponible. No disponible: oculto del Mercado.'
        bio:
            tab: Perfil
            label: Biografía (lo que ve el tenant)
            type: textarea
            size: small
        tags:
            tab: Perfil
            label: Etiquetas
            comment: Separadas por coma.
            type: taglist
        avatar:
            tab: Perfil
            label: Avatar (ruta o clave)
            span: left
        sort_order:
            tab: Perfil
            label: Orden
            type: number
            span: right
        base_contracts:
            tab: Perfil
            label: Contratos de referencia
            type: number
            span: left
            comment: 'Se suman a los contratos reales del Mercado (ya sembrados al azar, de 3 a 30). Pon 0 para mostrar solo los reales.'

        is_orchestrator:
            tab: Agente
            label: Es el orquestador
            type: switch
            comment: 'El agente especial que siempre está en el equipo de todos los tenants (no se contrata ni se cobra), recibe cada encargo y lo reparte. Solo puede haber uno: marcarlo desmarca al anterior.'

        system_prompt:
            tab: Agente
            label: Prompt de sistema
            type: textarea
            size: giant
            comment: Solo el superadmin lo ve y lo edita. Define cómo trabaja el agente.
        connector_id:
            tab: Agente
            label: Modelo (conector del Hub)
            type: dropdown
            span: left
            comment: El costo de tokens sale de este conector.
        model_code:
            tab: Agente
            label: Modelo especializado
            type: dropdown
            span: right
            comment: 'Elige uno del catálogo de Ajustes → Workspaces. Vacío = el modelo por defecto.'
        fallback_model_code:
            tab: Agente
            label: Modelo de respaldo
            type: dropdown
            span: left
            comment: 'Si el modelo principal falla, el turno continúa con este. Debe usar el mismo tipo de conector (OpenAI-compatible o Anthropic); si no, se ignora.'
        kind:
            tab: Agente
            label: Tipo
            type: dropdown
            span: right
            options:
                ai: Agente IA

        fee_mode:
            tab: Tarifas
            label: Tarifa
            type: dropdown
            span: left
            default: free
            comment: 'Gratis, o se cobra en créditos de Aero.Credits (mientras el cobro general esté encendido en Ajustes).'
        credit_type:
            tab: Tarifas
            label: Tipo de crédito
            type: dropdown
            span: right
            emptyOption: '(el tipo por defecto de Ajustes)'
            trigger:
                action: show
                field: fee_mode
                condition: value[credits]
        hire_fee:
            tab: Tarifas
            label: Contratación (créditos)
            type: number
            span: left
            comment: '0 = el tenant no paga al contratar. Despedir no reembolsa; recontratar cobra de nuevo.'
            trigger:
                action: show
                field: fee_mode
                condition: value[credits]
        plan_codes:
            tab: Tarifas
            label: Planes a los que corresponde
            type: checkboxlist
            span: right
            comment: 'Sin marcar = todos los planes. Un tenant de otro plan ve el agente pero no puede contratarlo.'
        task_rates:
            tab: Tarifas
            label: Tarifa por tarea (créditos)
            type: repeater
            trigger:
                action: show
                field: fee_mode
                condition: value[credits]
            prompt: Agregar tipo de tarea
            form:
                fields:
                    task_type:
                        label: Tipo de tarea
                        type: dropdown
                        span: left
                        options:
                            encargo: 'Encargo a la Oficina (se multiplica por el largo del brief)'
                            chat_turn: 'Mensaje de chat (cada respuesta real del agente)'
                    fee:
                        label: Créditos por tarea
                        type: number
                        span: right
                        comment: 0 = gratis.

        skills:
            tab: Skills
            label: Skills equipadas
            type: relation
            nameFrom: name
            comment: Las skills oficiales y de hub aparecen aquí; las personales se crean por tenant.

        guide:
            tab: Guía
            label: Guía de uso (una línea por paso)
            type: taglist
            comment: Se muestra al tenant en el perfil del agente.
