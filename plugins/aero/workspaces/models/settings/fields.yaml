fields:
    charge_enabled:
        label: Cobrar puntos
        type: switch
        default: false
        comment: 'Cobra la contratación y los encargos con créditos del tenant. Déjalo apagado mientras los encargos sean una simulación (no entregan resultados).'
    credit_type:
        label: Tipo de crédito que hace de «puntos»
        type: text
        default: azul
        comment: 'Código del tipo de crédito de Aero.Credits (por ejemplo azul o rojo).'
    agent_connector_id:
        label: Conector de IA de los agentes reales
        type: dropdown
        showSearch: true
        emptyOption: '(el primero activo)'
        comment: 'El conector (gateway) por el que trabajan los agentes. Si está desactivado, usan el primer conector de IA activo.'
    agent_model:
        label: Modelo de IA por defecto de los agentes
        type: text
        comment: 'Vacío = el modelo predeterminado del conector. Con Cloudflare AI Gateway se escribe proveedor/modelo (p. ej. openai/gpt-4.1).'
    agent_turns_per_hour:
        label: Turnos de chat con agentes por tenant y hora
        type: number
        default: 60
        comment: 'Cada turno puede costar varias llamadas al modelo; este tope protege el gasto.'
    models:
        label: Modelos especializados
        type: repeater
        prompt: Agregar modelo
        titleFrom: label
        commentAbove: 'Catálogo de modelos por especialidad. Cada agente puede elegir uno en su ficha (Staff → Agente). Código y texto conversan con herramientas; imagen, audio y video quedan registrados para la generación de medios (todavía no se llaman desde el chat).'
        form:
            fields:
                code:
                    label: Código
                    type: text
                    span: left
                    comment: 'Identificador corto y único, sin espacios (p. ej. code_max).'
                label:
                    label: Nombre
                    type: text
                    span: right
                kind:
                    label: Especialidad
                    type: dropdown
                    span: left
                    options:
                        code: Código
                        text: Texto / chat
                        image: Imagen
                        audio: Audio
                        video: Video
                model:
                    label: Modelo
                    type: text
                    span: right
                    comment: 'Tal como lo pide el gateway (proveedor/modelo en Cloudflare).'
                connector_id:
                    label: Conector (opcional)
                    type: dropdown
                    span: left
                    comment: 'Vacío = el conector de los agentes.'
                is_active:
                    label: Activo
                    type: switch
                    span: right
                    default: true
