fields:
  tenant_id:
    label: Iglesia (tenant)
    type: dropdown
    span: auto
    permissions:
    - aero.church.superadmin
    emptyOption: — Elegir —
  name: {label: Nombre, span: left, required: true}
  kind: {label: Tipo, type: dropdown, span: right}
  goal_amount: {label: Meta (opcional), span: left, comment: Para campañas con un monto objetivo.}
  starts_on: {label: Desde, type: datepicker, mode: date, span: left}
  ends_on: {label: Hasta, type: datepicker, mode: date, span: right, comment: Pasada esta fecha ya no admite aportes nuevos.}
  is_active: {label: Activo, type: switch, default: true}
