<div class="rounded-brand border border-green-200 bg-green-100 p-5 text-sm text-green-800" role="status">
    {% if reg.status == 'registered' %}
        <p class="font-semibold">¡Quedaste inscrito en «{{ event.title }}»!</p>
        <p class="mt-1">Presenta este código al llegar:</p>
        <div class="mt-3 inline-block rounded bg-white p-2" style="width:160px;height:160px">{{ reg.qrSvg(160)|raw }}</div>
    {% else %}
        <p class="font-semibold">El cupo está lleno.</p>
        <p class="mt-1">Quedaste en lista de espera para «{{ event.title }}». Si se libera un lugar, te avisaremos.</p>
    {% endif %}
</div>
