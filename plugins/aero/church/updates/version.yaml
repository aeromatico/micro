1.3.0:
    - "Diezmos, ofrendas y donaciones: conceptos y campañas con meta, aportes en efectivo, transferencia o QR de Pay, aportes anónimos, confirmación automática del pago, comprobante en PDF bajo demanda, resumen por periodo y registro en Finanzas."
    - create_church_giving.php

1.4.0:
