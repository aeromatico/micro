    - create_church_content.php

1.6.0:
    - "Registro de auditoría: historial de operaciones administrativas (altas, cambios, anulaciones, envíos, exportaciones y consultas de peticiones de oración) sin guardar datos sensibles."
    - create_church_audit.php

1.6.1:
