1.2.0:
    - "Calendario de eventos: cultos, reuniones, retiros y conferencias con inscripción, cupos con lista de espera, QR personal para controlar la asistencia, llegada manual y recordatorios por WhatsApp."
    - create_church_events.php

1.2.1:
    - "Arregla que los roles de pastor, secretaría, tesorería y líder no pudieran entrar al panel; además corrige las pantallas de edición de grupos, reuniones y eventos."
