fields:
  tenant_id:
    label: Colegio (tenant)
    type: dropdown
    span: full
    permissions:
    - aero.school.superadmin
    emptyOption: — Elegir —
  title:
    label: Asunto
    span: full
    required: true
  body:
    label: Mensaje
    type: textarea
    size: large
    comment: Se envía por WhatsApp a los apoderados. Use *negrita* si desea resaltar.
  audience:
    label: Dirigido a
    type: dropdown
    span: left
    default: all
  level:
    label: Nivel
    type: dropdown
    span: right
    trigger:
      action: show
      field: audience
      condition: value[level]
  course_id:
    label: Curso
    type: dropdown
    span: right
    trigger:
      action: show
      field: audience
      condition: value[course]
  attachment_url:
    label: Enlace a adjunto (imagen o PDF)
    span: full
    comment: Opcional. URL pública del archivo.
