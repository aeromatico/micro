    type: section
    label: Agregar otro apoderado
    comment: Vincule un apoderado existente o cree uno nuevo; puede agregar más guardando varias veces.
    tab: Apoderados
  guardian_id:
    label: Apoderado existente
    type: dropdown
    span: full
    emptyOption: — Ninguno —
    tab: Apoderados
  guardian_name:
    label: "…o nuevo apoderado: nombre"
    span: left
    tab: Apoderados
  guardian_phone:
    label: Celular (WhatsApp)
    span: right
    tab: Apoderados
  guardian_email:
    label: Correo
    span: left
    tab: Apoderados
  guardian_relationship:
    label: Parentesco
    span: right
    placeholder: Madre, Padre, Tío…
    tab: Apoderados
