    - aero.school.superadmin
    emptyOption: — Elegir —
  first_name:
    label: Nombres
    span: left
    required: true
    tab: Datos
  paternal_surname:
    label: Apellido paterno
    span: right
    tab: Datos
  maternal_surname:
    label: Apellido materno
    span: left
    tab: Datos
  rude:
    label: Código RUDE
    span: right
    tab: Datos
  document:
    label: C.I.
    span: left
    tab: Datos
  birthdate:
    label: Fecha de nacimiento
    type: datepicker
    mode: date
    span: right
    tab: Datos
  sex:
    label: Sexo
    type: dropdown
    span: left
    tab: Datos
  course_id:
    label: Curso
    type: dropdown
    span: right
    emptyOption: — Sin curso —
    tab: Datos
  status:
    label: Estado
    type: dropdown
    span: left
    default: active
    tab: Datos
  enrolled_on:
    label: Fecha de inscripción
    type: datepicker
    mode: date
    span: right
    tab: Datos
