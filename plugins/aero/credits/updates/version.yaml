1.0.0:
    - Primera versión — sistema de créditos prepago multi-color (azul/rojo) para IA y servicios conectados.
    - create_credit_types_table.php
    - create_credit_accounts_table.php
    - create_credit_transactions_table.php
    - create_credit_actions_table.php
    - seed_credit_types_and_actions.php
    - seed_credit_alert_templates.php

1.1.0:
    - "Tercer color de crédito 'naranja', de menor valor que azul/rojo — pensado
      como tier de entrada para acciones de bajo costo (ej. tool-calling de
      Súper IA en Aero.Chatbots)."
    - seed_credit_type_naranja.php
1.2.0:
    - "Acción facturable hello.message_send (naranja, 1 crédito): cada mensaje de WhatsApp enviado por la API pública de Hello, con reembolso si falla."
    - seed_hello_message_send_action.php

1.3.0:
    - "Endurecimiento del núcleo: reembolso idempotente (refund_of_id único), claves de idempotencia en cobros, validación de montos, acción desconocida ya no cobra en silencio, alertas post-commit, comando credits:reconcile."
    - add_idempotency_to_credit_transactions.php

1.4.0:
    - "Cobros con hold (pending/settled/refunded) + barrido credits:sweep-holds cada 5 min: si el proceso muere entre cobro y ejecución, se reembolsa solo. Credits::attempt() y el conector lo usan; el conector ahora veta la llamada si no hay saldo (evento aero.connector.beforeRun) en vez de ejecutarla gratis."
    - create_credit_holds_table.php

1.5.0:
    - "Libro mayor a prueba de errores: kind por movimiento, acumulado diario y garantías en la BD (movimientos inmutables, saldo mantenido por triggers, sin negativos, signo coherente con el tipo)."
    - harden_credit_ledger.php

1.6.0:
    - "Precio en Bs por moneda (price_bob), monedas no intercambiables (oro) y tabla de compras por QR."
    - add_pricing_and_purchases.php

1.7.0:
    - "Recargas de monedas por QR (Recharges), intercambio con comisión, verificación diaria de la contabilidad y vencimiento de recargas impagas."

1.8.0:
    - "Avisos por Aero.Notify: recarga acreditada (tenant + superadmin) y recarga con pago incompleto (superadmin)."
    - seed_purchase_notification_templates.php

1.9.0:
    - "Billetera de dinero (Bs): el sobrante de las recargas va a una billetera que se cambia por cualquier moneda. Misma garantía contable del libro mayor; unidad 0,0001 Bs para que nunca se pierda un céntimo."
    - add_money_wallet.php

1.10.0:
    - "Aviso de recarga acreditada: se dispara desde el listener del pago (fuera de la transacción), con tenant_name y registro en el log; plantillas de bandeja y push para los avisos de recarga."
    - seed_purchase_inapp_push_templates.php

1.11.0:
    - "Créditos de regalo de plan con vencimiento (Aero.Sites Plan.credits mode=expiring): topUp() admite $expiresAt y crea un CreditPlanGrantLot; chargeRaw() descuenta primero del lote más próximo a vencer (solo contabilidad auxiliar, el saldo real no cambia); credits:expire-plan-grants postea kind=expiry por lo que quede sin usar al vencer el ciclo. No cambia nada para los colores en modo acumulable (el default de siempre)."
    - create_credit_plan_grant_lots_table.php

1.12.0:
    - "Cupones e invitaciones: cupones públicos (código, plan + periodo gratis, tope de canjes, vencimiento) y cuotas de invitación por tenant (el superadmin asigna en cualquier momento cuántas invitaciones y con qué plan/periodo se benefician sus invitados; por defecto 3, igual para los tenants invitados). Las invitaciones se mandan por WhatsApp (Aero.Hello, por defecto) o correo, con código de canje. Grants::apply() extiende plan_expires_at del tenant y le pone el plan del regalo; Coupons/Invitations::preview()+consume() resuelven el canje sin tocar nada si Aero.Sites no está instalado. Pantallas: Créditos → Cupones, Cuotas de invitación, Invitaciones (auditoría); Mis invitaciones (autoservicio del tenant, enlace en el navbar junto a Wallet)."
    - create_credit_coupons_table.php
    - create_credit_invitation_quotas_table.php
    - create_credit_invitations_table.php
1.13.0:
    - "Regalar una suscripción (/regalar): el comprador paga un QR y al confirmarse se emite un cupón de un solo uso que se envía al destinatario (WhatsApp o correo) con el enlace de canje. Tabla aero_credits_gifts, componente giftForm."
    - create_credit_gifts_table.php
1.14.0:
    - "Regalos: pantalla de auditoría (Créditos → Regalos de suscripción) y vencimiento automático de los QR sin pagar (credits:expire-gifts). Canje de cupones por un tenant existente desde Mis invitaciones (un canje por tenant y cupón; solo del mismo plan que ya tiene o si no tiene plan vigente; nunca el Trial)."
    - create_credit_coupon_redemptions_table.php
1.15.0:
    - "Aero.Workflows: nodos de Monedas para el editor visual (Saldo del tenant, Generar recarga con QR y Estado de una recarga). Solo operan sobre el tenant del workflow; las monedas se acreditan únicamente al confirmarse el pago."

1.16.0:
    - "Tarifa por QR de cobro completado (acción pay.qr_completed): 3 monedas de bronce, editable en Créditos → Acciones."
    - seed_pay_qr_completed_action.php
