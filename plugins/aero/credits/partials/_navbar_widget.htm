<?php
$short = function ($n) {
    $n = (int) $n;
    if ($n >= 1000000) return rtrim(rtrim(number_format($n / 1000000, 1, ',', ''), '0'), ',') . 'M';
    if ($n >= 10000) return rtrim(rtrim(number_format($n / 1000, 1, ',', ''), '0'), ',') . 'k';
    return number_format($n, 0, ',', '.');
};
