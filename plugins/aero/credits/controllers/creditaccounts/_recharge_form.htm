<form
    data-request="onRecharge"
    data-request-success="$('.control-popup').popup('hide')">
    <div class="modal-header">
        <h4 class="modal-title"><?= e(trans('aero.credits::lang.account.recharge')) ?></h4>
        <button type="button" class="btn-close" data-dismiss="popup"></button>
    </div>
    <div class="modal-body">
        <div class="form-group">
            <label><?= e(trans('aero.credits::lang.account.tenant')) ?></label>
            <?php if ($tenants): ?>
                <select name="tenant_id" class="form-control custom-select" required>
                    <option value=""></option>
                    <?php foreach ($tenants as $id => $name): ?>
                        <option value="<?= $id ?>"><?= e($name) ?></option>
                    <?php endforeach ?>
                </select>
            <?php else: ?>
                <input type="number" name="tenant_id" class="form-control" required>
            <?php endif ?>
        </div>
        <div class="form-group">
            <label><?= e(trans('aero.credits::lang.account.credit_type')) ?></label>
            <select name="credit_type_code" class="form-control custom-select" required>
                <option value=""></option>
                <?php foreach ($creditTypes as $code => $label): ?>
                    <option value="<?= e($code) ?>"><?= e($label) ?></option>
                <?php endforeach ?>
            </select>
        </div>
        <div class="form-group">
            <label><?= e(trans('aero.credits::lang.account.amount')) ?></label>
            <input type="number" name="amount" class="form-control" required>
            <p class="help-block"><?= e(trans('aero.credits::lang.account.amount_comment')) ?></p>
        </div>
        <div class="form-group">
            <label><?= e(trans('aero.credits::lang.account.reason')) ?></label>
            <input type="text" name="reason" class="form-control">
        </div>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-default" data-dismiss="popup"><?= e(trans('backend::lang.form.cancel')) ?></button>
        <button type="submit" class="btn btn-primary"><?= e(trans('backend::lang.form.save')) ?></button>
    </div>
</form>
