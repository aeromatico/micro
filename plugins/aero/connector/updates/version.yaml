1.0.0:
    - Primera versión - conector genérico de endpoints HTTP, IA y webhooks con tester.
    - create_connectors_table.php
    - create_webhook_endpoints_table.php
    - create_connector_logs_table.php
1.1.0:
    - Agrega credit_cost/credit_type_id opcionales para que Aero.Credits pueda cobrar por llamada exitosa.
    - add_credit_cost_to_connectors_table.php

1.2.0:
    - "El campo 'Tipo' deja de elegirse a mano: el modelo lo calcula solo por
      el host de base_url (con un override opcional 'provider_hint'). El
      formulario pasa a pedir API Key/Secret como texto plano en vez de JSON."
    - add_provider_hint_to_connectors_table.php

1.3.0:
    - "El selector 'Proveedor' pasa a tener presets específicos (OpenRouter,
      OpenCode Zen, Kilocode, OpenAI, Anthropic) que autocompletan la URL
      base. Se agrega un campo 'Puerto' opcional para despliegues propios
      (Ollama, LM Studio, gateways internos)."
    - add_port_to_connectors_table.php

1.4.0:
    - "Fix: los drivers de IA (Anthropic/OpenAI-compatible) usaban 30s de
      timeout HTTP y no reenviaban max_tokens del llamador (Anthropic caía a
      256 por defecto) — cortaba a mitad cualquier respuesta larga o modelo
      'reasoning' lento. Se agrega Aero\\Connector\\Classes\\AiResponseText,
      helper compartido para extraer el texto de la respuesta sin duplicar
      lógica por consumidor. Se siembra una vidriera de 10 modelos de IA de
      moda (frontera + chinos) vía OpenRouter, deshabilitados hasta cargarles
      la API key."
    - seed_showcase_ai_models.php
