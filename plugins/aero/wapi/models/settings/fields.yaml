fields:

    chat_store_section:
        type: section
        label: aero.wapi::lang.settings.chat_store
        comment: aero.wapi::lang.settings.chat_store_comment

    chat_retention_days:
        label: aero.wapi::lang.settings.chat_retention_days
        type: number
        default: 30
        min: 1
        max: 3650
        comment: aero.wapi::lang.settings.chat_retention_days_comment
        span: left

    store_media:
        label: aero.wapi::lang.settings.store_media
        type: switch
        default: false
        comment: aero.wapi::lang.settings.store_media_comment
        span: right

    storage_status:
        type: partial
        path: $/aero/wapi/models/settings/_storage_status.htm

    connection_section:
        type: section
        label: aero.wapi::lang.settings.connection

    base_url:
        label: aero.wapi::lang.settings.base_url
        type: text
        comment: aero.wapi::lang.settings.base_url_comment
        span: full

    api_key:
        label: aero.wapi::lang.settings.api_key
        type: password
        comment: aero.wapi::lang.settings.api_key_comment
        span: full

    webhook_secret:
        label: aero.wapi::lang.settings.webhook_secret
        type: password
        comment: aero.wapi::lang.settings.webhook_secret_comment
        span: full

    allow_unsigned_webhooks:
        label: aero.wapi::lang.settings.allow_unsigned_webhooks
        type: switch
        comment: aero.wapi::lang.settings.allow_unsigned_webhooks_comment
        span: full
