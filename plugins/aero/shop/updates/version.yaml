      existentes, para que el sideMenu de la tienda sea visible en el panel mi-sitio.
    - grant_tenant_admin_permissions.php

1.0.2:
    - "Amplía el catálogo global de monedas: peso argentino, real brasileño, peso
      colombiano, peso chileno, sol peruano, USDT y USDC. Ensancha la columna
      code para soportar códigos de 4-5 caracteres (stablecoins)."
    - widen_currency_code_column.php
    - seed_more_currencies.php

1.0.3:
    - "Storefront público: token de acceso aleatorio en pedidos para la página
      de confirmación (evita adivinar pedidos por order_number secuencial)."
    - add_access_token_to_orders.php

1.0.4:
    - "Permite agregar Valores a una Opción desde el admin (repeater ligado a
      la relación). tenant_id/product_option_id deben ser nullable porque el
      Repeater de October en modo relación inserta la fila vacía antes de
      asignar la FK del padre."
    - nullable_option_value_fk_columns.php

1.0.5:
    - "Seed de demo: crea tablas del shop si faltan, 6 colecciones, 12 productos
      con imágenes de Unsplash y configuración de tienda para el tenant Demo."
    - seed_demo_data.php

1.0.6:
    - "Nuevo método de pago dinámico 'pagos_qr': genera un QR de cobro real por
      pedido usando la cuenta bancaria del tenant en aero/qrbo (si está
      instalado) y marca el pedido como pagado automáticamente al confirmarse
      el pago."
    - add_qrbo_bank_account_id_to_payment_gateways.php

1.0.7:
    - "'Pago manual' pasa a llamarse 'Pagos offline' y ahora también puede
      llevar una cuenta QRBO (una de QR fijo/correo, sin API) para mostrar su
      QR al comprador — el pedido igual se confirma a mano. 'Pagos QR' ahora
      solo ofrece cuentas con API real de banco (antes listaba cualquiera,
      lo que rompía si elegías una de QR fijo). Se quita el switch
      'Requiere confirmación manual', que no controlaba nada."
    - drop_requires_manual_confirmation_column.php
