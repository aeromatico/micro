    - create_currencies_table.php
    - create_shop_settings_table.php
    - create_tenant_currencies_table.php
    - create_collections_table.php
    - create_products_table.php
    - create_product_collection_table.php
    - create_product_options_table.php
    - create_product_option_values_table.php
    - create_product_variants_table.php
    - create_variant_option_values_table.php
    - create_payment_gateways_table.php
    - create_customers_table.php
    - create_addresses_table.php
    - create_orders_table.php
    - create_order_items_table.php
    - create_order_status_history_table.php
    - create_stock_movements_table.php
    - seed_currencies.php

1.0.1:
    - Otorga los nuevos permisos aero.shop.* a los roles tenant_admin y superadmin
      existentes, para que el sideMenu de la tienda sea visible en el panel mi-sitio.
    - grant_tenant_admin_permissions.php

1.0.2:
    - "Amplía el catálogo global de monedas: peso argentino, real brasileño, peso
      colombiano, peso chileno, sol peruano, USDT y USDC. Ensancha la columna
      code para soportar códigos de 4-5 caracteres (stablecoins)."
    - widen_currency_code_column.php
    - seed_more_currencies.php

1.0.3:
    - "Storefront público: token de acceso aleatorio en pedidos para la página
      de confirmación (evita adivinar pedidos por order_number secuencial)."
    - add_access_token_to_orders.php

1.0.4:
    - "Permite agregar Valores a una Opción desde el admin (repeater ligado a
      la relación). tenant_id/product_option_id deben ser nullable porque el
      Repeater de October en modo relación inserta la fila vacía antes de
      asignar la FK del padre."
    - nullable_option_value_fk_columns.php

1.0.5:
    - "Seed de demo: crea tablas del shop si faltan, 6 colecciones, 12 productos
      con imágenes de Unsplash y configuración de tienda para el tenant Demo."
    - seed_demo_data.php

1.0.6:
    - "Nuevo método de pago dinámico 'pagos_qr': genera un QR de cobro real por
      pedido usando la cuenta bancaria del tenant en aero/qrbo (si está
      instalado) y marca el pedido como pagado automáticamente al confirmarse
      el pago."
    - add_qrbo_bank_account_id_to_payment_gateways.php

1.0.7:
    - "'Pago manual' pasa a llamarse 'Pagos offline' y ahora también puede
      llevar una cuenta QRBO (una de QR fijo/correo, sin API) para mostrar su
      QR al comprador — el pedido igual se confirma a mano. 'Pagos QR' ahora
      solo ofrece cuentas con API real de banco (antes listaba cualquiera,
      lo que rompía si elegías una de QR fijo). Se quita el switch
      'Requiere confirmación manual', que no controlaba nada."
    - drop_requires_manual_confirmation_column.php

1.0.8:
    - "Direcciones de envío con ubicación opcional (latitude/longitude/
      location_label). OrderService las guarda y deja el enlace al mapa en
      address_line2. Primer uso: la PWA de chat adjunta la ubicación que el
      cliente compartió por WhatsApp."
    - add_location_to_addresses.php

1.0.9:
    - "La ubicación de envío se integra: el pedido en el backend muestra la
      dirección de envío con enlace al mapa (antes no mostraba ninguna), la
      API REST acepta y devuelve shipping.latitude/longitude/location_label y
      la confirmación pública del pedido enlaza el mapa."

1.1.0:
    - "Modo de tienda en Configuración: estándar (por defecto) o Tienda para
      WhatsApp. El checkout de WhatsApp solo pide el celular (prefijo 591) y
      manda el pedido al chat: por WhatsApp Api (enlace api.whatsapp.com con el
      pedido formateado hacia el número de la tienda) o por Market Api (envío
      desde una cuenta de Hello del tenant)."
    - add_store_mode_to_shop_settings.php

1.2.0:
    - "Modo Restaurante en Configuración: grupos de extras por plato (mín/máx),
      nota de cocina por línea, tipo de pedido (local, recoger, delivery), mesa
      por QR, horarios y pedido mínimo."
    - add_restaurant_mode.php

1.3.0:
    - "Horario general de la tienda (todos los tipos): 24 horas, por horario
      semanal o atención en línea con interruptor. Cierra el checkout y el
      pedido cuando la tienda está cerrada. Variantes/Extras del producto
      se muestran según el tipo de tienda."
    - add_schedule_to_shop_settings.php

1.4.0:
    - "Tiempo de preparación y cantidad mínima pasan de Configuración a cada
      producto (pestaña Restaurante, antes Extras)."
    - add_restaurant_product_fields.php

1.5.0:
    - "Operación del restaurante: estado de cocina por pedido (nuevo, preparando,
      listo, entregado), pantalla de cocina en el backend, anticipación mínima
      para pedidos programados y seguimiento del pedido para el cliente."
    - add_kitchen_to_orders.php

1.6.0:
    - "Tiempo estimado del pedido (restaurante): se calcula con la preparación del
      plato más lento, la carga de la cocina, el modo ocupado y, en delivery, un
      tiempo de reparto. El cliente lo ve solo cuando cocina acepta el pedido, y
      cocina puede ajustarlo y extenderlo."
    - add_eta_to_orders.php

1.7.0:
    - "Prerrequisitos de aero/pos: origen de la venta (web, pos, api...), cajero,
      rondas de comanda, código de barras, productos internos (Venta libre) y NIT
      y razón social del cliente. OrderService suma agregar rondas, cobrar,
      descuento y anulación."
    - add_pos_prerequisites.php

1.8.0:
    - "Sucursales: la tienda puede tener varias sucursales (interruptor en Configuración). El checkout pide elegir una y el pedido guarda su nombre."
    - add_branches_to_shop.php

1.8.1:
    - "Pedido con la última ubicación compartida por el cliente en el chat: dirección y ciudad opcionales cuando hay coordenadas."
    - make_address_line_city_nullable.php

1.8.2:
    - "Nodos para Aero.Workflows: «Tienda › Menú de categorías» y «Tienda › Productos de una categoría» (se entienden entre sí por el número del menú)."

1.9.0:
    - "Compra por chat: carrito y última lista mostrada por cliente (tabla aero_shop_chat_sessions) para los nodos de Workflows «Buscar productos», «Agregar al pedido», «Ver o editar pedido» y «Confirmar pedido»."
    - create_chat_sessions_table.php


1.9.1:
    - "Costo de envío de la tienda (0 = gratis), aplicado a pedidos con productos que requieren envío; el checkout web lo muestra."
    - add_shipping_fee_to_shop_settings.php

1.9.2:
    - "Nodo de Workflows «Tienda › Ver producto (tarjeta)»: foto, precio con descuento, descripción, opciones y stock; se envía por Hello en un chat real y deja lista la compra rápida («1», «1 x3», «sí»)."

1.9.3:
    - "Nodos de tienda para chat de restaurante: «Confirmar pedido» toma la mesa («mesa 5») y, sin ubicación en el flujo, la última que el cliente compartió en el chat (6 h); «Ver o editar pedido» entiende «quitar 2»."

1.9.4:
    - "Pedido por chat con costo de envío global: el carrito y la confirmación muestran el envío de la tienda (se suma a productos físicos, no a digitales; en restaurante es un aviso de delivery) y el checkout entiende la dirección escrita («confirmar Av. Arce 123, La Paz»)."

1.9.5:
    - "Eventos aero.shop.orderPaid y aero.shop.orderRefunded (para que Aero.Finance registre ventas y reembolsos en el libro)."
