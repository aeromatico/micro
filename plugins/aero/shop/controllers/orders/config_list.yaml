title: Pedidos
list: $/aero/shop/models/order/columns.yaml
modelClass: Aero\Shop\Models\Order
recordUrl: aero/shop/orders/update/:id
noRecordsMessage: No hay pedidos todavía.
recordsPerPage: 20
showCheckboxes: false

toolbar:
    search:
        prompt: Buscar por número de pedido

filter:
    scopes:
        status:
            label: Estado
            type: group
            conditions: status in (:filtered)
            options:
                pending: Pendiente
                awaiting_payment: Esperando pago
                paid: Pagado
                fulfilled: Despachado/entregado
                cancelled: Cancelado
                refunded: Reembolsado

        kitchen_status:
            label: Cocina
            type: group
            conditions: kitchen_status in (:filtered)
            options:
                new: Nuevo
                preparing: Preparando
                ready: Listo
                delivered: Entregado

defaultSort:
    column: created_at
    direction: desc
