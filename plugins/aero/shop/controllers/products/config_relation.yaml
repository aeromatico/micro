options:
    label: Opciones (Talla, Color...)
    view:
        list: $/aero/shop/models/productoption/columns.yaml
        toolbarButtons: create|delete
        recordsPerPage: 10
    form:
        fields:
            name:
                label: Nombre de la opción
                type: text
                required: true
                comment: "Ej: Talla, Color"
            values:
                label: Valores
                type: repeater
                span: full
                prompt: Agregar valor
                titleFrom: value
                form:
                    fields:
                        value:
                            label: Valor
                            type: text
                            required: true
                            comment: "Ej: S, M, L o Rojo, Azul"

variants:
    label: Variantes (SKU por combinación)
    view:
        list: $/aero/shop/models/productvariant/columns.yaml
        toolbarButtons: create|delete
        recordsPerPage: 20
    form: $/aero/shop/models/productvariant/fields.yaml

modifier_groups:
    label: Extras del plato
    view:
        list: $/aero/shop/models/modifiergroup/columns.yaml
        toolbarButtons: create|delete
        recordsPerPage: 10
    form:
        fields:
            name:
                label: Nombre del grupo
                type: text
                required: true
                comment: "Ej: Tamaño, Adicionales, Punto de cocción"
            min_select:
                label: Mínimo a elegir
                type: number
                span: left
                default: 0
                comment: "0 = opcional. 1 o más = el cliente debe elegir."
            max_select:
                label: Máximo a elegir
                type: number
                span: right
                default: 1
                comment: "1 = elige una opción (radio). Más de 1 = casillas."
            choices:
                label: Opciones
                type: repeater
                span: full
                prompt: Agregar opción
                titleFrom: name
                form:
                    fields:
                        name:
                            label: Opción
                            type: text
                            required: true
                            span: left
                        price_delta:
                            label: Costo extra
                            type: number
                            span: right
                            default: 0
                            step: 0.01
                        is_active:
                            label: Disponible
                            type: switch
                            default: true
