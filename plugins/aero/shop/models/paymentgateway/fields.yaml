fields:
    name:
        label: Nombre visible al comprador
        type: text
        span: left
        required: true
        placeholder: "Transferencia bancaria BOB, QR Simple..."

    driver:
        label: Driver
        type: dropdown
        span: right
        default: manual
        options:
            manual: "Pagos offline"
            pagos_qr: "Pagos QR"
        comment: "'Pagos QR' usa un código QR de forma dinámica. 'Pagos offline' incluye información de pagos fuera de línea, como una cuenta bancaria o pagos contra entrega."

    qrbo_bank_account_id:
        label: Cuenta bancaria (QRBO)
        type: dropdown
        span: right
        trigger:
            action: show
            field: driver
            condition: value[pagos_qr]
        comment: "Se configura en: Pagos QR → Cuentas"

    is_active:
        label: Activo
        type: switch
        span: left
        default: true

    instructions:
        label: Instrucciones de pago
        type: richeditor
        size: large
        span: full
        comment: "Datos de cuenta bancaria, número WhatsApp, dirección de donde puede pagar con efectivo, etc. También puede incluir información adicional para otros métodos de pago."
