title: Leads
list: $/aero/crm/models/lead/columns.yaml
modelClass: Aero\Crm\Models\Lead
recordUrl: aero/crm/leads/update/:id
noRecordsMessage: No hay leads registrados todavía.
recordsPerPage: 20
showCheckboxes: true

toolbar:
    buttons: list_toolbar
    search:
        prompt: Buscar leads

filter:
    scopes:
        status:
            label: Estado
            type: dropdown
            conditions: status = :value
            options:
                new: Nuevo
                contacted: Contactado
                qualified: Calificado
                disqualified: Descartado

defaultSort:
    column: created_at
    direction: desc
