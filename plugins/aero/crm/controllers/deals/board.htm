        .crm-board-card:active { cursor: grabbing; }

    <div class="crm-board">
        <?php foreach ($pipeline->stages as $stage): ?>
        <div class="crm-board-column"
             data-stage-id="<?= $stage->id ?>">
            <div class="crm-board-column-header">
                <div><span class="dot" style="background: <?= e($stage->color) ?>"></span><strong><?= e($stage->name) ?></strong></div>
                <span class="meta"><?= $stage->deals->count() ?></span>

            <?php foreach ($stage->deals as $deal): ?>

                 draggable="true"

                 onclick="window.location='<?= \Backend::url('aero/crm/deals/update/' . $deal->id) ?>'">
                <span class="title"><?= e($deal->title) ?></span>
                <span class="meta">
                    <?= $deal->contact?->full_name ?? $deal->company?->name ?? '' ?>
                    <?php if ($deal->value): ?> · <?= number_format((float) $deal->value, 2) ?> <?= e($deal->currency) ?><?php endif; ?>
                </span>

        <?php endforeach; ?>
    </div>
</div>

<script>
(function () {
    var board = document.getElementById('crmBoard');
    if (!board) return;

    var draggedId = null;

    board.querySelectorAll('.crm-board-card').forEach(function (card) {
        card.addEventListener('dragstart', function (e) {
            draggedId = card.dataset.dealId;
            card.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        });
        card.addEventListener('dragend', function () {
            card.classList.remove('dragging');
        });
    });

    board.querySelectorAll('.crm-board-column').forEach(function (column) {
        column.addEventListener('dragover', function (e) {
            e.preventDefault();
            column.classList.add('drop-hover');
        });
        column.addEventListener('dragleave', function () {
            column.classList.remove('drop-hover');
        });
        column.addEventListener('drop', function (e) {
            e.preventDefault();
            column.classList.remove('drop-hover');
            if (!draggedId) return;

            var card = board.querySelector('[data-deal-id="' + draggedId + '"]');
            if (card) column.appendChild(card);

            var ids = Array.from(column.querySelectorAll('[data-deal-id]')).map(function (el) {
                return el.dataset.dealId;
            });

            $.request('onMoveDeal', {
                data: { deal_id: draggedId, stage_id: column.dataset.stageId, ids: ids },
                confirm: false
            });

            draggedId = null;
        });
    });
})();
</script>
