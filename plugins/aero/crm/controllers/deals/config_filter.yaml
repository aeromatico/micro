scopes:
    status:
        label: Estado
        type: dropdown
        options:
            open: Abierto
            won: Ganado
            lost: Perdido
        conditions: status = ':filtered'

    stage_id:
        label: Etapa
        type: dropdown
        options: getStageIdOptions
        conditions: stage_id in (:filtered)

    in_pipeline:
        label: En pipeline
        type: switch
        default: true
        conditions: in_pipeline = :filtered
