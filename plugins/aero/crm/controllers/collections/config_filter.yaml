scopes:
    status:
        label: Estado
        type: dropdown
        options:
            pending: Pendiente
            paid: Pagado
            void: Anulado
        conditions: status in (:filtered)

    contact_list_id:
        label: Lista
        type: dropdown
        emptyOption: Todas las listas
        options: getContactListIdOptions
        modelScope: filterContactList
