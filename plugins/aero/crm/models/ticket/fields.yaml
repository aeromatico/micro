fields:
    subject:
        label: Asunto
        type: text
        span: full
        required: true

    origin_tenant_id:
        label: Enviar a un tenant
        type: dropdown
        span: auto
        emptyOption: Ninguno (ticket de mi propio CRM)
        comment: Elegí un tenant para abrir un ticket de soporte de la plataforma dirigido a uno de sus admins.

    requester_user_id:
        label: Administrador del tenant
        type: dropdown
        span: auto
        emptyOption: — primero elegí el tenant —
        dependsOn: origin_tenant_id
        comment: Primero elegí «Enviar a un tenant»; aquí aparecen sus admins. Verá y responderá desde Soporte.

    department_id:
        label: Departamento
        type: dropdown
        span: auto
        required: true
        emptyOption: — elegí —
        dependsOn: origin_tenant_id

    assigned_to:
        label: Asignado a
        type: dropdown
        span: auto
        emptyOption: — elegí —
        required: true
        dependsOn: department_id
        comment: Integrantes del departamento; si no tiene, cualquier admin del ámbito.

    priority:
        label: Prioridad
        type: dropdown
        span: auto

    status:
        label: Estado
        type: dropdown
        span: auto

    description:
        label: Descripción (Markdown)
        type: markdown
        mode: split
        size: large
        span: full

    requester_name:
        label: Solicitante
        type: text
        span: auto
        tab: Solicitante

    requester_email:
        label: Correo
        type: text
        span: auto
        tab: Solicitante

    requester_phone:
        label: Teléfono / WhatsApp
        type: text
        span: auto
        tab: Solicitante

    contact_id:
        label: Contacto del CRM
        type: dropdown
        span: auto
        emptyOption: Ninguno
        tab: Solicitante

    conversation:
        label: Conversación
        type: partial
        path: $/aero/crm/models/ticket/_conversation.php
        span: full
        context: update
        tab: Respuestas

    new_reply:
        label: Nueva respuesta (Markdown)
        type: markdown
        mode: split
        size: small
        span: full
        tab: Respuestas

    reply_internal:
        label: Nota interna (el solicitante no la ve)
        type: checkbox
        span: full
        tab: Respuestas
