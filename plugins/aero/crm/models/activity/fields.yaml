fields:
    type:
        label: Tipo
        type: dropdown
        span: left
        options:
            call: Llamada
            email: Email
            whatsapp: WhatsApp
            meeting: Reunión
            note: Nota
            task: Tarea

    due_at:
        label: Vencimiento
        type: datepicker
        span: right
        mode: datetime

    subject:
        label: Asunto
        type: text
        span: full
        required: true

    description:
        label: Descripción
        type: textarea
        span: full
        size: small

    owner_id:
        label: Responsable
        type: dropdown
        span: left
        emptyOption: "-- Sin responsable --"

    status:
        label: Estado
        type: dropdown
        span: right
        default: pending
        options:
            pending: Pendiente
            in_progress: En curso
            completed: Completada
            cancelled: Cancelada
