columns:
    type:
        label: Tipo
        type: text
        width: 100px

    subject:
        label: Asunto
        type: text

    due_at:
        label: Vencimiento
        type: datetime
        width: 160px

    owner:
        label: Responsable
        relation: owner
        select: concat(first_name, ' ', last_name)
        width: 160px

    status:
        label: Estado
        type: partial
        path: $/aero/crm/models/activity/_column_status.htm
        clickable: false
        width: 140px

    completed_at:
        label: Finalizado
        type: datetime
        default: '—'
        width: 160px
