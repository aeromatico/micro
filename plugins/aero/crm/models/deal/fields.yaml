fields:
    title:
        label: Título
        type: text
        span: full
        required: true

    stage:
        label: Etapa
        type: relation
        nameFrom: name
        scope: belongingToTenant
        span: left
        required: true

    status:
        label: Estado
        type: dropdown
        span: right
        options:
            open: Abierto
            won: Ganado
            lost: Perdido

    contact:
        label: Contacto
        type: relation
        nameFrom: full_name
        emptyOption: "-- Sin contacto --"
        scope: belongingToTenant
        span: left

    company:
        label: Empresa
        type: relation
        nameFrom: name
        emptyOption: "-- Sin empresa --"
        scope: belongingToTenant
        span: right

    value:
        label: Valor
        type: number
        span: left

    currency:
        label: Moneda
        type: text
        span: right
        placeholder: "USD"

    owner_id:
        label: Responsable
        type: dropdown
        emptyOption: "-- Sin responsable --"
        span: left

    team:
        label: Equipo
        type: relation
        nameFrom: name
        emptyOption: "-- Sin equipo --"
        scope: belongingToTenant
        span: right

    expected_close_date:
        label: Cierre estimado
        type: datepicker
        span: left
        mode: date

    in_pipeline:
        label: En el pipeline
        type: switch
        span: right
        default: true
        comment: "Si lo apagás, la tarjeta desaparece del tablero (kanban) pero el deal y su historial se conservan aquí."
