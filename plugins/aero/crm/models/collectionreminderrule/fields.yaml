fields:
    start_days_before:
        label: Iniciar recordatorio
        type: number
        span: auto
        required: true
        default: 5
        comment: "Cuántos días antes de la fecha de vencimiento comienza la cobranza automática. Valores permitidos: 1, 2, 3, 4, 5, 7 o 10."

    frequency_days:
        label: Repetir recordatorio
        type: dropdown
        span: auto
        required: true
        default: 2
        comment: "Cada cuántos días se genera un nuevo recordatorio."

    contactList:
        label: Lista
        type: relation
        nameFrom: name
        span: auto
        placeholder: "Todas las listas / todos los cobros"
        comment: "Si se deja vacío, este recordatorio aplica a todos los cobros del tenant"

    active:
        label: Regla activa
        type: switch
        span: auto
        default: true

    sort_order:
        label: Orden
        type: number
        span: auto
        default: 0

    message_template:
        label: Plantilla del mensaje
        type: textarea
        size: large
        span: full
        placeholder: 'Hola {{contacto}}, te recordamos que tienes un pago pendiente de {{monto}} {{moneda}} por "{{concepto}}" con vencimiento el {{vencimiento}}. Por favor regulariza a la brevedad.'
        comment: "Variables disponibles: {{contacto}}, {{monto}}, {{moneda}}, {{concepto}}, {{vencimiento}}. Si se deja vacío se usa la plantilla por defecto de Configuración del CRM."
