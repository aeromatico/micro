fields:
    contactLists:
        label: Listas (opcional)
        type: relation
        nameFrom: name
        span: full
        scope: belongingToTenant
        emptyOption: "No hay listas cargadas en este tenant"
        comment: "Agrupa el cobro en una o varias listas. Es solo organización, no define quién recibe el recordatorio."

    recipients:
        label: Contactos
        type: relation
        nameFrom: full_name
        span: full
        scope: belongingToTenant
        emptyOption: "No hay contactos cargados en este tenant"
        comment: "Personas que reciben el recordatorio de cobro. Sumá una o varias, pertenezcan o no a la lista."

    concept:
        label: Concepto
        type: text
        span: full
        required: true
        placeholder: "Ej. Mensualidad de agosto"

    amount:
        label: Monto
        type: number
        span: auto
        required: true
        step: 0.01

    currency:
        label: Moneda
        type: dropdown
        span: auto
        default: BOB
        options:
            BOB: Bolivianos (BOB)
            USD: Dólares (USD)

    due_date:
        label: Fecha de vencimiento
        type: datepicker
        mode: date
        span: auto
        required: true

    status:
        label: Estado
        type: dropdown
        span: auto

    notes:
        label: Notas
        type: textarea
        size: small
        span: full

    last_reminder_at:
        label: Último recordatorio enviado
        type: datepicker
        mode: datetime
        span: auto
        disabled: true

    reminder_count:
        label: Recordatorios enviados
        type: number
        span: auto
        disabled: true

    _payment_info:
        type: partial
        path: payment_info
        span: full
        context: update
