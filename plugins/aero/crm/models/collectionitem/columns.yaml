columns:
    contact:
        label: Contacto
        relation: contact
        select: concat(first_name, ' ', last_name)

    concept:
        label: Concepto
        type: text

    amount:
        label: Monto
        type: number
        width: 110px

    currency:
        label: Moneda
        type: text
        width: 80px

    due_date:
        label: Vencimiento
        type: date
        width: 130px

    status:
        label: Estado
        type: text
        width: 100px

    last_reminder_at:
        label: Último recordatorio
        type: datetime
        width: 160px
