    - Primera versión del plugin CRM — empresas, contactos, leads, pipeline/kanban,
      actividades, equipos y configuración por tenant.
    - create_teams_table.php
    - create_companies_table.php
    - create_contacts_table.php
    - create_pipelines_table.php
    - create_deals_table.php
    - create_leads_table.php
    - create_activities_table.php
    - create_crm_settings_table.php
    - grant_tenant_admin_permissions.php

1.0.1:
    - Agrega redes sociales/mensajería (repeater) a contactos y empresas.
    - add_social_links_to_contacts_and_companies.php

1.1.0:
    - Agrega listas de contactos y el módulo de Cobranzas, con recordatorios
      automáticos por WhatsApp vía Aero.Hello.
    - create_contact_lists_table.php
    - create_contact_list_contact_table.php
    - create_collection_items_table.php
    - add_collections_fields_to_crm_settings_table.php
    - grant_collections_permissions.php

1.2.0:
    - "Automatización de cobranzas configurable: reglas de recordatorio por
      lista (cascada de mensajes antes/después del vencimiento, con plantilla
      propia por regla) en lugar del intervalo fijo único."
    - create_collection_reminder_rules_table.php
    - create_collection_reminder_logs_table.php

1.2.1:
    - Repara la tabla de logs de recordatorios, que quedaba sin foreign key ni
      indice unico porque los nombres autogenerados superaban los 64 caracteres
      de MySQL y la migracion moria a medias.
    - repair_collection_reminder_logs.php

1.2.2:
    - Reemplaza el nombre del paso por inicio y frecuencia configurables,
      registra cada fecha programada y agrega el recordatorio especial del vencimiento.
    - add_collection_reminder_schedule.php

1.2.3:
    - "Reconcilia el esquema de recordatorios instalado a medias: hace opcional
      offset_days (reemplazado por start_days_before/frequency_days) para que no
      rompa la creación de reglas."
    - make_offset_days_nullable.php

1.2.4:
    - Agrega el switch "En el pipeline" a Deal — quitar una tarjeta del
      tablero ya no borra el registro, solo lo oculta del kanban conservando
      su historial (actividades, valor, etc.). Se puede reactivar desde la
      lista completa de deals.
    - add_in_pipeline_to_deals_table.php

1.2.5:
    - "Nuevo menú 'Equipo' (aero/crm/team): invitar colaboradores por
      correo/WhatsApp a gestionar el tenant como el propietario original.
      Reemplaza al menú 'Equipos' en la navegación (que gestionaba
      Team/TeamMember para asignar Deals) por Aero.Sites\\TenantUser, que es
      lo que ResolvesCurrentTenant usa en todo el proyecto. Team/TeamMember
      no se tocó — sigue disponible para si se retoma la asignación de deals
      por equipo, solo dejó de estar en el menú."

1.2.6:
    - "Cobranzas se conecta con aero/qrbo (si está instalado): una cuenta
      bancaria por defecto en Configuración de CRM genera un QR de cobro real
      que se adjunta a los recordatorios de WhatsApp. Con una cuenta con API
      de banco el cobro se marca pagado solo; con una cuenta estática (sin
      API) queda para confirmar a mano, igual que en aero/shop."
    - add_collections_bank_account_id_to_crm_settings_table.php
    - add_payment_reference_to_collection_items_table.php

1.3.0:
    - "Seeders de demostración: limpia datos existentes del CRM y carga
      datos ficticios realistas (empresas, contactos, deals, leads,
      actividades, equipos, listas, cobranzas y reglas de recordatorio)
      para verificar la operabilidad completa del módulo."
    - seed_clear_crm_data.php
    - seed_demo_data.php

1.3.2:
    - "Switch 'En el pipeline' en Lead: al convertir un lead, el deal creado
      hereda el valor y respeta si debe aparecer o no en el tablero kanban."
    - add_in_pipeline_to_leads_table.php

1.3.3:
    - "Cobranzas: la lista del cobro ya no aparece preseleccionada (placeholder
      para elegirla) y los destinatarios pasan a ser uno o varios contactos
      (tabla pivote), para que además de la lista se pueda sumar a mano a
      quien también debe recibir el recordatorio."
    - create_collection_item_contact_table.php

1.3.4:
    - "Cobranzas: se quita el contacto único del formulario — ahora se cargan
      los contactos directamente. La columna legada contact_id queda opcional
      y sus valores se migran al pivote para no perder el histórico."
    - make_collection_items_contact_id_nullable.php

1.3.5:
    - "Cobranzas: un cobro puede pertenecer a varias listas (relación
      contactLists). La columna legada contact_list_id queda opcional y sus
      valores se migran al pivote."
    - add_contact_lists_to_collection_items.php

1.3.6:
    - "Actividades: nuevo estado (Pendiente, En curso, Completada, Cancelada)
      editable directamente desde la lista. La fecha de finalizado se registra
      sola al pasar a Completada y se borra si la actividad se reabre."
    - add_status_to_activities_table.php
1.4.0:
    - "Sincronia bidireccional con Hello: todo contacto de WhatsApp del chat se crea o enlaza en el CRM del tenant (nombre de perfil de WhatsApp si existe) y nombre/telefono se mantienen iguales desde ambos lados; un numero que ya chateo se enlaza en vez de duplicarse. Comando crm:sync-hello (--dry-run, --tenant) para completar lo existente."
1.4.1:
    - "Contactos: los selectores Empresa, Responsable y Cliente de tienda ya no preseleccionan el primer registro (opcion vacia); Empresa, Listas y Cliente de tienda solo muestran registros del tenant del contacto. Un contacto nuevo o con email/telefono cambiado se enlaza solo al cliente de tienda del mismo tenant que coincida (completando nombre y email si faltaban); crm:sync-hello lo aplica tambien a los existentes."
1.4.2:
    - "Responsable (contactos, empresas, negocios, leads y actividades): selector propio con opcion vacia que lista solo los usuarios del tenant (admin primario + TenantUser); el filtro de contactos igual. Un superadmin sin tenant sigue viendo a todos y un responsable ya guardado se conserva."
1.4.3:
    - "Negocios, reglas de recordatorio y listas: selectores de Etapa, Contacto, Empresa, Equipo, Lista y Contactos solo muestran registros del tenant; Contacto/Empresa/Equipo de un negocio ya no preseleccionan el primero."
1.4.4:
    - "Fix: guardar contactos, empresas, negocios, leads y actividades fallaba al dejar Responsable vacio (el desplegable enviaba una cadena vacia a una columna entera); ahora se guarda como NULL."
1.4.5:
    - "Equipos: el campo Miembros ahora es una lista de casillas con solo los usuarios del tenant (los miembros ya guardados se conservan) en vez de todos los usuarios del backend."
1.4.6:
    - "Fix: editar un contacto enlazado a Hello no guardaba nada (decia \"Contacto actualizado\"): el partial de la pestana Acciones tenia un <form> anidado que cerraba el formulario principal y los botones Guardar enviaban el cuerpo vacio. Ahora el envio de mensajes usa un boton dentro del formulario."
1.5.0:
    - "Tickets y departamentos: mesa de ayuda con el mismo esquema para el sitio principal (superadmin, sin tenant) y para cada tenant. Departamentos con integrantes (se asignan desde CRM > Equipo o desde el propio departamento), tickets numerados por ambito con prioridad, estado, asignacion a un integrante del departamento, respuestas y notas internas. Un usuario sin rol admin solo ve los tickets de sus departamentos o asignados a el."
    - create_ticketing_tables.php
    - grant_ticket_permissions.php
1.6.0:
    - "Respuestas rapidas: nuevo menu CRM > Respuestas para registrar textos reutilizables por area (general, ventas, soporte, cobranzas, postventa), cada uno con un atajo unico por ambito que se invoca con / (ej. /catalogo)."
    - create_quick_replies_table.php
    - grant_quick_reply_permission.php
1.6.1:
    - "Respuestas rapidas: campo Orden (por defecto 10) y contador de usos (uses_count) que sube cada vez que un agente invoca la respuesta desde el chat."
    - add_order_and_uses_to_quick_replies.php
1.7.0:
    - "Portal de soporte del micrositio: los clientes (rainlab:user o invitados) abren y siguen sus tickets; autor frontend/solicitante distinguido en el panel, enlace privado por token para invitados y aviso de respuestas sin leer para el agente."
    - add_frontend_portal_to_ticket_tables.php
1.8.0:
    - "Soporte de plataforma para tenants: los tenants abren y siguen tickets en la mesa de ayuda de la plataforma (origin_tenant_id), separado del CRM propio del tenant."
    - add_origin_tenant_to_tickets.php

1.9.0:
    - "Sistema de tickets del sitio: interruptor en CRM > Configuración (desactivado por defecto). Mientras esté apagado, Soporte no aparece en el menú ni en el pie del micrositio y sus páginas responden 404."
    - add_tickets_enabled_to_crm_settings_table.php
