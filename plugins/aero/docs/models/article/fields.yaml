fields:
    title:
        label: Título
        span: left
        required: true
    slug:
        label: Slug
        span: right
        preset:
            field: title
            type: slug
    category_id:
        label: Categoría
        type: dropdown
        showSearch: true
        emptyOption: '— Sin categoría —'
        span: left
    sort_order:
        label: Orden
        comment: Menor número aparece primero dentro de su categoría.
        type: number
        default: 0
        span: right
    plugin_version:
        label: Versión del plugin
        comment: Versión del plugin que se documentó (ej. 1.40.0). Sirve para detectar docs desactualizadas.
        span: left
        placeholder: '1.40.0'
    is_global:
        label: Global (todos los sitios)
        comment: Se muestra tal cual en el centro de ayuda de todos los tenants.
        type: switch
        span: right
    excerpt:
        label: Resumen
        comment: Opcional; si lo dejas vacío se genera del contenido.
        type: textarea
        size: small
    content:
        label: Contenido (Markdown)
        type: markdown
        mode: split
        size: giant
    is_published:
        label: Publicado
        type: switch
        default: true
        span: left
    is_featured:
        label: Destacado en portada
        type: switch
        span: right
    published_at:
        label: Fecha de publicación
        type: datepicker
        mode: datetime
        span: left

    _activity_section:
        tab: Actividad
        type: section
        label: Actividad
    version:
        tab: Actividad
        label: Versión actual
        comment: Se incrementa automáticamente en cada actualización.
        type: number
        disabled: true
        span: left
    views:
        tab: Actividad
        label: Visitas
        comment: Arranca en 1000.
        type: number
        disabled: true
        span: right
    helpful_yes:
        tab: Actividad
        label: '¿Fue útil? (Sí)'
        type: number
        disabled: true
        span: left
    helpful_no:
        tab: Actividad
        label: '¿Fue útil? (No)'
        type: number
        disabled: true
        span: right
    _versions:
        tab: Actividad
        type: partial
        path: $/aero/docs/models/article/_versions.htm
        span: full
