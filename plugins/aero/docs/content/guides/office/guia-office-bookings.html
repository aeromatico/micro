  }
  function visible(fl) {
    if (state.mode === 'update' && fl.ctx === 'create') return false;
    if (fl.show) { var o = byId(fl.show); if (o && val(o) !== '') return false; }
    return true;
  }
  function setVal(fl, v) {
    if (fl.type === 'switch') { $('#' + fl.id).checked = !!v; return; }
    if (fl.type === 'checks') { Array.prototype.forEach.call($('#' + fl.id).querySelectorAll('input'), function (c, i) { c.checked = v.indexOf(i) >= 0; }); return; }
    if (fl.type === 'repeater') { $('#' + fl.id).innerHTML = ''; v.forEach(function (r) { addRow(fl, r); }); return; }
    $('#' + fl.id).value = v;
  }
  function problems() {
    var errs = [];
    F.forEach(function (fl) {
      if (!visible(fl)) return;
      var v = val(fl);
      if (fl.req && (v === '' || v === 0)) { errs.push([fl.id, 'El campo ' + fl.label + ' es obligatorio.']); return; }
      if (fl.max && typeof v === 'string' && v.length > fl.max) errs.push([fl.id, fl.label + ' no puede superar ' + fl.max + ' caracteres.']);
      if (fl.email && v && !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) errs.push([fl.id, 'Escribe un correo válido.']);
      if (fl.type === 'number' && v !== '') {
        var n = parseFloat(v);
        if (isNaN(n)) errs.push([fl.id, fl.label + ' debe ser un número.']);
        else if (fl.min != null && n < fl.min) errs.push([fl.id, fl.label + ' debe ser al menos ' + fl.min + '.']);
        else if (fl.maxn != null && n > fl.maxn) errs.push([fl.id, fl.label + ' no puede superar ' + fl.maxn + '.']);
      }
      if (fl.after && v) { var o = byId(fl.after); var ov = o && val(o); if (ov && v <= ov) errs.push([fl.id, fl.label + ' debe ser posterior a «' + o.label + '».']); }
      if (fl.type === 'repeater') rows(fl).forEach(function (r) {
        var ok = /^([01]?\d|2[0-3]):[0-5]\d$/;
        if (!ok.test(r[1]) || !ok.test(r[2])) errs.push([fl.id, 'Cada turno necesita hora «Desde» y «Hasta» con formato HH:MM.']);
        else if (r[1] >= r[2]) errs.push([fl.id, 'En cada turno, «Hasta» debe ser posterior a «Desde».']);
      });
    });
    return errs;
  }
  function showErr(id, msg) {
    var b = $('[data-f="' + id + '"]'); if (!b) return;
    var m = b.querySelector('.errmsg'); m.hidden = !msg; m.textContent = msg || '';
    var i = b.querySelector('input,select,textarea'); if (i && i.type !== 'checkbox') i.classList.toggle('err', !!msg);
  }
  function clearErr(e) { var b = e.closest('.field'); if (b) showErr(b.getAttribute('data-f'), ''); }

  function steps() {
    var s = F.filter(function (fl) { return visible(fl) && fl.s; }).map(function (fl) { return { f: fl }; });
    s.push({ f: { id: '__save', s: { t: 'Guardar', b: CFG.saveBody, tip: CFG.saveTip }, ex: '' }, last: true });
    return s;
  }
  function done(st) {
    if (st.last) return state.mode === 'update';
    var v = val(st.f);
    return st.f.type === 'switch' || (v !== '' && v !== 0);
  }
  function exText(fl) {
    if (fl.ex == null || fl.ex === '') return '';
    if (fl.type === 'repeater') return fl.ex.map(function (r) { return DAYS[r[0] - 1] + ' ' + r[1] + '–' + r[2]; }).join('\n');
    if (fl.type === 'checks') return fl.ex.map(function (i) { return fl.opts[i]; }).join(', ');
    if (fl.type === 'select') { var o = fl.opts.filter(function (x) { return x[0] === fl.ex; })[0]; return o ? o[1] : String(fl.ex); }
    if (fl.type === 'switch') return fl.ex ? 'Activado' : 'Desactivado';
    return String(fl.ex).replace('T', ' ');
  }
  function render() {
    var st = steps(); state.step = Math.max(0, Math.min(st.length - 1, state.step));
    var cur = st[state.step], fl = cur.f;
    $('#gEyebrow').textContent = 'Paso ' + (state.step + 1) + ' de ' + st.length + (cur.last ? '' : fl.req ? ' · obligatorio' : ' · opcional');
    $('#gTitle').textContent = fl.s.t;
    var body = $('#gBody'); body.innerHTML = '';
    body.appendChild(el('p', null, fl.s.b));
    var ex = exText(fl);
    if (ex) { var w = el('div'); w.appendChild(el('div', 'g-sub', 'Ejemplo')); w.appendChild(el('div', 'example', ex)); body.appendChild(w); }
    if (fl.s.tip) { var n = el('div', 'note'); n.appendChild(el('b', null, 'Ojo. ')); n.appendChild(document.createTextNode(fl.s.tip)); body.appendChild(n); }
    $('#gBar').style.width = Math.round(100 * st.filter(done).length / st.length) + '%';
    $('#gPrev').disabled = state.step === 0; $('#gNext').disabled = state.step === st.length - 1;
    $('#gFill').hidden = cur.last ? state.mode === 'update' : fl.ex == null || fl.ex === '';
    $('#gFill').textContent = cur.last ? 'Crear con los datos actuales' : 'Rellenar ejemplo';
    var ol = $('#gSteps'); ol.innerHTML = '';
    st.forEach(function (s, i) {
      var li = el('li'), b = el('button'); b.type = 'button';
      if (i === state.step) b.setAttribute('aria-current', 'step');
      var d = done(s); if (d) b.className = 'done';
      b.appendChild(el('span', 'dot', d ? '✓' : String(i + 1)));
      b.appendChild(el('span', null, s.f.s.t));
      b.onclick = function () { go(i); }; li.appendChild(b); ol.appendChild(li);
    });
    F.forEach(function (x) {
      var box = $('[data-f="' + x.id + '"]'); box.hidden = !visible(x);
      box.classList.toggle('is-guided', x.id === fl.id && !box.hidden);
    });
    var lk = $('#lock'); var msg = state.mode === 'update' ? CFG.lockUpdate : CFG.lock;
    lk.hidden = !msg; lk.textContent = msg || '';
  }
  function go(i, scroll) {
    state.step = i; render();
    if (scroll !== false) { var b = $('[data-f="' + steps()[state.step].f.id + '"]'); if (b && !b.hidden) b.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  }

  var ft;
  function flash(msg, isErr) { var x = $('#flash'); x.textContent = msg; x.className = isErr ? 'err' : ''; x.hidden = false; clearTimeout(ft); ft = setTimeout(function () { x.hidden = true; }, 4200); }
  function save(close) {
    F.forEach(function (fl) { showErr(fl.id, ''); });
    var errs = problems();
    if (errs.length) {
      errs.forEach(function (e) { showErr(e[0], e[1]); });
      var i = steps().map(function (s) { return s.f.id; }).indexOf(errs[0][0]); if (i >= 0) go(i);
      flash('No se pudo guardar: ' + errs[0][1], true); return;
    }
    state.mode = 'update';
    $('#h1').textContent = CFG.updTitle; $('#crumb').textContent = CFG.crumbUpd + ' · Guía de capacitación';
    $('#btnSave').textContent = 'Guardar'; $('#btnSaveClose').textContent = 'Guardar y cerrar';
    $('#ctxLine').textContent = 'context: update';
    render();
    flash(close ? CFG.doneClose : CFG.doneMsg);
  }

  $('#gPrev').onclick = function () { go(state.step - 1); };
  $('#gNext').onclick = function () { go(state.step + 1); };
  $('#gFill').onclick = function () {
    var cur = steps()[state.step];
    if (cur.last) { save(false); return; }
    setVal(cur.f, cur.f.ex); render();
  };
  $('#btnSave').onclick = function () { save(false); };
  $('#btnSaveClose').onclick = function () { save(true); };
  $('#btnReset').onclick = function () { location.reload(); };
  $('#chkTech').onchange = function (e) { document.body.classList.toggle('show-tech', e.target.checked); };

  $('#h1').textContent = CFG.title; $('#crumb').textContent = CFG.crumb + ' · Guía de capacitación';
  $('#ctxLine').textContent = 'context: create';
  $('#sampleNote').textContent = 'Todos los datos de esta guía son de ejemplo; la demo no guarda nada.';
  build();
  render();
})();
</script>
</body></html>
