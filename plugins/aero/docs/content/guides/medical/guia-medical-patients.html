        done: function () { return f.req ? !!V(f.id) : true; } });
    });
    s.push({ id: 'save', f: null, title: 'Guardar', last: true, body: 'Pulsa «Crear». La demo valida los campos obligatorios y te lleva a la pantalla de edición. No se guarda nada real.',
      tip: G.saveTip || '', ex: '', fill: function () { save(false); }, done: function () { return mode === 'update'; } });
    return s;
  }
  function renderGuide() {
    var cur = steps[step];
    $('#gEyebrow').textContent = 'Paso ' + (step + 1) + ' de ' + steps.length + (cur.last ? '' : cur.req ? ' · obligatorio' : ' · opcional');
    $('#gTitle').textContent = cur.title;
    var body = $('#gBody'); body.innerHTML = '';
    var p = document.createElement('p'); p.textContent = cur.body || ''; body.appendChild(p);
    if (cur.ex) { var w = document.createElement('div'), l = document.createElement('div'), e = document.createElement('div'); l.className = 'g-sub'; l.textContent = 'Ejemplo'; e.className = 'example'; e.textContent = cur.ex; w.appendChild(l); w.appendChild(e); body.appendChild(w); }
    if (cur.tip) { var n = document.createElement('div'), b = document.createElement('b'); n.className = 'note'; b.textContent = 'Ojo. '; n.appendChild(b); n.appendChild(document.createTextNode(cur.tip)); body.appendChild(n); }
    var ok = steps.filter(function (x) { return x.done(); }).length;
    $('#gBar').style.width = Math.round(100 * ok / steps.length) + '%';
    $('#gPrev').disabled = step === 0; $('#gNext').disabled = step === steps.length - 1;
    $('#gFill').hidden = !cur.fill || (cur.last && mode === 'update');
    $('#gFill').textContent = cur.last ? 'Crear con los datos actuales' : 'Rellenar ejemplo';
    var ol = $('#gSteps'); ol.innerHTML = '';
    steps.forEach(function (s, i) {
      var li = document.createElement('li'), bt = document.createElement('button'), d = document.createElement('span'), t = document.createElement('span');
      bt.type = 'button'; if (i === step) bt.setAttribute('aria-current', 'step');
      var dn = s.done() && (!s.last || mode === 'update'); if (dn) bt.className = 'done';
      d.className = 'dot'; d.textContent = dn ? '✓' : String(i + 1); t.textContent = s.title;
      bt.appendChild(d); bt.appendChild(t); bt.onclick = function () { go(i); }; li.appendChild(bt); ol.appendChild(li);
    });
    $$('.field').forEach(function (f) { f.classList.remove('is-guided'); });
    if (cur.f) { selectTab(cur.tab || TABS[0][0]); var el = $('[data-f="' + cur.id + '"]'); if (el && !el.hidden) el.classList.add('is-guided'); }
  }
  function go(i, sc) {
    step = Math.max(0, Math.min(steps.length - 1, i)); renderGuide();
    if (sc !== false && steps[step].f) { var el = $('[data-f="' + steps[step].id + '"]'); if (el && !el.hidden) el.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  }
  function refresh() {
    var id = steps[step].id; steps = buildSteps();
    var ix = steps.map(function (s) { return s.id; }).indexOf(id); step = ix >= 0 ? ix : Math.min(step, steps.length - 1); renderGuide();
  }
  function renderTabs() {
    var t = $('#tabs'); t.innerHTML = ''; if (TABS.length < 2) { t.hidden = true; return; }
    TABS.forEach(function (x) { var b = document.createElement('button'); b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(tab === x[0])); b.textContent = x[1]; b.onclick = function () { selectTab(x[0]); }; t.appendChild(b); });
  }
  function selectTab(k) { tab = k; TABS.forEach(function (x) { $('#tab-' + x[0]).hidden = x[0] !== k; }); renderTabs(); }
  function showErr(id, msg) {
    var box = $('[data-f="' + id + '"]'); if (!box) return; var m = $('.errmsg', box), i = $('input,select,textarea', box);
    if (m) { m.hidden = !msg; m.textContent = msg || ''; } if (i && i.type !== 'checkbox') i.classList.toggle('err', !!msg);
  }
  function validate() {
    var errs = [];
    F.forEach(function (f) {
      showErr(f.id, ''); if (!shown(f)) return; var v = V(f.id), m = '';
      if (f.req && !v && f.t !== 'sw') m = 'El campo ' + f.l + ' es obligatorio.';
      else if (v && f.max && v.length > f.max) m = f.l + ' no puede superar ' + f.max + ' caracteres.';
      else if (v && f.t === 'num' && isNaN(parseFloat(v.replace(',', '.')))) m = f.l + ' debe ser un número.';
      else if (v && f.t === 'num' && parseFloat(v.replace(',', '.')) < 0) m = f.l + ' no puede ser negativo.';
      else if (v && f.chk) m = f.chk(v) || '';
      if (m) errs.push([f.id, m]);
    });
    return errs;
  }
  function save(close) {
    var errs = validate();
    if (errs.length) {
      errs.forEach(function (e) { showErr(e[0], e[1]); });
      var f = F.filter(function (x) { return x.id === errs[0][0]; })[0]; selectTab(f.tab || TABS[0][0]);
      var ix = steps.map(function (s) { return s.id; }).indexOf(errs[0][0]); if (ix >= 0) go(ix);
      flash('No se pudo crear: ' + errs[0][1], true); return;
    }
    mode = 'update'; $('#h1').textContent = G.upd || ('Editar: ' + G.title); $('#crumb').textContent = G.crumb + '/update/7 · Guía de capacitación';
    $('#btnSave').textContent = 'Guardar'; $('#btnSaveClose').textContent = 'Guardar y cerrar'; $('#lockNote').hidden = true;
    if (G.updNote) { var u = $('#updNote'); u.hidden = false; u.innerHTML = ''; var h = document.createElement('h4'); h.textContent = G.updNote[0]; var t = document.createElement('div'); t.className = 'help'; t.textContent = G.updNote[1]; u.appendChild(h); u.appendChild(t); }
    flash(close ? 'Creado. En la app real vuelves a la lista.' : 'Creado. Ahora estás en la pantalla de edición.'); refresh();
  }
  var ft;
  function flash(msg, isErr) { var f = $('#flash'); f.textContent = msg; f.className = isErr ? 'err' : ''; f.hidden = false; clearTimeout(ft); ft = setTimeout(function () { f.hidden = true; }, 4200); }
  build(); applyTriggers(); steps = buildSteps(); renderTabs();
  $('#gPrev').onclick = function () { go(step - 1); };
  $('#gNext').onclick = function () { go(step + 1); };
  $('#gFill').onclick = function () { var s = steps[step]; if (s.fill) s.fill(); if (!s.last) refresh(); };
  $('#btnSave').onclick = function () { save(false); };
  $('#btnSaveClose').onclick = function () { save(true); };
  $('#btnReset').onclick = function () { location.reload(); };
  $('#chkTech').onchange = function (e) { document.body.classList.toggle('show-tech', e.target.checked); };
  $$('.field input, .field select, .field textarea').forEach(function (el) {
    el.addEventListener('input', function () { if (el.classList.contains('err')) { el.classList.remove('err'); var m = $('.errmsg', el.closest('.field')); if (m) m.hidden = true; } refresh(); });
    el.addEventListener('change', function () { applyTriggers(); refresh(); });
    el.addEventListener('focus', function () {
      var box = el.closest('.field'); if (!box) return;
      var ix = steps.map(function (s) { return s.id; }).indexOf(box.getAttribute('data-f')); if (ix >= 0 && ix !== step) go(ix, false);
    });
  });
  renderGuide();
})();
</script>
</body></html>
