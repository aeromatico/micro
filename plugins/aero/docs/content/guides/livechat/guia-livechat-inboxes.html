      if (!f.step || !shown(f)) return;
      var st = f.step;
      s.push({ id: f.id, tab: f.tab, fields: [f.id], title: st.title, body: st.body, tip: st.tip, ex: st.ex, req: f.req, opt: !f.req && f.type !== 'ro',
        fill: st.fill === undefined ? null : function () { setv(f.id, st.fill); }, done: function () { return f.req ? V(f.id) !== '' : true; } });
    });
    if (CFG.canSave) s.push({ id: 'save', tab: 'main', fields: [], title: 'Guardar', body: CFG.saveTip, tip: 'Al crear, el sistema genera la Widget key y el código para tu sitio; no hace falta tocar nada más.', ex: '', fill: function () { save(); }, done: function () { return S.mode === 'edit'; } });
    CFG.steps.forEach(function (x) { if (!x.upd || S.mode === 'edit') s.push(x); });
    return s;
  }
  function ids() { return steps.map(function (s) { return s.fields[0] || s.id; }); }
  function renderGuide() {
    var cur = steps[S.step];
    $('#gEyebrow').textContent = 'Paso ' + (S.step + 1) + ' de ' + steps.length + (cur.opt ? ' · opcional' : cur.req ? ' · obligatorio' : '');
    $('#gTitle').textContent = cur.title;
    var body = $('#gBody'); body.innerHTML = '';
    body.appendChild(el('p', null, cur.body));
    if (cur.ex) { var w = el('div'); w.appendChild(el('div', 'g-sub', 'Ejemplo')); w.appendChild(el('div', 'example', cur.ex)); body.appendChild(w); }
    if (cur.tip) { var n = el('div', 'note'); n.appendChild(el('b', null, 'Ojo. ')); n.appendChild(document.createTextNode(cur.tip)); body.appendChild(n); }
    var ok = steps.filter(function (s) { return s.done(); }).length;
    $('#gBar').style.width = Math.round(100 * ok / steps.length) + '%';
    $('#gPrev').disabled = S.step === 0; $('#gNext').disabled = S.step === steps.length - 1;
    $('#gFill').hidden = !cur.fill || (cur.id === 'save' && S.mode === 'edit');
    $('#gFill').textContent = cur.id === 'save' ? 'Crear con los datos actuales' : cur.id === 'tgconnect' ? 'Probar y conectar' : 'Rellenar ejemplo';
    var ol = $('#gSteps'); ol.innerHTML = '';
    steps.forEach(function (s, i) {
      var li = el('li'), bt = el('button'); bt.type = 'button';
      var d = s.done() && (s.id !== 'save' || S.mode === 'edit');
      if (i === S.step) bt.setAttribute('aria-current', 'step');
      if (d) bt.className = 'done';
      bt.appendChild(el('span', 'dot', d ? '✓' : String(i + 1))); bt.appendChild(el('span', null, s.title));
      bt.onclick = function () { go(i); }; li.appendChild(bt); ol.appendChild(li);
    });
    $$('.field,.upd').forEach(function (f) { f.classList.remove('is-guided'); });
    if (cur.tab) selectTab(cur.tab);
    cur.fields.forEach(function (f) { var e = $('[data-f="' + f + '"]'); if (e && !e.hidden) e.classList.add('is-guided'); });
  }
  function go(i, scroll) {
    S.step = Math.max(0, Math.min(steps.length - 1, i)); renderGuide();
    if (scroll !== false) { var f = steps[S.step].fields[0], e = f && $('[data-f="' + f + '"]'); if (e && !e.hidden) e.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  }
  function refresh() { var cur = steps[S.step].id; steps = build(); var i = steps.map(function (s) { return s.id; }).indexOf(cur); S.step = i >= 0 ? i : Math.min(S.step, steps.length - 1); applyVis(); renderGuide(); }

  // ---- Validación y guardado
  function showErr(id, m) { var b = $('[data-f="' + id + '"]'); if (!b) return; var e = $('.errmsg', b), i = $('input,select,textarea', b); if (e) { e.hidden = !m; e.textContent = m || ''; } if (i) i.classList.toggle('err', !!m); }
  function validate() {
    var errs = [];
    CFG.fields.forEach(function (f) { showErr(f.id, ''); });
    CFG.fields.forEach(function (f) {
      if (!shown(f) || f.type === 'ro') return;
      if (f.req && !V(f.id)) errs.push([f.id, 'El campo ' + f.label + ' es obligatorio.']);
      else if (f.max && V(f.id).length > f.max) errs.push([f.id, f.label + ' no puede superar ' + f.max + ' caracteres.']);
    });
    return errs.concat(CFG.validate(vals()));
  }
  function vals() { var o = {}; CFG.fields.forEach(function (f) { o[f.id] = V(f.id); }); return o; }
  function save() {
    var errs = validate();
    if (errs.length) {
      errs.forEach(function (e) { showErr(e[0], e[1]); });
      var f = F(errs[0][0]); if (f) selectTab(f.tab);
      var i = ids().indexOf(errs[0][0]); if (i >= 0) go(i);
      flash('No se pudo guardar: ' + errs[0][1], true); return;
    }
    if (S.mode === 'create') {
      S.mode = 'edit'; S.tokenSaved = !!V('telegram_bot_token');
      $('#h1').textContent = CFG.editTitle; $('#crumb').textContent = CFG.editCrumb;
      $('#f_widget_key').value = 'a1b2c3d4-0000-4000-8000-ejemplo0001';
      $('#f_embed_snippet').value = '<scr' + 'ipt src="https://tu-dominio/plugins/aero/livechat/assets/js/widget.js?v=1760000000" charset="utf-8" data-livechat-key="a1b2c3d4-0000-4000-8000-ejemplo0001" data-livechat-base="https://tu-dominio" async></scr' + 'ipt>';
      $('#ctxLine').textContent = 'context: update · ahora aparecen el código para el sitio y «Probar y conectar»';
      renderToolbar(); applyVis(); refresh();
      flash('Inbox creado (ejemplo). Ahora estás en la pantalla de edición.');
    } else flash('Inbox guardado (ejemplo).');
  }
  function renderToolbar() {
    var t = $('#toolbar'); t.innerHTML = '';
    var ed = S.mode === 'edit';
    var a = el('button', 'btn primary', ed ? 'Guardar' : 'Crear'); a.type = 'button'; a.onclick = save; t.appendChild(a);
    var c = el('button', 'btn', ed ? 'Guardar y cerrar' : 'Crear y cerrar'); c.type = 'button'; c.onclick = function () { save(); }; t.appendChild(c);
    var r = el('button', 'btn', 'Reiniciar demo'); r.type = 'button'; r.onclick = function () { location.reload(); }; t.appendChild(r);
    t.appendChild(el('span', 'spacer'));
    var l = el('label', 'chk'), k = el('input'); k.type = 'checkbox'; k.id = 'chkTech'; k.onchange = function () { document.body.classList.toggle('show-tech', k.checked); }; k.checked = document.body.classList.contains('show-tech');
    l.appendChild(k); l.appendChild(document.createTextNode(' Mostrar reglas técnicas (trigger)')); t.appendChild(l);
  }
  CFG.connect = connect;
  var api = { connect: connect };
  steps = [];
  $('#gPrev').onclick = function () { go(S.step - 1); };
  $('#gNext').onclick = function () { go(S.step + 1); };
  $('#gFill').onclick = function () { var s = steps[S.step]; if (s.fill) s.fill(api); if (s.id !== 'save') refresh(); };
  $('#h1').textContent = CFG.title; $('#crumb').textContent = CFG.crumb; $('#ctxLine').textContent = CFG.ctx;
  buildForm(); renderTabs(); renderToolbar(); steps = build(); applyVis(); selectTab(CFG.tabs[0][0]); renderGuide();
})();
</script>
