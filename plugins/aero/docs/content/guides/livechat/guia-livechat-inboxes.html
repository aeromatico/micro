<script>

{id:'_tg',t:'note',tab:'Telegram',w:'f',u:1,h:'Tras guardar, esta pestaña muestra el panel para conectar y comprobar Telegram (context: update).'}
];
var S={mode:'create',step:0,steps:[],tab:'General'};
function mk(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}

  if(f.t==='select'){c=mk('select');Object.keys(f.o).forEach(function(k){var o=mk('option',0,f.o[k]);o.value=k;c.appendChild(o)})}
  else if(f.t==='color'){c=mk('div','sws');c.setAttribute('data-kind','color');COLORS.forEach(function(k){var b=mk('button');b.type='button';b.style.background=k;b.setAttribute('data-c',k);b.setAttribute('aria-label','Color '+k);b.setAttribute('aria-pressed','false');b.onclick=function(){setColor(c,k);refresh()};c.appendChild(b)})}
  else if(f.t==='textarea'){c=mk('textarea')}else{c=mk('input');c.type='text';c.autocomplete='off'}
  d.appendChild(c);if(f.ro){c.readOnly=true;c.value=f.v||''}}
 c.id=f.id;if(f.h)d.appendChild(mk('div','help',f.h));var m=mk('div','errmsg');m.hidden=true;d.appendChild(m);pn.appendChild(d)});

 $$('#panels .panel').forEach(function(p){p.hidden=p.getAttribute('data-tab')!==S.tab});$$('#panels [data-f]').forEach(function(d){var f=F.filter(function(z){return z.id===d.getAttribute('data-f')})[0];if(f)d.hidden=!vis(f)})}
