    });
    CFG.steps.forEach(function (x) { if (!x.upd && !x.after) s.push(x); });
    if (CFG.canSave) s.push({ id: 'save', tab: CFG.tabs[0][0], fields: [], title: CFG.canCreate ? 'Guardar' : 'Guardar cambios', body: CFG.saveTip, tip: CFG.saveTip2 || '', ex: '', fill: function () { save(); }, done: function () { return false; } });
    return s;
  }
  function ids() { return steps.map(function (s) { return s.fields[0] || s.id; }); }
  function renderGuide() {
    var cur = steps[S.step];
    $('#gEyebrow').textContent = 'Paso ' + (S.step + 1) + ' de ' + steps.length + (cur.opt ? ' · opcional' : cur.req ? ' · obligatorio' : '');
    $('#gTitle').textContent = cur.title;
    var body = $('#gBody'); body.innerHTML = '';
    body.appendChild(el('p', null, cur.body));
    if (cur.ex) { var w = el('div'); w.appendChild(el('div', 'g-sub', 'Ejemplo')); w.appendChild(el('div', 'example', cur.ex)); body.appendChild(w); }
    if (cur.tip) { var n = el('div', 'note'); n.appendChild(el('b', null, 'Ojo. ')); n.appendChild(document.createTextNode(cur.tip)); body.appendChild(n); }
    var ok = steps.filter(function (s) { return s.done(); }).length;
    $('#gBar').style.width = Math.round(100 * ok / steps.length) + '%';
    $('#gPrev').disabled = S.step === 0; $('#gNext').disabled = S.step === steps.length - 1;
    $('#gFill').hidden = !cur.fill;
    $('#gFill').textContent = cur.id === 'save' ? 'Guardar con los datos actuales' : (cur.fillLabel || 'Rellenar ejemplo');
    var ol = $('#gSteps'); ol.innerHTML = '';
    steps.forEach(function (s, i) {
      var li = el('li'), bt = el('button'); bt.type = 'button';
      var d = s.done();
      if (i === S.step) bt.setAttribute('aria-current', 'step');
      if (d) bt.className = 'done';
      bt.appendChild(el('span', 'dot', d ? '✓' : String(i + 1))); bt.appendChild(el('span', null, s.title));
      bt.onclick = function () { go(i); }; li.appendChild(bt); ol.appendChild(li);
    });
    $$('.field,.upd').forEach(function (f) { f.classList.remove('is-guided'); });
    if (cur.tab) selectTab(cur.tab);
    cur.fields.forEach(function (f) { var e = $('[data-f="' + f + '"]'); if (e && !e.hidden) e.classList.add('is-guided'); });
  }
  function go(i, scroll) {
    S.step = Math.max(0, Math.min(steps.length - 1, i)); renderGuide();
    if (scroll !== false) { var f = steps[S.step].fields[0], e = f && $('[data-f="' + f + '"]'); if (e && !e.hidden) e.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  }
  function refresh() { var cur = steps[S.step].id; steps = build(); var i = steps.map(function (s) { return s.id; }).indexOf(cur); S.step = i >= 0 ? i : Math.min(S.step, steps.length - 1); applyVis(); renderToolbar(); renderGuide(); }
  function save() { flash(CFG.saveMsg); S.saved = true; }
  function renderToolbar() {
    var t = $('#toolbar'); t.innerHTML = '';
    var a = el('button', 'btn primary', 'Guardar'); a.type = 'button'; a.onclick = save; t.appendChild(a);
    var c = el('button', 'btn', 'Guardar y cerrar'); c.type = 'button'; c.onclick = function () { flash('Conversación guardada. En la app real vuelves a la lista de la Bandeja.'); }; t.appendChild(c);
    var r = el('button', 'btn', 'Reiniciar demo'); r.type = 'button'; r.onclick = function () { location.reload(); }; t.appendChild(r);
    t.appendChild(el('span', 'spacer'));
    var l = el('label', 'chk'), k = el('input'); k.type = 'checkbox'; k.onchange = function () { document.body.classList.toggle('show-tech', k.checked); }; k.checked = document.body.classList.contains('show-tech');
    l.appendChild(k); l.appendChild(document.createTextNode(' Mostrar reglas técnicas (trigger)')); t.appendChild(l);
  }
  $('#gPrev').onclick = function () { go(S.step - 1); };
  $('#gNext').onclick = function () { go(S.step + 1); };
  $('#gFill').onclick = function () { var s = steps[S.step]; if (s.fill) s.fill(api); if (s.id !== 'save') refresh(); };
  $('#h1').textContent = CFG.title; $('#crumb').textContent = CFG.crumb; $('#ctxLine').textContent = CFG.ctx;
  buildForm(); renderTabs(); steps = build(); applyVis(); renderToolbar(); selectTab(CFG.tabs[0][0]); renderGuide();
})();
</script>
</body></html>
