<script>
(function () {
  var CFG = {

    savedMsg: 'Publicación creada. En la app real vuelves a la lista de publicaciones.',
    fields: [
      { id: 'content', label: 'Contenido', type: 'textarea', big: true, span: 'full', ex: 'Nueva colección disponible desde hoy. Escríbenos para conocer los precios.', opt: true,
        step: { title: 'Contenido', body: 'El texto de la publicación. Se escribe en un editor Markdown.', tip: 'Casi todas las redes muestran mejor una publicación con imagen: súbela en el siguiente paso.' } },
      { id: 'media', type: 'html', html: '<label class="lbl">Imágenes</label><div class="box" id="mediaBox">Arrastra imágenes aquí o pulsa para subir (demo: no sube nada)</div><div class="help">Casi todas las redes muestran mejor una publicación con imagen. Puedes subir más de una.</div>',
        step: { title: 'Imágenes', body: 'Sube una o más imágenes para acompañar el texto.', tip: 'En esta demo la zona de carga es solo ilustrativa.' }, opt: true },
      { id: 'account_ids', label: 'Publicar en', type: 'checklist', span: 'full', req: true, opts: ['Instagram — @mitienda (ejemplo)', 'Facebook — Mi Tienda (ejemplo)', 'LinkedIn — Mi Empresa (ejemplo)'], ex: [0, 1], exText: '',
        help: 'Elige en cuáles de tus cuentas conectadas se publica. Se publica en todas las que marques, al mismo tiempo.',
        step: { title: 'Elige dónde publicar', body: 'Marca las cuentas conectadas en las que saldrá la publicación. Se publica en todas las que marques, al mismo tiempo.', tip: 'Debes marcar al menos una cuenta. La lista real muestra tus cuentas conectadas activas, no estas de ejemplo.' } },
      { id: 'scheduled_at', label: 'Programar para', type: 'datetime', help: 'Vacío = se publica de inmediato al confirmar.', ex: '2026-12-01T10:00', opt: true,
        step: { title: 'Programar la publicación', body: 'Elige fecha y hora para que salga más tarde. Si lo dejas vacío, se publica de inmediato al confirmar.', tip: 'Al guardar sin fecha, la publicación sale ya.' } },
      { id: 'status', label: 'Estado', type: 'text', ro: true, ph: 'Lo asigna el sistema',
        step: { title: 'Estado', body: 'Solo lectura: lo actualiza el sistema según el avance de la publicación.', tip: '' } },
      { type: 'section', label: 'Avanzado', comment: 'Solo si necesitas configurar algo especial para alguna red social en particular (formato JSON). Déjalo vacío si no sabes qué es esto.' },
      { id: 'platform_specific_data', label: 'Configuración avanzada (JSON)', type: 'json', span: 'full', ex: '{\n  "ejemplo": true\n}', exText: '', opt: true,
        step: { title: 'Configuración avanzada (JSON)', body: 'Campo para ajustes especiales de una red concreta, en formato JSON. Déjalo vacío si no sabes qué es.', tip: 'Si lo completas, debe ser un JSON válido: comillas dobles y sin coma final. Vacío se guarda como sin configuración.' } },
      { id: 'published_at', label: 'Publicada el', type: 'text', ro: true, ph: 'Lo asigna el sistema',
        step: { title: 'Publicada el', body: 'Solo lectura: fecha en que la publicación salió.', tip: '' } },
      { id: 'error_message', label: 'Error', type: 'textarea', ro: true, span: 'full',
        step: { title: 'Error', body: 'Solo lectura: si la publicación falla en alguna red, aquí aparece el motivo.', tip: 'Si ves un error, revisa la conexión de la cuenta y vuelve a intentar.' } }
    ]
  };

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var st = { step: 0, seen: {}, saved: false };
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function byId(id) { return CFG.fields.filter(function (f) { return f.id === id; })[0]; }
  function val(id) { var f = byId(id), n = $('#' + id); if (!n) return ''; if (f.type === 'checkbox') return n.checked; if (f.type === 'checklist') return $$('input:checked', n).length; if (f.type === 'html') return ''; return (n.value || '').trim(); }
  function vis(f) { if (!f.show) return true; var v = val(f.show.f); return f.show.eq === undefined ? !!v : v === f.show.eq; }
  function filled(f) { var v = val(f.id); return f.type === 'checkbox' ? true : !!v; }

  function setVal(id, v) {
    var f = byId(id), n = $('#' + id); if (!n) return;
    if (f.type === 'checkbox') n.checked = !!v;
    else if (f.type === 'checklist') { $$('input', n).forEach(function (c, i) { c.checked = v.indexOf(i) >= 0; }); }

    fire(n);
  }

  function build() {
    var form = $('#form'); form.innerHTML = '';
    CFG.fields.forEach(function (f) {
      if (f.type === 'section') { form.appendChild(el('h3', 'sec', f.label)); if (f.comment) form.appendChild(el('div', 'sec-c', f.comment)); return; }
      var box = el('div', 'field' + (f.span === 'full' || f.type === 'html' ? ' full' : '')); box.setAttribute('data-f', f.id);
      if (f.type === 'html') { box.innerHTML = f.html; form.appendChild(box); return; }
      var ctl;
      if (f.type !== 'checkbox') {
        var lb = el('label', 'lbl', f.label); lb.setAttribute('for', f.id);
        if (f.req) lb.appendChild(el('span', 'req', '*'));
        if (f.show) lb.appendChild(el('span', 'trig', 'show si ' + f.show.f + (f.show.eq !== undefined ? ' = ' + f.show.eq : ' marcado')));
        box.appendChild(lb);
      }
      if (f.type === 'select') { ctl = el('select'); (f.empty ? [['', f.empty]] : []).concat(f.opts).forEach(function (o) { var op = el('option', '', o[1]); op.value = o[0]; ctl.appendChild(op); }); if (f.def !== undefined) ctl.value = f.def; }
      else if (f.type === 'textarea' || f.type === 'json') { ctl = el('textarea', (f.big ? 'big ' : '') + (f.type === 'json' ? 'mono' : '')); if (f.def) ctl.value = f.def; }
      else if (f.type === 'checkbox') { ctl = el('input'); ctl.type = 'checkbox'; ctl.checked = !!f.def; var w = el('label', 'chk'); w.appendChild(ctl); w.appendChild(document.createTextNode(f.label)); box.appendChild(w); }
      else if (f.type === 'checklist') { ctl = el('div', 'cl'); f.opts.forEach(function (o) { var l = el('label'); var c = el('input'); c.type = 'checkbox'; l.appendChild(c); l.appendChild(document.createTextNode(o)); ctl.appendChild(l); }); }
      else { ctl = el('input'); ctl.type = f.type === 'number' ? 'number' : f.type === 'datetime' ? 'datetime-local' : 'text'; if (f.def !== undefined) ctl.value = f.def; if (f.ph) ctl.placeholder = f.ph; }
      ctl.id = f.id; if (f.ro) ctl.disabled = true;
      if (f.type !== 'checkbox') box.appendChild(ctl);
      if (f.help) box.appendChild(el('div', 'help', f.help));
      box.appendChild(Object.assign(el('div', 'errmsg'), { hidden: true }));
      form.appendChild(box);
    });
    $$('.field input, .field select, .field textarea').forEach(function (n) {
      n.addEventListener('input', function () { n.classList.remove('err'); var m = $('.errmsg', n.closest('.field')); if (m) m.hidden = true; refresh(); });
      n.addEventListener('change', refresh);
      n.addEventListener('focus', function () { var b = n.closest('.field'); if (!b) return; var i = ids().indexOf(b.getAttribute('data-f')); if (i >= 0 && i !== st.step) go(i, false); });
    });
    applyShow();
  }
  function applyShow() { CFG.fields.forEach(function (f) { var b = $('[data-f="' + f.id + '"]'); if (b) b.hidden = !vis(f); }); }

  function stepList() {
    var s = CFG.fields.filter(function (f) { return f.step && vis(f); }).map(function (f) {
      return { id: f.id, f: f, title: f.step.title, body: f.step.body, tip: f.step.tip, ex: typeof f.ex === 'string' && f.exText !== '' ? f.ex : '',
        kind: f.ro ? 'ro' : f.req ? 'req' : (f.opt ? 'opt' : ''),
        done: function () { return (f.ro || f.opt) ? !!st.seen[f.id] : (f.req ? filled(f) : (!!st.seen[f.id] || filled(f))); },
        fill: (f.ro || f.type === 'html') ? null : function () { setVal(f.id, f.ex); } };
    });
    if (CFG.canSave) s.push({ id: '_save', title: 'Guardar', kind: '', body: 'Pulsa «' + (st.saved ? CFG.updLabel : CFG.saveLabel) + '». La demo valida los campos obligatorios y te muestra el resultado.', tip: 'Los datos son de ejemplo y esta demo no guarda nada.', ex: '', done: function () { return st.saved; }, fill: function () { save(false); } });
    return s;
  }
  function ids() { return stepList().map(function (s) { return s.id; }); }
  function go(i, scroll) {
    var steps = stepList(); st.step = Math.max(0, Math.min(steps.length - 1, i));
    st.seen[steps[st.step].id] = true; render();
    if (scroll !== false) { var n = $('[data-f="' + steps[st.step].id + '"]'); if (n && !n.hidden) n.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  }

    var cur = stepList()[st.step]; var curId = cur && cur.id; applyShow();
    var idx = ids().indexOf(curId); st.step = idx >= 0 ? idx : Math.min(st.step, ids().length - 1); render();
  }
  function render() {
    var steps = stepList(), cur = steps[st.step];
    $('#gEyebrow').textContent = 'Paso ' + (st.step + 1) + ' de ' + steps.length + (cur.kind === 'ro' ? ' · solo lectura' : cur.kind === 'req' ? ' · obligatorio' : cur.kind === 'opt' ? ' · opcional' : '');
    $('#gTitle').textContent = cur.title;
    var body = $('#gBody'); body.innerHTML = '';
    body.appendChild(el('p', '', cur.body));
    if (cur.ex) { var w = el('div'); w.appendChild(el('div', 'g-sub', 'Ejemplo')); w.appendChild(el('div', 'example', cur.ex)); body.appendChild(w); }
    if (cur.tip) { var n = el('div', 'note'); n.appendChild(el('b', '', 'Ojo. ')); n.appendChild(document.createTextNode(cur.tip)); body.appendChild(n); }
    $('#gBar').style.width = Math.round(100 * steps.filter(function (s) { return s.done(); }).length / steps.length) + '%';
    $('#gPrev').disabled = st.step === 0; $('#gNext').disabled = st.step === steps.length - 1;
    $('#gFill').hidden = !cur.fill; $('#gFill').textContent = cur.id === '_save' ? 'Usar los datos actuales' : 'Rellenar ejemplo';
    var ol = $('#gSteps'); ol.innerHTML = '';
    steps.forEach(function (s, i) {
      var li = el('li'), bt = el('button'); bt.type = 'button'; if (i === st.step) bt.setAttribute('aria-current', 'step');
      var d = s.done(); if (d) bt.className = 'done';
      bt.appendChild(el('span', 'dot', d ? '✓' : String(i + 1))); bt.appendChild(el('span', '', s.title));
      bt.onclick = function () { go(i); }; li.appendChild(bt); ol.appendChild(li);
    });
    $$('.field').forEach(function (f) { f.classList.remove('is-guided'); });
    var g = $('[data-f="' + cur.id + '"]'); if (g && !g.hidden) g.classList.add('is-guided');
  }

  function showErr(id, msg) {
    var b = $('[data-f="' + id + '"]'); if (!b) return; var m = $('.errmsg', b), i = $('input,select,textarea', b);
    if (m) { m.hidden = !msg; m.textContent = msg || ''; } if (i) i.classList.toggle('err', !!msg);
  }
  function validate() {
    var errs = [];
    CFG.fields.forEach(function (f) {
      if (!f.id || f.ro || f.type === 'html' || f.type === 'section') return; showErr(f.id, '');
      if (!vis(f)) return;
      var v = val(f.id);
      if (f.req && !v) errs.push([f.id, f.type === 'checklist' ? 'Marca al menos una cuenta en «' + f.label + '».' : 'El campo ' + f.label + ' es obligatorio.']);
      else if (f.max && typeof v === 'string' && v.length > f.max) errs.push([f.id, f.label + ' no puede superar ' + f.max + ' caracteres.']);
      else if (f.type === 'json' && v) { try { JSON.parse(v); } catch (e) { errs.push([f.id, 'JSON inválido. Revisa comillas dobles y comas.']); } }
    });
    return errs;
  }
  var ft;
  function flash(msg, isErr) { var f = $('#flash'); f.textContent = msg; f.className = isErr ? 'err' : ''; f.hidden = false; clearTimeout(ft); ft = setTimeout(function () { f.hidden = true; }, 4200); }
  function save(close) {
    var errs = validate();
    if (errs.length) { errs.forEach(function (e) { showErr(e[0], e[1]); }); var i = ids().indexOf(errs[0][0]); if (i >= 0) go(i); flash('No se pudo guardar: ' + errs[0][1], true); return; }
    st.saved = true; head(); toolbar();
    flash(close ? CFG.savedMsg : 'Guardado. Ahora estás en la pantalla de edición.'); refresh();
  }
  function head() { $('#h1').textContent = st.saved ? CFG.updTitle : CFG.title; $('#crumb').textContent = (st.saved ? CFG.updCrumb : CFG.crumb) + ' · Guía de capacitación'; }
  function toolbar() {
    var t = $('#toolbar'); t.innerHTML = '';
    var a = el('button', 'btn primary', st.saved ? CFG.updLabel : CFG.saveLabel); a.type = 'button'; a.onclick = function () { save(false); }; t.appendChild(a);
    var b = el('button', 'btn', st.saved ? CFG.updCloseLabel : CFG.saveCloseLabel); b.type = 'button'; b.onclick = function () { save(true); }; t.appendChild(b);
    var r = el('button', 'btn', 'Reiniciar demo'); r.type = 'button'; r.onclick = function () { location.reload(); }; t.appendChild(r);
    t.appendChild(el('span', 'spacer'));
    var l = el('label', 'tchk'); var c = el('input'); c.type = 'checkbox'; c.onchange = function () { document.body.classList.toggle('show-tech', c.checked); };
    l.appendChild(c); l.appendChild(document.createTextNode(' Mostrar reglas técnicas (trigger)')); t.appendChild(l);
  }

  $('#gPrev').onclick = function () { go(st.step - 1); };
  $('#gNext').onclick = function () { go(st.step + 1); };
  $('#gFill').onclick = function () { var s = stepList()[st.step]; if (s.fill) s.fill(); refresh(); };
  $('#ctxLine').textContent = CFG.ctx;
  build(); head(); toolbar(); go(0, false);
})();
</script>
</body></html>
