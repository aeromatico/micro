<style>
:root { --bg:#eceff2; --surface:#fff; --surface-2:#f5f7f9; --ink:#1d2933; --ink-2:#55636f; --line:#d5dce2; --accent:#1f6f8b; --accent-ink:#fff; --accent-soft:#dcecf2; --hint:#b4620a; --hint-soft:#fdf0dc; --ok:#1e7a4c; --ok-soft:#dff2e8; --err:#b3261e; --err-soft:#fbe4e2;

  --g-surface:#143443; --g-surface-2:#1c4658; --g-line:#2d5a70; --g-ink:#e8f3f8; --g-ink-2:#a3c2d1; --g-accent:#7cc4de; --g-accent-ink:#08222d; --g-accent-soft:#25566f; } }
:root[data-theme="dark"] { --bg:#12181d; --surface:#1a232a; --surface-2:#212c34; --ink:#e6ecf0; --ink-2:#93a3af; --line:#2f3d47; --accent:#5fb4d0; --accent-ink:#0c1a21; --accent-soft:#1b3541; --hint:#f0a94e; --hint-soft:#3a2a12; --ok:#62c592; --ok-soft:#17342a; --err:#f28b82; --err-soft:#3b1d1b; color-scheme:dark;
  --g-surface:#143443; --g-surface-2:#1c4658; --g-line:#2d5a70; --g-ink:#e8f3f8; --g-ink-2:#a3c2d1; --g-accent:#7cc4de; --g-accent-ink:#08222d; --g-accent-soft:#25566f; }

.wrap { max-width:1760px; margin-inline:auto; display:grid; gap:20px; grid-template-columns:minmax(0,1fr); grid-template-areas:"head" "guide" "form"; }

.g-title { font-size:16px; font-weight:600; margin:14px 0 0; text-wrap:balance; }
.progress { height:4px; background:var(--surface-2); border-radius:2px; margin-top:10px; overflow:hidden; }
.progress > i { display:block; height:100%; background:var(--accent); width:0; transition:width .25s; }

.note b { color:var(--hint); }

.g-actions { display:flex; gap:8px; flex-wrap:wrap; padding:0 16px 14px; }
button { font:inherit; cursor:pointer; }
.btn { border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:6px 12px; border-radius:4px; }
.btn:hover { background:var(--surface-2); }
.btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:500; }
.btn.ghost { border-color:transparent; color:var(--accent); background:transparent; padding-inline:6px; }
.btn:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, .steps button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.steps { list-style:none; margin:0; padding:8px; border-top:1px solid var(--line); display:grid; gap:2px; }
.steps button { width:100%; text-align:left; display:grid; grid-template-columns:22px minmax(0,1fr); gap:8px; align-items:center; background:transparent; border:0; border-radius:4px; padding:6px 8px; color:var(--ink-2); }
.steps button:hover { background:var(--surface-2); }
.steps button[aria-current="step"] { background:var(--accent-soft); color:var(--ink); font-weight:500; }
.dot { width:18px; height:18px; border-radius:50%; border:1.5px solid var(--line); display:grid; place-items:center; font-size:10px; font-weight:600; }
.steps .done .dot { background:var(--ok); border-color:var(--ok); color:var(--surface); }
.formcol { grid-area:form; min-width:0; display:grid; gap:12px; }
.card { background:var(--surface); border:1px solid var(--line); border-radius:6px; min-width:0; }
.panel { padding:16px; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 20px; align-items:start; }
@media (max-width:640px) { .panel { grid-template-columns:minmax(0,1fr); } }
.field { min-width:0; padding:6px; margin:-6px; border-radius:6px; transition:box-shadow .15s,background .15s; }
.field.full { grid-column:1 / -1; }
.field.is-guided { box-shadow:0 0 0 2px var(--hint); background:var(--hint-soft); }
.field[hidden] { display:none !important; }
label.lbl { display:block; font-weight:600; font-size:13px; margin-bottom:4px; }
.req { color:var(--err); margin-left:2px; }
input[type=text], input[type=number], select, textarea { width:100%; font:inherit; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:4px; padding:7px 9px; }
input:disabled, select:disabled, textarea:disabled { background:var(--surface-2); color:var(--ink-2); }
input.err, select.err { border-color:var(--err); }
.help { font-size:12px; color:var(--ink-2); margin-top:4px; overflow-wrap:anywhere; }
.errmsg { font-size:12px; color:var(--err); margin-top:4px; }
.trig { font-family:var(--font-mono); font-size:11px; color:var(--accent); background:var(--accent-soft); border-radius:3px; padding:1px 6px; margin-left:6px; font-weight:400; }
body:not(.show-tech) .trig { display:none; }
.toolbar { display:flex; gap:8px; flex-wrap:wrap; padding:12px 16px; border-top:1px solid var(--line); background:var(--surface-2); border-radius:0 0 6px 6px; align-items:center; }
.toolbar .spacer { flex:1; }
.tchk { display:inline-flex; gap:6px; align-items:center; color:var(--ink-2); font-size:12px; }
.ctx { font-family:var(--font-mono); font-size:11px; color:var(--ink-2); padding:8px 16px 0; }
.thread { border:1px solid var(--line); border-radius:6px; padding:12px; background:var(--surface-2); max-height:340px; overflow:auto; }
.bubble { max-width:80%; padding:8px 10px; border-radius:8px; margin-bottom:8px; background:var(--surface); border:1px solid var(--line); }
.bubble.out { margin-left:auto; background:var(--accent-soft); }
.bubble small { display:block; color:var(--ink-2); font-size:11px; }
.reply { display:flex; gap:8px; margin-top:10px; }
.reply input { flex:1; }
.sample { font-size:11px; color:var(--ink-2); font-style:italic; margin-top:6px; }
#flash { position:fixed; left:50%; transform:translateX(-50%); bottom:16px; max-width:calc(100vw - 32px); padding:10px 16px; border-radius:4px; background:var(--ink); color:var(--bg); box-shadow:0 6px 24px rgba(0,0,0,.25); z-index:10; }
#flash.err { background:var(--err); color:#fff; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head><body>
<div class="wrap">
  <header>
    <div><h1 id="h1"></h1><div class="crumb" id="crumb"></div></div>
    <span class="badge">Demo: no guarda nada real</span>
  </header>
  <aside class="guide" aria-label="Guía paso a paso">
    <div class="g-head">
      <div class="g-eyebrow" id="gEyebrow"></div>
      <div class="g-nav">
        <button class="btn" id="gPrev" type="button">← Anterior</button>
        <button class="btn primary" id="gNext" type="button">Siguiente →</button>
      </div>
      <h2 class="g-title" id="gTitle"></h2>
      <div class="progress"><i id="gBar"></i></div>
    </div>
    <div class="g-body" id="gBody"></div>
    <div class="g-actions"><button class="btn ghost" id="gFill" type="button">Rellenar ejemplo</button></div>
    <ol class="steps" id="gSteps"></ol>
  </aside>
  <main class="formcol">
    <div class="card">
      <div class="ctx" id="ctxLine"></div>
      <div class="panel" id="form"></div>
      <div class="toolbar" id="toolbar"></div>
    </div>
  </main>
</div>
<div id="flash" hidden role="status"></div>

<script>
(function () {
  var CFG = {
    title: 'Conversación', updTitle: 'Conversación', crumb: '/backend/aero/hello/conversations/update/12', updCrumb: '/backend/aero/hello/conversations/update/12',
    ctx: 'context: update · las conversaciones llegan solas, no se crean a mano', canSave: true, saveLabel: 'Guardar', saveCloseLabel: 'Guardar y cerrar', updLabel: 'Guardar', updCloseLabel: 'Guardar y cerrar',
    savedMsg: 'Conversación guardada. En la app real vuelves a la bandeja.',
    fields: [
      { id: 'contact', label: 'Contacto', type: 'text', ro: true, def: 'María Quispe (ejemplo)',
        step: { title: 'Contacto', body: 'Solo lectura: quién te escribe. Viene del contacto asociado a la conversación.', tip: 'Para cambiar sus datos, edítalo en Contactos.' } },
      { id: 'account', label: 'Cuenta', type: 'text', ro: true, def: 'WhatsApp Tienda (ejemplo)',
        step: { title: 'Cuenta', body: 'Solo lectura: la cuenta o número por el que entró la conversación. Tu respuesta sale por esta misma cuenta.', tip: '' } },
      { id: 'status', label: 'Estado', type: 'select', opts: [['open', 'Abierta'], ['closed', 'Cerrada']], def: 'open', ex: 'closed',
        step: { title: 'Abrir o cerrar', body: 'Marca la conversación como Abierta (en curso) o Cerrada (atendida).', tip: 'Cerrar no borra nada: puedes reabrirla cuando haga falta.' } },
      { id: 'unread_count', label: 'No leídos', type: 'number', ro: true, def: 3,
        step: { title: 'No leídos', body: 'Solo lectura: cuántos mensajes del contacto aún no se han leído. Se pone en cero al responder.', tip: '' } },
      { id: 'messages', type: 'html', html: '<label class="lbl">Mensajes</label><div class="thread" id="thread"></div><div class="reply"><input type="text" id="replyTxt" placeholder="Escribe tu respuesta…" aria-label="Respuesta"><button type="button" class="btn primary" id="replyBtn">Enviar</button></div><div class="sample">Mensajes de ejemplo para la capacitación; la demo no envía nada.</div>',
        step: { title: 'Mensajes y respuesta', body: 'Aquí está el historial de la conversación. Escribe el texto y envía: la respuesta sale por la misma cuenta.', tip: 'En cuentas con ventana de 24 h (Cloud API), si el contacto no escribió en las últimas 24 h solo se permite una plantilla aprobada. Usa Redactar con plantilla.' } }
    ],
    init: function () {
      var msgs = [['in', 'Hola, ¿tienen disponible el modelo azul?', '10:02'], ['out', 'Hola María, sí. ¿Te lo reservo?', '10:05'], ['in', 'Sí, por favor. ¿Cuánto sale?', '10:06']];
      msgs.forEach(function (m) { addMsg(m[0], m[1], m[2]); });
      $('#replyBtn').onclick = function () {
        var t = $('#replyTxt').value.trim(); if (!t) { flash('Escribe el mensaje antes de enviar.', true); return; }
        addMsg('out', t, 'ahora'); $('#replyTxt').value = ''; setVal('unread_count', 0); flash('Respuesta enviada (simulada).');
      };
    }
  };
  function addMsg(dir, text, time) {
    var b = el('div', 'bubble' + (dir === 'out' ? ' out' : '')); b.appendChild(document.createTextNode(text)); b.appendChild(el('small', '', (dir === 'out' ? 'Tú' : 'María') + ' · ' + time));
    $('#thread').appendChild(b); $('#thread').scrollTop = 9999;
  }

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var st = { step: 0, seen: {}, saved: false };
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function byId(id) { return CFG.fields.filter(function (f) { return f.id === id; })[0]; }
  function val(id) { var f = byId(id), n = $('#' + id); if (!n) return ''; if (f.type === 'html') return ''; return (n.value || '').trim(); }
  function vis(f) { if (!f.show) return true; var v = val(f.show.f); return f.show.eq === undefined ? !!v : v === f.show.eq; }
  function fire(n) { n.dispatchEvent(new Event('input', { bubbles: true })); n.dispatchEvent(new Event('change', { bubbles: true })); }
  function setVal(id, v) { var n = $('#' + id); if (!n) return; n.value = v; fire(n); }

  function build() {
    var form = $('#form'); form.innerHTML = '';
    CFG.fields.forEach(function (f) {
      var box = el('div', 'field' + (f.span === 'full' || f.type === 'html' ? ' full' : '')); box.setAttribute('data-f', f.id);
      if (f.type === 'html') { box.innerHTML = f.html; form.appendChild(box); return; }
      var lb = el('label', 'lbl', f.label); lb.setAttribute('for', f.id); box.appendChild(lb);
      var ctl;
      if (f.type === 'select') { ctl = el('select'); f.opts.forEach(function (o) { var op = el('option', '', o[1]); op.value = o[0]; ctl.appendChild(op); }); if (f.def !== undefined) ctl.value = f.def; }
      else { ctl = el('input'); ctl.type = f.type === 'number' ? 'number' : 'text'; if (f.def !== undefined) ctl.value = f.def; }
      ctl.id = f.id; if (f.ro) ctl.disabled = true; box.appendChild(ctl); form.appendChild(box);
    });
    if (CFG.init) CFG.init();
    $$('.field input, .field select').forEach(function (n) {
      n.addEventListener('change', refresh);
      n.addEventListener('focus', function () { var b = n.closest('.field'); if (!b) return; var i = ids().indexOf(b.getAttribute('data-f')); if (i >= 0 && i !== st.step) go(i, false); });
    });
  }

  function stepList() {
    var s = CFG.fields.filter(function (f) { return f.step && vis(f); }).map(function (f) {
      return { id: f.id, title: f.step.title, body: f.step.body, tip: f.step.tip, ex: '', kind: f.ro ? 'ro' : '',
        done: function () { return !!st.seen[f.id]; }, fill: (f.ro || f.type === 'html') ? null : function () { setVal(f.id, f.ex); } };
    });
    s.push({ id: '_save', title: 'Guardar', kind: '', body: 'Pulsa «Guardar» para conservar el estado de la conversación.', tip: 'Los datos son de ejemplo y esta demo no guarda nada.', ex: '', done: function () { return st.saved; }, fill: function () { save(false); } });
    return s;
  }
  function ids() { return stepList().map(function (s) { return s.id; }); }
  function go(i, scroll) {
    var steps = stepList(); st.step = Math.max(0, Math.min(steps.length - 1, i));
    st.seen[steps[st.step].id] = true; render();
    if (scroll !== false) { var n = $('[data-f="' + steps[st.step].id + '"]'); if (n && !n.hidden) n.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  }
  function refresh() { render(); }
  function render() {
    var steps = stepList(), cur = steps[st.step];
    $('#gEyebrow').textContent = 'Paso ' + (st.step + 1) + ' de ' + steps.length + (cur.kind === 'ro' ? ' · solo lectura' : '');
    $('#gTitle').textContent = cur.title;
    var body = $('#gBody'); body.innerHTML = '';
    body.appendChild(el('p', '', cur.body));
    if (cur.tip) { var n = el('div', 'note'); n.appendChild(el('b', '', 'Ojo. ')); n.appendChild(document.createTextNode(cur.tip)); body.appendChild(n); }
    $('#gBar').style.width = Math.round(100 * steps.filter(function (s) { return s.done(); }).length / steps.length) + '%';
    $('#gPrev').disabled = st.step === 0; $('#gNext').disabled = st.step === steps.length - 1;
    $('#gFill').hidden = !cur.fill; $('#gFill').textContent = cur.id === '_save' ? 'Usar los datos actuales' : 'Rellenar ejemplo';
    var ol = $('#gSteps'); ol.innerHTML = '';
    steps.forEach(function (s, i) {
      var li = el('li'), bt = el('button'); bt.type = 'button'; if (i === st.step) bt.setAttribute('aria-current', 'step');
      var d = s.done(); if (d) bt.className = 'done';
      bt.appendChild(el('span', 'dot', d ? '✓' : String(i + 1))); bt.appendChild(el('span', '', s.title));
      bt.onclick = function () { go(i); }; li.appendChild(bt); ol.appendChild(li);
    });
    $$('.field').forEach(function (f) { f.classList.remove('is-guided'); });
    var g = $('[data-f="' + cur.id + '"]'); if (g && !g.hidden) g.classList.add('is-guided');
  }
  var ft;
  function flash(msg, isErr) { var f = $('#flash'); f.textContent = msg; f.className = isErr ? 'err' : ''; f.hidden = false; clearTimeout(ft); ft = setTimeout(function () { f.hidden = true; }, 4200); }
  function save(close) { st.saved = true; flash(close ? CFG.savedMsg : 'Conversación guardada.'); refresh(); }
  function toolbar() {
    var t = $('#toolbar'); t.innerHTML = '';
    var a = el('button', 'btn primary', 'Guardar'); a.type = 'button'; a.onclick = function () { save(false); }; t.appendChild(a);
    var b = el('button', 'btn', 'Guardar y cerrar'); b.type = 'button'; b.onclick = function () { save(true); }; t.appendChild(b);
    var r = el('button', 'btn', 'Reiniciar demo'); r.type = 'button'; r.onclick = function () { location.reload(); }; t.appendChild(r);
  }

  $('#gPrev').onclick = function () { go(st.step - 1); };
  $('#gNext').onclick = function () { go(st.step + 1); };
  $('#gFill').onclick = function () { var s = stepList()[st.step]; if (s.fill) s.fill(); refresh(); };
  $('#ctxLine').textContent = CFG.ctx; $('#h1').textContent = CFG.title; $('#crumb').textContent = CFG.crumb + ' · Guía de capacitación';
  build(); toolbar(); go(0, false);
})();
</script>
</body></html>
