 if(f.label){var l=mk('label','lbl',f.label);l.htmlFor=f.id;if(f.req){l.appendChild(mk('span','req','*'))}if(f.show&&f.show.length<3&&f.id!=='account_id'){l.appendChild(trig(f))}d.appendChild(l)}

function steps(){var s=[];F.forEach(function(f){if(!f.step||!vis(f))return;s.push({id:f.id,f:f,title:f.step,body:f.body,tip:f.tip,ex:f.ex,req:f.req,opt:!f.req&&f.id!=='reply_mode',done:function(){return f.req?!!val(f.id):(f.id==='reply_mode'||!!val(f.id)||f.id==='ai_include_rules')},fill:function(){setv(f)}})});
 s.push({id:'save',title:'Guardar',body:'Pulsa Crear. La demo valida los campos obligatorios y te lleva a la pantalla de edición, donde aparece la lista de reglas.',tip:'En modo Desactivar el bot queda inactivo y no responde. Un bot activo solo puede atender cuentas de tu propio negocio.',done:function(){return S.mode==='update'},fill:function(){save(false)}});return s}
function setv(f){if(f.type==='balloon'){var r=$('#'+f.id+'_'+f.exv);if(r){r.checked=true;onCh({target:r})}return}if(f.type==='switch'){$('#'+f.id).checked=!!f.exv;refresh();return}
 if(f.type==='checks'){$$('#'+f.id+' input').forEach(function(i){i.checked=f.exv.indexOf(i.value)>=0});refresh();return}
 var e=$('#'+f.id);if(f.type==='select'){e.value=f.exv;e.dispatchEvent(new Event('change',{bubbles:true}));return}e.value=f.ex;e.dispatchEvent(new Event('input',{bubbles:true}))}
function idxOf(id){for(var i=0;i<S.steps.length;i++)if(S.steps[i].id===id)return i;return-1}
function refresh(){var cur=S.steps[S.step]&&S.steps[S.step].id;applyTriggers();S.steps=steps();var i=idxOf(cur);S.step=i>=0?i:Math.min(S.step,S.steps.length-1);render()}
function render(){var c=S.steps[S.step],n=S.steps.length;$('#gEyebrow').textContent='Paso '+(S.step+1)+' de '+n+(c.opt?' · opcional':c.req?' · obligatorio':'');$('#gTitle').textContent=c.title;
 var b=$('#gBody');b.innerHTML='';b.appendChild(mk('p',0,c.body));if(c.ex){var w=mk('div');w.appendChild(mk('div','g-sub','Ejemplo'));w.appendChild(mk('div','example',c.ex));b.appendChild(w)}
 if(c.tip){var t=mk('div','note');t.appendChild(mk('b',0,'Ojo. '));t.appendChild(document.createTextNode(c.tip));b.appendChild(t)}
 $('#gBar').style.width=Math.round(100*S.steps.filter(function(s){return s.done()}).length/n)+'%';$('#gPrev').disabled=S.step===0;$('#gNext').disabled=S.step===n-1;
 var fb=$('#gFill');fb.hidden=!c.fill||(c.id==='save'&&S.mode==='update');fb.textContent=c.id==='save'?'Crear con los datos actuales':'Rellenar ejemplo';
 var ol=$('#gSteps');ol.innerHTML='';S.steps.forEach(function(s,i){var li=mk('li'),bt=mk('button');bt.type='button';if(i===S.step)bt.setAttribute('aria-current','step');var dn=s.done();if(dn)bt.className='done';bt.appendChild(mk('span','dot',dn?'✓':String(i+1)));bt.appendChild(mk('span',0,s.title));bt.onclick=function(){go(i)};li.appendChild(bt);ol.appendChild(li)});
 $$('.field').forEach(function(f){f.classList.remove('is-guided')});if(c.f){var el=$('[data-f="'+c.f.id+'"]');if(el&&!el.hidden)el.classList.add('is-guided')}}
function go(i,sc){S.step=Math.max(0,Math.min(S.steps.length-1,i));render();var c=S.steps[S.step];if(sc!==false&&c.f){var el=$('[data-f="'+c.f.id+'"]');if(el)el.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}}
function err(id,m){var d=$('[data-f="'+id+'"]');if(!d)return;var e=$('.errmsg',d);e.hidden=false;e.textContent=m;var c=$('input,select,textarea',d);if(c)c.classList.add('err')}
function save(close){$$('.errmsg').forEach(function(e){e.hidden=true});$$('.err').forEach(function(e){e.classList.remove('err')});var errs=[],m=mode();
 if(m!=='disabled'&&!val('account_id'))errs.push(['account_id','El campo Cuenta es obligatorio.']);
 if(val('name').length>255)errs.push(['name','Nombre del bot no puede superar 255 caracteres.']);
 var h=val('handoff_minutes');if(m!=='disabled'&&h!==''&&(!/^\d+$/.test(h)||+h>1440))errs.push(['handoff_minutes','Debe ser un entero entre 0 y 1440.']);
 if(m!=='disabled'&&val('account_id')&&val('account_id')==='a2'&&S.dup)errs.push(['account_id','Esa cuenta ya tiene un bot.']);
 if(errs.length){errs.forEach(function(e){err(e[0],e[1])});var i=idxOf(errs[0][0]);if(i>=0)go(i);flash('No se pudo crear: '+errs[0][1],true);return}
 if(m==='disabled'&&!val('account_id'))$('#account_id').value='a1';
 S.mode='update';$('#h1').textContent='Editar bot';$('#crumb').textContent='/backend/aero/chatbots/bots/update/3 · Guía de capacitación';$('#btnSave').textContent='Guardar';$('#btnSaveClose').textContent='Guardar y cerrar';
 flash(close?'Bot creado. En la app real vuelves a la lista de bots.':'Bot creado. Ahora estás en la pantalla de edición; aquí se gestionan las reglas.');refresh()}
var ft;function flash(msg,e){var f=$('#flash');f.textContent=msg;f.className=e?'err':'';f.hidden=false;clearTimeout(ft);ft=setTimeout(function(){f.hidden=true},4200)}
$('#gPrev').onclick=function(){go(S.step-1)};$('#gNext').onclick=function(){go(S.step+1)};$('#gFill').onclick=function(){var s=S.steps[S.step];if(s.fill)s.fill();if(s.id!=='save')refresh()};
$('#btnSave').onclick=function(){save(false)};$('#btnSaveClose').onclick=function(){save(true)};$('#btnReset').onclick=function(){location.reload()};
$('#chkTech').onchange=function(e){document.body.classList.toggle('show-tech',e.target.checked)};
build();applyTriggers();S.steps=steps();render();
})();
