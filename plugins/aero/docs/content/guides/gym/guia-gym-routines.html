    if (cur.tip) { var n = mk("div", "note"); n.appendChild(mk("b", null, "Ojo. ")); n.appendChild(document.createTextNode(cur.tip)); body.appendChild(n); }
    var ok = steps.filter(function (s) { return s.done(); }).length;
    $("#gBar").style.width = Math.round(100 * ok / steps.length) + "%";
    $("#gPrev").disabled = st.step === 0; $("#gNext").disabled = st.step === steps.length - 1;
    var gf = $("#gFill"); gf.hidden = !cur.fill || (cur.last && st.mode === "update");
    gf.textContent = cur.last ? "Crear con los datos actuales" : "Rellenar ejemplo";
    var ol = $("#gSteps"); ol.innerHTML = "";
    steps.forEach(function (s, i) {
      var li = mk("li"), b = mk("button"); b.type = "button";
      if (i === st.step) b.setAttribute("aria-current", "step");
      var d = s.done(); if (d) b.className = "done";
      b.appendChild(mk("span", "dot", d ? "✓" : String(i + 1))); b.appendChild(mk("span", null, s.title));
      b.onclick = function () { go(i); }; li.appendChild(b); ol.appendChild(li);
    });
    $$(".field").forEach(function (f) { f.classList.remove("is-guided"); });
    cur.fields.forEach(function (id) { var b = box(id); if (b && !b.hidden) b.classList.add("is-guided"); });
  }
  function go(i) {
    st.step = Math.max(0, Math.min(steps.length - 1, i)); render();
    var f = steps[st.step].fields[0], el = f && box(f);
    if (el && !el.hidden) el.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
  function refresh() {
    var id = steps[st.step] && steps[st.step].id;
    steps = buildSteps();
    var i = steps.map(function (s) { return s.id; }).indexOf(id);
    st.step = i >= 0 ? i : 0; render();
  }
  function showErr(id, msg) {
    var b = box(id); if (!b) return;
    var m = $(".errmsg", b), i = $("input,select,textarea", b);
    if (m) { m.hidden = !msg; m.textContent = msg || ""; }
    if (i) i.classList.toggle("err", !!msg);
  }
  function validate() {
    var errs = [];
    F.forEach(function (f) {
      showErr(f.id, "");
      if (f.ctx === "update" && st.mode !== "update") return;
      if ((f.req || f.mreq) && !filled(f.id)) errs.push([f.id, "El campo " + f.label + " es obligatorio."]);
    });
    (CFG.check ? CFG.check(val) : []).forEach(function (e) { if (!errs.some(function (x) { return x[0] === e[0]; })) errs.push(e); });
    return errs;
  }
  function save(close) {
    if (CFG.derive) CFG.derive(val, set);
    var errs = validate();
    if (errs.length) {
      errs.forEach(function (e) { showErr(e[0], e[1]); });
      var i = steps.map(function (s) { return s.id; }).indexOf(errs[0][0]);
      if (i >= 0) go(i);
      flash("No se pudo crear: " + errs[0][1], true); return;
    }
    st.mode = "update";
    $("#h1").textContent = CFG.editTitle; $("#crumb").textContent = CFG.editCrumb;
    $("#btnSave").textContent = "Guardar"; $("#btnSaveClose").textContent = "Guardar y cerrar";
    F.forEach(function (f) { if (f.ctx === "update") { var b = box(f.id); if (b) b.hidden = false; if (f.roValue) $("#" + f.id).value = f.roValue; } });
    $("#ctxLine").textContent = "context: update";
    flash(close ? CFG.created + " En la app real vuelves a la lista." : CFG.created + " Ahora estás en la pantalla de edición.");
    refresh();
  }
  function flash(msg, isErr) {
    var f = $("#flash"); f.textContent = msg; f.className = isErr ? "err" : ""; f.hidden = false;
    clearTimeout(ft); ft = setTimeout(function () { f.hidden = true; }, 4200);
  }
  $("#gPrev").onclick = function () { go(st.step - 1); };
  $("#gNext").onclick = function () { go(st.step + 1); };
  $("#gFill").onclick = function () { var s = steps[st.step]; if (s.fill) s.fill(); };
  $("#btnSave").onclick = function () { save(false); };
  $("#btnSaveClose").onclick = function () { save(true); };
  $("#btnReset").onclick = function () { location.reload(); };
  $("#chkTech").onchange = function (e) { document.body.classList.toggle("show-tech", e.target.checked); };
  build(); steps = buildSteps(); $("#ctxLine").textContent = CFG.ctxNote; render();
})();
</script>
</body></html>
