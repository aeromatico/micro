<!doctype html>
<!--guide {"title":"Código QR","article":"pay-detalle-qr","sort":30} -->
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guía: Código QR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#eceff2;--surface:#fff;--surface-2:#f5f7f9;--ink:#1d2933;--ink-2:#55636f;--line:#d5dce2;--accent:#1f6f8b;--accent-ink:#fff;--accent-soft:#dcecf2;--hint:#b4620a;--hint-soft:#fdf0dc;--ok:#1e7a4c;--ok-soft:#dff2e8;--err:#b3261e;--err-soft:#fbe4e2;--font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
--g-surface:#dcecf2;--g-surface-2:#cbe1ea;--g-line:#a9c9d6;--g-ink:#10303c;--g-ink-2:#3a5c6b;--g-accent:#1a6480;--g-accent-ink:#fff;--g-accent-soft:#f4fafc}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181d;--surface:#1a232a;--surface-2:#212c34;--ink:#e6ecf0;--ink-2:#93a3af;--line:#2f3d47;--accent:#5fb4d0;--accent-ink:#0c1a21;--accent-soft:#1b3541;--hint:#f0a94e;--hint-soft:#3a2a12;--ok:#62c592;--ok-soft:#17342a;--err:#f28b82;--err-soft:#3b1d1b;--g-surface:#143443;--g-surface-2:#1c4658;--g-line:#2d5a70;--g-ink:#e8f3f8;--g-ink-2:#a3c2d1;--g-accent:#7cc4de;--g-accent-ink:#08222d;--g-accent-soft:#25566f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181d;--surface:#1a232a;--surface-2:#212c34;--ink:#e6ecf0;--ink-2:#93a3af;--line:#2f3d47;--accent:#5fb4d0;--accent-ink:#0c1a21;--accent-soft:#1b3541;--hint:#f0a94e;--hint-soft:#3a2a12;--ok:#62c592;--ok-soft:#17342a;--err:#f28b82;--err-soft:#3b1d1b;--g-surface:#143443;--g-surface-2:#1c4658;--g-line:#2d5a70;--g-ink:#e8f3f8;--g-ink-2:#a3c2d1;--g-accent:#7cc4de;--g-accent-ink:#08222d;--g-accent-soft:#25566f;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;margin:0;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1760px;margin-inline:auto;display:grid;gap:20px;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "guide" "form"}
@media(min-width:940px){.wrap{grid-template-columns:360px minmax(0,1fr);grid-template-areas:"head head" "guide form";align-items:start}}
header{grid-area:head;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
h1{font-size:20px;font-weight:600;margin:0;text-wrap:balance}
.crumb{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.badge{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:3px;background:var(--hint-soft);color:var(--hint)}
.guide{grid-area:guide;background:var(--g-surface);border:1px solid var(--g-line);border-radius:6px;min-width:0;--surface:var(--g-surface);--surface-2:var(--g-surface-2);--line:var(--g-line);--ink:var(--g-ink);--ink-2:var(--g-ink-2);--accent:var(--g-accent);--accent-ink:var(--g-accent-ink);--accent-soft:var(--g-accent-soft);color:var(--ink)}
@media(min-width:940px){.guide{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.g-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.g-eyebrow{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.g-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.g-nav .btn{min-height:44px;padding:10px 14px;font-size:15px;font-weight:600;border-radius:6px;border:2px solid var(--accent)}
#gPrev{background:var(--accent-soft);color:var(--accent)}
#gPrev:hover:not(:disabled){background:var(--accent);color:var(--accent-ink)}
#gNext{background:var(--accent);color:var(--accent-ink)}
.g-nav .btn:disabled{opacity:.4;cursor:not-allowed}
.g-title{font-size:16px;font-weight:600;margin:14px 0 0;text-wrap:balance}
.progress{height:4px;background:var(--surface-2);border-radius:2px;margin-top:10px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.g-body{padding:14px 16px;display:grid;gap:12px}.g-body p{margin:0}
.g-sub{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--ink-2);margin-bottom:2px}
.note{padding:10px 12px;border-radius:4px;background:var(--hint-soft);color:var(--ink)}
.note b{color:var(--hint)}
.example{font-family:var(--font-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.g-actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:4px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.ghost{border-color:transparent;color:var(--accent);background:transparent;padding-inline:6px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible,.steps button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.steps{list-style:none;margin:0;padding:8px;border-top:1px solid var(--line);display:grid;gap:2px}
.steps button{width:100%;text-align:left;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:center;background:transparent;border:0;border-radius:4px;padding:6px 8px;color:var(--ink-2)}
.steps button:hover{background:var(--surface-2)}
.steps button[aria-current="step"]{background:var(--accent-soft);color:var(--ink);font-weight:500}
.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:600}
.steps .done .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.formcol{grid-area:form;min-width:0;display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:transparent;border:0;padding:8px 14px;border-bottom:2px solid transparent;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.panel{padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;align-items:start}
@media(max-width:640px){.panel{grid-template-columns:minmax(0,1fr)}}
.panel[hidden]{display:none}
.field{min-width:0;padding:6px;margin:-6px;border-radius:6px;transition:box-shadow .15s,background .15s}
.field.full{grid-column:1/-1}
.field.is-guided{box-shadow:0 0 0 2px var(--hint);background:var(--hint-soft)}
.field[hidden]{display:none!important}
label.lbl{display:block;font-weight:600;font-size:13px;margin-bottom:4px}
.req{color:var(--err);margin-left:2px}
input[type=text],input[type=date],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
.help{font-size:12px;color:var(--ink-2);margin-top:4px;overflow-wrap:anywhere}
.errmsg{font-size:12px;color:var(--err);margin-top:4px}
.trig{display:none}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 6px 6px;align-items:center}
.toolbar .spacer{flex:1}
.chk{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);font-size:13px}
.ctx{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);padding:8px 16px 0}
.locked{color:var(--ink-2);font-size:12px;padding:10px 12px;background:var(--surface-2);border:1px dashed var(--line);border-radius:4px;grid-column:1/-1}
.qrbox{width:120px;height:120px;border:1.5px dashed var(--line);border-radius:4px;display:grid;place-items:center;color:var(--ink-2);font-size:12px;text-align:center;background:var(--surface-2)}
#flash{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:4px;background:var(--ink);color:var(--bg);box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:10}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head><body>
<div class="wrap">
  <header>
    <div><h1 id="h1"></h1><div class="crumb" id="crumb"></div></div>
    <span class="badge">Demo: no guarda nada real</span>
  </header>
  <aside class="guide" aria-label="Guía paso a paso">
    <div class="g-head">
      <div class="g-eyebrow" id="gEyebrow"></div>
      <div class="g-nav"><button class="btn" id="gPrev" type="button">← Anterior</button><button class="btn primary" id="gNext" type="button">Siguiente →</button></div>
      <h2 class="g-title" id="gTitle"></h2>
      <div class="progress"><i id="gBar"></i></div>
    </div>
    <div class="g-body" id="gBody"></div>
    <ol class="steps" id="gSteps"></ol>
  </aside>
  <main class="formcol">
    <div class="card">
      <div class="ctx" id="ctxLine"></div>
      <div class="panel" id="panel"></div>
      <div class="toolbar">
        <button class="btn" type="button" id="btnReset">Reiniciar demo</button>
        <span class="spacer"></span>
        <span class="chk">Todos los campos son de solo lectura</span>
      </div>
    </div>
  </main>
</div>
<div id="flash" hidden role="status"></div>
<script>
(function () {
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  // Detalle de un QR: todos los campos del formulario están deshabilitados (disabled: true). Datos de ejemplo.
  var F = [
    { id: 'internal_reference', l: 'Referencia interna', v: 'PED-1042', body: 'Referencia que dio quien pidió el cobro (por ejemplo, el pedido de la tienda). La asigna el sistema y no se edita.', tip: 'Es lo que te permite relacionar el QR con el pedido o la cobranza que lo originó.' },
    { id: 'external_qr_id', l: 'ID de QR del banco', v: 'QR-8841327', body: 'Identificador que el banco asignó a este QR. Solo lectura.', tip: 'Dáselo al banco o a soporte si necesitas rastrear un cobro.' },
    { id: 'bank_code', l: 'Banco', v: 'bnb', body: 'Cuenta bancaria (proveedor) con la que se generó el QR. Solo lectura.', tip: 'Se elige al generar el QR, no aquí.' },
    { id: 'status', l: 'Estado', v: 'pending', body: 'Estado actual del cobro. Cambia solo cuando el banco avisa del pago, o cuando el QR se anula o vence.', tip: 'Los valores de esta guía son de ejemplo. Un pago registrado a mano se ve en la lista de pagos del QR.' },
    { id: 'amount', l: 'Monto', v: '150.00', body: 'Importe que se cobra con este QR. Solo lectura.', tip: 'Si el monto no es el correcto, anula el QR y genera otro.' },
    { id: 'currency', l: 'Moneda', v: 'BOB', body: 'Moneda del cobro.', tip: '' },
    { id: 'description', l: 'Descripción', v: 'Pedido 1042 — Tienda online', full: true, body: 'Texto del cobro que el sistema envió al generar el QR.', tip: '' },
    { id: 'branch_code', l: 'Sucursal', v: '1', body: 'Sucursal asociada al cobro. Es un dato por transacción.', tip: '' },
    { id: 'customer_nit', l: 'NIT del cliente', v: '1023456028', body: 'NIT del cliente, si se indicó al generar el QR.', tip: '' },
    { id: 'tax_percentage', l: 'Impuesto aplicado (%)', v: '13', body: 'Porcentaje de impuesto aplicado al cobro.', tip: 'Junto con el importe del impuesto, muestra cuánto del monto corresponde a impuestos.' },
    { id: 'tax_amount', l: 'Importe del impuesto', v: '19.50', body: 'Parte del monto que corresponde al impuesto.', tip: '' },
    { id: 'due_date', l: 'Fecha de vencimiento', v: '2026-11-30', body: 'Fecha límite para pagar con este QR.', tip: 'Pasada esa fecha el QR vence y ya no se puede pagar.' },
    { id: 'single_use', l: 'Uso único', v: 'Sí', body: 'Si es «Sí», el QR deja de servir después de recibir un pago.', tip: '' }
  ];
  var steps = [], step = 0;
  function build() {
    document.title = 'Guía: Código QR'; $('#h1').textContent = 'Detalle de un código QR'; $('#crumb').textContent = '/backend/aero/pay/qrcodes · Guía de capacitación';
    var p = $('#panel');
    F.forEach(function (f) {
      var d = document.createElement('div'); d.className = 'field' + (f.full ? ' full' : ''); d.setAttribute('data-f', f.id);
      var l = document.createElement('label'); l.className = 'lbl'; l.setAttribute('for', f.id); l.textContent = f.l;
      var i = document.createElement('input'); i.type = 'text'; i.id = f.id; i.value = f.v; i.disabled = true;
      d.appendChild(l); d.appendChild(i); p.appendChild(d);
    });
    var q = document.createElement('div'); q.className = 'field full'; q.setAttribute('data-f', 'qr_image');
    q.innerHTML = '<div class="lbl">Imagen del QR</div><div class="qrbox">Aquí se muestra el QR (ejemplo)</div>';
    p.appendChild(q);
    var r = document.createElement('div'); r.className = 'field full'; r.setAttribute('data-f', 'payments');
    r.innerHTML = '<div class="lbl">Pagos</div><div class="locked">Lista de pagos asociados a este QR. En la app aparece aquí cada pago detectado o registrado a mano.</div>';
    p.appendChild(r);
    $('#ctxLine').textContent = 'Formulario de solo lectura: el QR lo genera el sistema (Generar QR) y aquí solo se consulta.';
  }
  function buildSteps() {
    steps = F.map(function (f) { return { id: f.id, title: f.l, body: f.body, tip: f.tip, ex: f.v }; });
    steps.push({ id: 'qr_image', title: 'Imagen del QR', body: 'Muestra el código QR que se entrega al pagador.', tip: '', ex: '' });
    steps.push({ id: 'payments', title: 'Pagos', body: 'Lista los pagos asociados a este QR: los que avisó el banco y los registrados a mano.', tip: 'Si el banco no avisó un pago que sí recibiste, regístralo a mano desde la cuenta bancaria.', ex: '' });
  }
  var seen = {};
  function render() {
    var cur = steps[step]; seen[cur.id] = true;
    $('#gEyebrow').textContent = 'Paso ' + (step + 1) + ' de ' + steps.length + ' · solo lectura';
    $('#gTitle').textContent = cur.title;
    var body = $('#gBody'); body.innerHTML = '';
    var p = document.createElement('p'); p.textContent = cur.body; body.appendChild(p);
    if (cur.ex) { var w = document.createElement('div'), l = document.createElement('div'), e = document.createElement('div'); l.className = 'g-sub'; l.textContent = 'Ejemplo'; e.className = 'example'; e.textContent = cur.ex; w.appendChild(l); w.appendChild(e); body.appendChild(w); }
    if (cur.tip) { var n = document.createElement('div'), b = document.createElement('b'); n.className = 'note'; b.textContent = 'Ojo. '; n.appendChild(b); n.appendChild(document.createTextNode(cur.tip)); body.appendChild(n); }
    $('#gBar').style.width = Math.round(100 * Object.keys(seen).length / steps.length) + '%';
    $('#gPrev').disabled = step === 0; $('#gNext').disabled = step === steps.length - 1;
    var ol = $('#gSteps'); ol.innerHTML = '';
    steps.forEach(function (s, i) {
      var li = document.createElement('li'), bt = document.createElement('button'), d = document.createElement('span'), t = document.createElement('span');
      bt.type = 'button'; if (i === step) bt.setAttribute('aria-current', 'step'); if (seen[s.id]) bt.className = 'done';
      d.className = 'dot'; d.textContent = seen[s.id] ? '✓' : String(i + 1); t.textContent = s.title;
      bt.appendChild(d); bt.appendChild(t); bt.onclick = function () { step = i; render(); focusField(); }; li.appendChild(bt); ol.appendChild(li);
    });
    $$('.field').forEach(function (f) { f.classList.remove('is-guided'); });
    var el = $('[data-f="' + cur.id + '"]'); if (el) el.classList.add('is-guided');
  }
  function focusField() { var el = $('[data-f="' + steps[step].id + '"]'); if (el) el.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  $('#gPrev').onclick = function () { step = Math.max(0, step - 1); render(); focusField(); };
  $('#gNext').onclick = function () { step = Math.min(steps.length - 1, step + 1); render(); focusField(); };
  $('#btnReset').onclick = function () { location.reload(); };
  build(); buildSteps(); render();
})();
</script>
</body></html>
