    validate: function () { return []; },
    saveTip: 'Guardar conserva las notas internas. Es lo único que se guarda desde el formulario; los botones de estado actúan al momento.',
    saveTip2: 'Guardar y cerrar te devuelve a la lista de pedidos.',
    saveMsg: 'Pedido guardado (ejemplo).'
  };
  var A = {};
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var S = { step: 0, tab: CFG.tabs[0][0], mode: CFG.mode, armed: null }, steps = [], ft;
  function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
  function V(id) { var e = $('#f_' + id); if (!e) return ''; return e.type === 'checkbox' ? (e.checked ? '1' : '') : (e.value || '').trim(); }
  function setv(id, v) { var e = $('#f_' + id); if (!e) return; if (e.type === 'checkbox') e.checked = !!v; else e.value = v; e.dispatchEvent(new Event('input', { bubbles: true })); e.dispatchEvent(new Event('change', { bubbles: true })); }
  function F(id) { return CFG.fields.filter(function (f) { return f.id === id; })[0]; }
  function vals() { var o = {}; CFG.fields.forEach(function (f) { o[f.id] = V(f.id); }); return o; }
  function flash(m, bad) { var f = $('#flash'); f.textContent = m; f.className = bad ? 'err' : ''; f.hidden = false; clearTimeout(ft); ft = setTimeout(function () { f.hidden = true; }, 4200); }
  function shown(f) { return (!f.upd || S.mode === 'edit') && (!f.show || f.show(vals())); }
  var api = { set: function (id, v) { var e = $('#f_' + id); if (e) { e.value = v; } }, flash: flash, V: V };
  var LABEL = { paid: 'Pagado', fulfilled: 'Despachado/entregado', cancelled: 'Cancelado' };
  function doAction(kind, fromBtn) {
    var cur = V('status');
    var okFrom = kind === 'paid' ? (cur === 'Pendiente' || cur === 'Esperando pago') : kind === 'fulfilled' ? cur === 'Pagado' : ['Despachado/entregado', 'Cancelado', 'Reembolsado'].indexOf(cur) < 0;
    if (!okFrom) { flash(kind === 'fulfilled' ? 'Primero marca el pedido como pagado: ese botón solo aparece con el pedido Pagado.' : 'Esa acción no está disponible con el estado «' + cur + '».', true); return; }
    api.set('status', LABEL[kind]); A[kind] = true;
    HIST.unshift([cur, LABEL[kind], 'Tú', '12/10/2026 11:15']); renderHist();
    flash(kind === 'paid' ? 'Pedido marcado como pagado.' : kind === 'fulfilled' ? 'Pedido marcado como despachado/entregado.' : 'Pedido cancelado. Se liberó el stock reservado.');
    if (!fromBtn) refresh();
  }

  function buildForm() {
    var host = $('#panels');
    CFG.tabs.forEach(function (t) { var p = el('div', 'panel'); p.id = 'tab-' + t[0]; p.setAttribute('role', 'tabpanel'); host.appendChild(p); });
    CFG.fields.forEach(function (f) {
      var box = el('div', 'field' + (f.full ? ' full' : '')); box.setAttribute('data-f', f.id);
      var lb = el('label', 'lbl', f.label); lb.setAttribute('for', 'f_' + f.id);
      if (f.req) lb.appendChild(el('span', 'req', '*'));
      if (f.trig) lb.appendChild(el('span', 'trig', f.trig));
      box.appendChild(lb);
      if (f.build) { f.build(box); $('#tab-' + f.tab).appendChild(box); return; }
      var c;
      if (f.type === 'textarea' || (f.type === 'ro' && f.area)) { c = el('textarea', 'small'); if (f.type === 'ro') c.readOnly = true; }
      else { c = el('input'); c.type = 'text'; c.autocomplete = 'off'; if (f.type === 'ro') c.readOnly = true; }
      c.id = 'f_' + f.id; if (f.def) c.value = f.def;
      box.appendChild(c);
      if (f.help) box.appendChild(el('div', 'help', f.help));
      var em = el('div', 'errmsg'); em.hidden = true; box.appendChild(em);
      $('#tab-' + f.tab).appendChild(box);
      ['input', 'change'].forEach(function (ev) { c.addEventListener(ev, function () { refresh(); }); });
      c.addEventListener('focus', function () { var i = ids().indexOf(f.id); if (i >= 0 && i !== S.step) go(i, false); });
    });
  }
  function renderTabs() {
    var t = $('#tabs'); t.innerHTML = ''; t.hidden = CFG.tabs.length < 2;
    CFG.tabs.forEach(function (x) { var b = el('button', 'tab', x[1]); b.type = 'button'; b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(S.tab === x[0])); b.onclick = function () { selectTab(x[0]); }; t.appendChild(b); });
  }
  function selectTab(id) { S.tab = id; CFG.tabs.forEach(function (x) { $('#tab-' + x[0]).hidden = x[0] !== id; }); renderTabs(); }
  function applyVis() { CFG.fields.forEach(function (f) { var b = $('[data-f="' + f.id + '"]'); if (b) b.hidden = !shown(f); }); }

  function build() {
    var s = [];
    CFG.fields.forEach(function (f) {
      if (!f.step || !shown(f)) return;
      var st = f.step;
      s.push({ id: f.id, tab: f.tab, fields: [f.id], title: st.title, body: st.body, tip: st.tip, ex: st.ex, req: f.req, opt: !f.req && f.type !== 'ro' && !st.info && !f.build,
        fill: st.fill === undefined ? null : function () { setv(f.id, st.fill); }, done: function () { return true; } });
    });
    CFG.steps.forEach(function (x) { s.push(x); });
    if (CFG.canSave) s.push({ id: 'save', tab: 'main', fields: [], title: 'Guardar cambios', body: CFG.saveTip, tip: CFG.saveTip2 || '', ex: '', fill: function () { save(); }, done: function () { return !!S.saved; } });
    return s;
  }
  function ids() { return steps.map(function (s) { return s.fields[0] || s.id; }); }
  function renderGuide() {
    var cur = steps[S.step];
    $('#gEyebrow').textContent = 'Paso ' + (S.step + 1) + ' de ' + steps.length + (cur.opt ? ' · opcional' : cur.req ? ' · obligatorio' : '');
    $('#gTitle').textContent = cur.title;
    var body = $('#gBody'); body.innerHTML = '';
    body.appendChild(el('p', null, cur.body));
    if (cur.ex) { var w = el('div'); w.appendChild(el('div', 'g-sub', 'Ejemplo')); w.appendChild(el('div', 'example', cur.ex)); body.appendChild(w); }
    if (cur.tip) { var n = el('div', 'note'); n.appendChild(el('b', null, 'Ojo. ')); n.appendChild(document.createTextNode(cur.tip)); body.appendChild(n); }
    var ok = steps.filter(function (s) { return s.done(); }).length;
    $('#gBar').style.width = Math.round(100 * ok / steps.length) + '%';
    $('#gPrev').disabled = S.step === 0; $('#gNext').disabled = S.step === steps.length - 1;
    $('#gFill').hidden = !cur.fill;
    $('#gFill').textContent = cur.id === 'save' ? 'Guardar con los datos actuales' : (cur.fillLabel || 'Rellenar ejemplo');
    var ol = $('#gSteps'); ol.innerHTML = '';
    steps.forEach(function (s, i) {
      var li = el('li'), bt = el('button'); bt.type = 'button';
      var d = s.done() && (s.opt || s.id === 'save' || (!s.req && s.fields.length));
      if (i === S.step) bt.setAttribute('aria-current', 'step');
      if (d) bt.className = 'done';
      bt.appendChild(el('span', 'dot', d ? '✓' : String(i + 1))); bt.appendChild(el('span', null, s.title));
      bt.onclick = function () { go(i); }; li.appendChild(bt); ol.appendChild(li);
    });
    $$('.field,.upd').forEach(function (f) { f.classList.remove('is-guided'); });
    if (cur.tab) selectTab(cur.tab);
    cur.fields.forEach(function (f) { var e = $('[data-f="' + f + '"]'); if (e && !e.hidden) e.classList.add('is-guided'); });
  }
  function go(i, scroll) {
    S.step = Math.max(0, Math.min(steps.length - 1, i)); renderGuide();
    if (scroll !== false) { var f = steps[S.step].fields[0], e = f && $('[data-f="' + f + '"]'); if (e && !e.hidden) e.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  }
  function refresh() { var cur = steps[S.step].id; steps = build(); var i = steps.map(function (s) { return s.id; }).indexOf(cur); S.step = i >= 0 ? i : Math.min(S.step, steps.length - 1); applyVis(); renderToolbar(); renderGuide(); }
  function save() { S.saved = true; flash(CFG.saveMsg); refresh(); }
  function renderToolbar() {
    var t = $('#toolbar'); t.innerHTML = '';
    CFG.actions.forEach(function (ac) {
      if (ac.show && !ac.show(vals())) return;
      var b = el('button', 'btn ' + (ac.cls || ''), S.armed === ac.id ? '¿Seguro? Pulsa de nuevo' : ac.label); b.type = 'button'; b.id = 'act_' + ac.id;
      b.onclick = function () {
        if (ac.confirm && S.armed !== ac.id) { S.armed = ac.id; renderToolbar(); setTimeout(function () { if (S.armed === ac.id) { S.armed = null; renderToolbar(); } }, 3500); return; }
        S.armed = null; ac.run(api); refresh();
      };
      t.appendChild(b);
    });
    var a = el('button', 'btn primary', 'Guardar'); a.type = 'button'; a.onclick = save; t.appendChild(a);
    var c = el('button', 'btn', 'Guardar y cerrar'); c.type = 'button'; c.onclick = function () { S.saved = true; flash('Pedido guardado. En la app real vuelves a la lista de pedidos.'); refresh(); }; t.appendChild(c);
    var r = el('button', 'btn', 'Reiniciar demo'); r.type = 'button'; r.onclick = function () { location.reload(); }; t.appendChild(r);
    t.appendChild(el('span', 'spacer'));
    var l = el('label', 'chk'), k = el('input'); k.type = 'checkbox'; k.onchange = function () { document.body.classList.toggle('show-tech', k.checked); }; k.checked = document.body.classList.contains('show-tech');
    l.appendChild(k); l.appendChild(document.createTextNode(' Mostrar reglas técnicas (trigger)')); t.appendChild(l);
  }
  $('#gPrev').onclick = function () { go(S.step - 1); };
  $('#gNext').onclick = function () { go(S.step + 1); };
  $('#gFill').onclick = function () { var s = steps[S.step]; if (s.fill) s.fill(api); if (s.id !== 'save' && s.fields.length) refresh(); };
  $('#h1').textContent = CFG.title; $('#crumb').textContent = CFG.crumb; $('#ctxLine').textContent = CFG.ctx;
  buildForm(); renderTabs(); steps = build(); applyVis(); renderToolbar(); selectTab(CFG.tabs[0][0]); renderGuide();
})();
</script>
</body></html>
