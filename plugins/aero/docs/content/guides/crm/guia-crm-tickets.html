<style>

button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:4px}.btn:hover{background:var(--surface-2)}

.steps .done .dot{background:var(--ok);border-color:var(--ok);color:#fff}
.formcol{grid-area:form;min-width:0}.card{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.ctx{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);padding:8px 16px 0}

.tab{background:transparent;border:0;padding:8px 14px;border-bottom:2px solid transparent;color:var(--ink-2);font-weight:500;white-space:nowrap}.tab[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.panel{padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;align-items:start}.panel[hidden]{display:none}
@media(max-width:640px){.panel{grid-template-columns:minmax(0,1fr)}}
.field{min-width:0;padding:6px;margin:-6px;border-radius:6px;transition:box-shadow .15s,background .15s}.field.full{grid-column:1/-1}.field[hidden]{display:none!important}
.field.is-guided{box-shadow:0 0 0 2px var(--hint);background:var(--hint-soft)}
label.lbl{display:block;font-weight:600;font-size:13px;margin-bottom:4px}.req{color:var(--err);margin-left:2px}
input[type=text],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
textarea{resize:vertical;min-height:100px}.err{border-color:var(--err)!important}
.help{font-size:12px;color:var(--ink-2);margin-top:4px}.errmsg{font-size:12px;color:var(--err);margin-top:4px}
.sw{display:flex;gap:8px;align-items:center}
.lock{grid-column:1/-1;border:1px dashed var(--line);border-radius:6px;padding:12px 14px;color:var(--ink-2)}
.trig{font-family:var(--font-mono);font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:3px;padding:1px 6px;margin-left:6px;font-weight:400}body:not(.show-tech) .trig{display:none}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2);align-items:center}.toolbar .spacer{flex:1}
.chk{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);font-size:12px}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="wrap">
<header><div><h1 id="h1">Nuevo ticket</h1><div class="crumb" id="crumb">/backend/aero/crm/tickets/create · Guía de capacitación</div></div><span class="badge">Demo: no guarda nada real</span></header>
<aside class="guide" aria-label="Guía paso a paso">
<div class="g-head"><div class="g-eyebrow" id="gEyebrow"></div><div class="g-nav"><button class="btn" id="gPrev" type="button">← Anterior</button><button class="btn" id="gNext" type="button">Siguiente →</button></div><h2 class="g-title" id="gTitle"></h2><div class="progress"><i id="gBar"></i></div></div>
<div class="g-body" id="gBody"></div>
<div class="g-actions"><button class="btn ghost" id="gFill" type="button">Rellenar ejemplo</button></div>
<ol class="steps" id="gSteps"></ol></aside>
<main class="formcol"><div class="card">
<div class="ctx">context: create · la conversación (context: update) solo aparece tras guardar</div>
<div class="tabs" id="tabs" role="tablist"></div><div id="panels"></div>
<div class="toolbar"><button class="btn primary" type="button" id="btnSave">Crear</button><button class="btn" type="button" id="btnSaveClose">Crear y cerrar</button><button class="btn" type="button" id="btnReset">Reiniciar demo</button><span class="spacer"></span><label class="chk"><input type="checkbox" id="chkTech"> Mostrar reglas técnicas (trigger)</label></div>
</div></main></div>
<div id="flash" hidden role="status"></div>
<script>
(function(){
var $=function(s,r){return(r||document).querySelector(s)},$$=function(s,r){return[].slice.call((r||document).querySelectorAll(s))};
var CFG={edit:'Editar ticket',path:'tickets',noun:'Ticket creado'};
var DEPS={'':'— elegí —',d1:'Soporte técnico (ejemplo)',d2:'Ventas (ejemplo)'};
var MEMBERS={d1:{'':'Sin asignar',u1:'Ana (ejemplo)',u2:'Luis (ejemplo)'},d2:{'':'Sin asignar',u3:'Rosa (ejemplo)'}};
// Fiel a models/ticket/fields.yaml. Las opciones de estado y prioridad vienen de Ticket::statusOptions()/priorityOptions().
var F=[
{id:'subject',l:'Asunto',t:'text',tab:'General',w:'f',r:1,x:'No puedo ingresar a mi cuenta',s:'Asunto',b:'Resumen del problema en una línea. Máximo 255 caracteres.',tip:'Es obligatorio; que sea claro para quien lo atienda.'},
{id:'department_id',l:'Departamento',t:'select',tab:'General',r:1,o:function(){return DEPS},x:'d1',s:'Departamento',b:'Quién atiende el ticket. Solo se pueden elegir departamentos activos.',tip:'Obligatorio. Si ves «Elegí el departamento», falta este paso.'},
{id:'assigned_to',l:'Asignado a',t:'select',tab:'General',o:function(){return MEMBERS[val('department_id')]||{'':'Sin asignar'}},x:'u1',h:'Solo integrantes del departamento.',s:'Asignado a',b:'Persona que atenderá el ticket. La lista depende del departamento elegido.',tip:'Elige primero el departamento; si lo cambias, la lista se reinicia.'},
{id:'priority',l:'Prioridad',t:'select',tab:'General',o:function(){return{low:'Baja',normal:'Normal',high:'Alta',urgent:'Urgente'}},d:'normal',x:'high',s:'Prioridad',b:'Urgencia del ticket (por defecto Normal).',tip:'Reserva «Urgente» para lo que bloquea al cliente.'},
{id:'status',l:'Estado',t:'select',tab:'General',o:function(){return{open:'Abierto',pending:'En espera',resolved:'Resuelto',closed:'Cerrado'}},d:'open',x:'open',s:'Estado',b:'En qué punto está el ticket. Resuelto o Cerrado registran la fecha de cierre.',tip:'Al crear, deja «Abierto».'},
{id:'description',l:'Descripción',t:'textarea',tab:'General',w:'f',x:'Al ingresar me dice «contraseña incorrecta» aunque la cambié ayer.',s:'Descripción',b:'Detalle del problema o solicitud.',tip:'Incluye qué esperaba el cliente y qué ocurrió.'},
{id:'requester_name',l:'Solicitante',t:'text',tab:'Solicitante',x:'María Quispe',s:'Solicitante',b:'Nombre de quien pide la ayuda.',tip:'Opcional.'},
{id:'requester_email',l:'Correo',t:'text',tab:'Solicitante',x:'maria@ejemplo.com',s:'Correo del solicitante',b:'Correo de contacto del solicitante.',tip:'Si lo escribes, debe ser un correo válido.'},
{id:'requester_phone',l:'Teléfono / WhatsApp',t:'text',tab:'Solicitante',x:'+591 700 00000',s:'Teléfono / WhatsApp',b:'Número del solicitante.',tip:'Con código de país.'},
{id:'contact_id',l:'Contacto del CRM',t:'select',tab:'Solicitante',o:function(){return{'':'Ninguno',k1:'María Quispe (ejemplo)',k2:'Carlos Mamani (ejemplo)'}},x:'k1',s:'Contacto del CRM',b:'Vincula el ticket con un contacto existente (opcional).',tip:'Útil para ver el historial del cliente.'},
{id:'conversation',l:'Conversación',t:'note',tab:'Respuestas',w:'f',u:1,h:'Aquí se muestra el historial de respuestas del ticket. Aparece solo al editar un ticket ya guardado (context: update).'},
{id:'new_reply',l:'Nueva respuesta',t:'textarea',tab:'Respuestas',w:'f',x:'Hola María, ya restablecimos tu acceso. Prueba de nuevo.',s:'Nueva respuesta',b:'Escribe aquí la respuesta al solicitante; se agrega a la conversación al guardar.',tip:'Marca «Nota interna» si no debe verla el solicitante.'},
{id:'reply_internal',l:'Nota interna (el solicitante no la ve)',t:'switch',tab:'Respuestas',w:'f',x:0,s:'Nota interna',b:'Activa esta casilla para que la respuesta quede solo para tu equipo.',tip:'Si la dejas desmarcada, el solicitante podrá ver la respuesta.'}
];
var S={mode:'create',step:0,steps:[],tab:'General'};
function mk(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function val(id){var e=$('#'+id);if(!e)return'';if(e.type==='checkbox')return e.checked?'1':'';return(e.value||'').trim()}
function vis(f){return!f.u||S.mode==='update'}
function opts(f){return typeof f.o==='function'?f.o():f.o}
function fillSel(f){var s=$('#'+f.id),cur=s.value,o=opts(f);s.innerHTML='';Object.keys(o).forEach(function(k){var op=mk('option',0,o[k]);op.value=k;s.appendChild(op)});s.value=o[cur]!=null?cur:(f.d||'')}
function build(){var host=$('#panels'),tabs={};F.forEach(function(f){var pn=tabs[f.tab];if(!pn){pn=mk('div','panel');pn.setAttribute('data-tab',f.tab);host.appendChild(pn);tabs[f.tab]=pn}
 var d=mk('div','field'+(f.w==='f'?' full':''));d.setAttribute('data-f',f.id);
 if(f.t==='note'){d.className='lock';d.appendChild(document.createTextNode(f.h));pn.appendChild(d);d.hidden=true;return}
 var c;if(f.t==='switch'){var w=mk('div','sw');c=mk('input');c.type='checkbox';w.appendChild(c);w.appendChild(mk('span',0,f.l));d.appendChild(w)}
 else{var l=mk('label','lbl',f.l);l.htmlFor=f.id;if(f.r)l.appendChild(mk('span','req','*'));if(f.id==='assigned_to')l.appendChild(mk('span','trig','dependsOn: department_id'));d.appendChild(l);
  if(f.t==='select')c=mk('select');else if(f.t==='textarea')c=mk('textarea');else{c=mk('input');c.type='text';c.autocomplete='off'}d.appendChild(c)}
 c.id=f.id;if(f.h)d.appendChild(mk('div','help',f.h));var m=mk('div','errmsg');m.hidden=true;d.appendChild(m);pn.appendChild(d)});
 F.forEach(function(f){if(f.t==='select')fillSel(f)});
 $$('#panels input,#panels select,#panels textarea').forEach(function(el){el.addEventListener('input',onCh);el.addEventListener('change',onCh);el.addEventListener('focus',function(){var b=el.closest('.field'),i=idxOf(b&&b.getAttribute('data-f'));if(i>=0&&i!==S.step)go(i,false)})})}
function onCh(e){if(e.target.id==='department_id')fillSel(F[2]);if(e.target.classList.contains('err')){e.target.classList.remove('err');var m=$('.errmsg',e.target.closest('.field'));if(m)m.hidden=true}refresh()}
function tabList(){var t=[];F.forEach(function(f){if(vis(f)&&t.indexOf(f.tab)<0)t.push(f.tab)});return t}
function showTabs(){var b=$('#tabs');b.innerHTML='';tabList().forEach(function(n){var x=mk('button','tab',n);x.type='button';x.setAttribute('role','tab');x.setAttribute('aria-selected',String(n===S.tab));x.onclick=function(){S.tab=n;showTabs()};b.appendChild(x)});
 $$('#panels .panel').forEach(function(p){p.hidden=p.getAttribute('data-tab')!==S.tab});$$('#panels .lock').forEach(function(d){d.hidden=S.mode!=='update'})}
function exTxt(f){if(f.t==='switch')return'Marcada';var o=f.o&&opts(f);return o?(o[f.x]||String(f.x)):f.x}
function steps(){var s=[];F.forEach(function(f){if(!f.s)return;s.push({id:f.id,f:f,title:f.s,body:f.b,tip:f.tip,ex:exTxt(f),req:f.r,opt:!f.r,done:function(){return f.t==='switch'||(f.d?true:!!val(f.id))},fill:function(){var e=$('#'+f.id);if(f.t==='switch'){e.checked=!!f.x}else{if(f.id==='assigned_to'&&!val('department_id')){$('#department_id').value='d1';fillSel(F[2])}e.value=f.x}refresh()}})});
 s.push({id:'save',title:'Guardar',body:'Pulsa Crear. La demo valida los campos obligatorios y te lleva a la pantalla de edición, donde aparece la conversación.',tip:'«Crear y cerrar» te devuelve a la lista; «Crear» te deja editando el registro.',done:function(){return S.mode==='update'},fill:function(){save(false)}});return s}
function idxOf(id){for(var i=0;i<S.steps.length;i++)if(S.steps[i].id===id)return i;return-1}
function refresh(){var cur=S.steps[S.step]&&S.steps[S.step].id;S.steps=steps();var i=idxOf(cur);S.step=i>=0?i:Math.min(S.step,S.steps.length-1);render()}
function render(){var c=S.steps[S.step],n=S.steps.length;$('#gEyebrow').textContent='Paso '+(S.step+1)+' de '+n+(c.opt&&c.id!=='save'?' · opcional':c.req?' · obligatorio':'');$('#gTitle').textContent=c.title;
 var b=$('#gBody');b.innerHTML='';b.appendChild(mk('p',0,c.body));if(c.ex){var w=mk('div');w.appendChild(mk('div','g-sub','Ejemplo'));w.appendChild(mk('div','example',c.ex));b.appendChild(w)}
 if(c.tip){var t=mk('div','note');t.appendChild(mk('b',0,'Ojo. '));t.appendChild(document.createTextNode(c.tip));b.appendChild(t)}
 $('#gBar').style.width=Math.round(100*S.steps.filter(function(s){return s.done()}).length/n)+'%';$('#gPrev').disabled=S.step===0;$('#gNext').disabled=S.step===n-1;
 var fb=$('#gFill');fb.hidden=c.id==='save'&&S.mode==='update';fb.textContent=c.id==='save'?'Crear con los datos actuales':'Rellenar ejemplo';
 var ol=$('#gSteps');ol.innerHTML='';S.steps.forEach(function(s,i){var li=mk('li'),bt=mk('button');bt.type='button';if(i===S.step)bt.setAttribute('aria-current','step');var dn=s.done();if(dn)bt.className='done';bt.appendChild(mk('span','dot',dn?'✓':String(i+1)));bt.appendChild(mk('span',0,s.title));bt.onclick=function(){go(i)};li.appendChild(bt);ol.appendChild(li)});
 $$('.field').forEach(function(f){f.classList.remove('is-guided')});if(c.f){S.tab=c.f.tab;showTabs();$('[data-f="'+c.f.id+'"]').classList.add('is-guided')}}
function go(i,sc){S.step=Math.max(0,Math.min(S.steps.length-1,i));render();var c=S.steps[S.step];if(sc!==false&&c.f)$('[data-f="'+c.f.id+'"]').scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}
function err(id,m){var d=$('[data-f="'+id+'"]');var e=$('.errmsg',d);e.hidden=false;e.textContent=m;var c=$('input,select,textarea',d);if(c)c.classList.add('err')}
function save(close){$$('.errmsg').forEach(function(e){e.hidden=true});$$('.err').forEach(function(e){e.classList.remove('err')});var errs=[];
 if(!val('subject'))errs.push(['subject','El campo Asunto es obligatorio.']);else if(val('subject').length>255)errs.push(['subject','Asunto no puede superar 255 caracteres.']);
 if(!val('department_id'))errs.push(['department_id','Elegí el departamento.']);
 var em=val('requester_email');if(em&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em))errs.push(['requester_email','Correo debe ser una dirección válida.']);
 if(errs.length){errs.forEach(function(e){err(e[0],e[1])});go(idxOf(errs[0][0]));flash('No se pudo crear: '+errs[0][1],true);return}
 S.mode='update';$('#h1').textContent=CFG.edit;$('#crumb').textContent='/backend/aero/crm/'+CFG.path+'/update/7 · Guía de capacitación';$('#btnSave').textContent='Guardar';$('#btnSaveClose').textContent='Guardar y cerrar';
 flash(close?CFG.noun+'. En la app real vuelves a la lista.':CFG.noun+'. Ahora estás en la pantalla de edición.');showTabs();refresh()}
var ft;function flash(m,e){var f=$('#flash');f.textContent=m;f.className=e?'err':'';f.hidden=false;clearTimeout(ft);ft=setTimeout(function(){f.hidden=true},4200)}
$('#gPrev').onclick=function(){go(S.step-1)};$('#gNext').onclick=function(){go(S.step+1)};$('#gFill').onclick=function(){var s=S.steps[S.step];if(s.fill)s.fill()};
$('#btnSave').onclick=function(){save(false)};$('#btnSaveClose').onclick=function(){save(true)};$('#btnReset').onclick=function(){location.reload()};
$('#chkTech').onchange=function(e){document.body.classList.toggle('show-tech',e.target.checked)};
build();showTabs();S.steps=steps();render();
})();
</script></body></html>
