<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guía: Nueva gestión</title>

<style>
:root{--bg:#eceff2;--surface:#fff;--surface-2:#f5f7f9;--ink:#1d2933;--ink-2:#55636f;--line:#d5dce2;--accent:#1f6f8b;--accent-ink:#fff;--accent-soft:#dcecf2;--hint:#b4620a;--hint-soft:#fdf0dc;--ok:#1e7a4c;--ok-soft:#dff2e8;--err:#b3261e;--err-soft:#fbe4e2;--font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;--g-surface:#dcecf2;--g-surface-2:#cbe1ea;--g-line:#a9c9d6;--g-ink:#10303c;--g-ink-2:#3a5c6b;--g-accent:#1a6480;--g-accent-ink:#fff;--g-accent-soft:#f4fafc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12181d;--surface:#1a232a;--surface-2:#212c34;--ink:#e6ecf0;--ink-2:#93a3af;--line:#2f3d47;--accent:#5fb4d0;--accent-ink:#0c1a21;--accent-soft:#1b3541;--hint:#f0a94e;--hint-soft:#3a2a12;--ok:#62c592;--ok-soft:#17342a;--err:#f28b82;--err-soft:#3b1d1b;--g-surface:#143443;--g-surface-2:#1c4658;--g-line:#2d5a70;--g-ink:#e8f3f8;--g-ink-2:#a3c2d1;--g-accent:#7cc4de;--g-accent-ink:#08222d;--g-accent-soft:#25566f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12181d;--surface:#1a232a;--surface-2:#212c34;--ink:#e6ecf0;--ink-2:#93a3af;--line:#2f3d47;--accent:#5fb4d0;--accent-ink:#0c1a21;--accent-soft:#1b3541;--hint:#f0a94e;--hint-soft:#3a2a12;--ok:#62c592;--ok-soft:#17342a;--err:#f28b82;--err-soft:#3b1d1b;--g-surface:#143443;--g-surface-2:#1c4658;--g-line:#2d5a70;--g-ink:#e8f3f8;--g-ink-2:#a3c2d1;--g-accent:#7cc4de;--g-accent-ink:#08222d;--g-accent-soft:#25566f;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:14px;line-height:1.5;margin:0;padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1760px;margin-inline:auto;display:grid;gap:20px;grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "guide" "form"}
@media (min-width:940px){.wrap{grid-template-columns:360px minmax(0,1fr);grid-template-areas:"head head" "guide form";align-items:start}}
header{grid-area:head;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
h1{font-size:20px;font-weight:600;margin:0;text-wrap:balance}
.crumb{font-family:var(--font-mono);font-size:12px;color:var(--ink-2);overflow-wrap:anywhere}
.badge{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:3px 8px;border-radius:3px;background:var(--hint-soft);color:var(--hint)}
.guide{grid-area:guide;background:var(--g-surface);border:1px solid var(--g-line);border-radius:6px;min-width:0;--surface:var(--g-surface);--surface-2:var(--g-surface-2);--line:var(--g-line);--ink:var(--g-ink);--ink-2:var(--g-ink-2);--accent:var(--g-accent);--accent-ink:var(--g-accent-ink);--accent-soft:var(--g-accent-soft);color:var(--ink)}
@media (min-width:940px){.guide{position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto}}
.g-head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.g-eyebrow{font-size:15px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.g-title{font-size:16px;font-weight:600;margin:14px 0 0;text-wrap:balance}
.g-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.g-nav .btn{min-height:44px;padding:10px 14px;font-size:15px;font-weight:600;border-radius:6px;border:2px solid var(--accent)}
#gPrev{background:var(--accent-soft);color:var(--accent)}#gPrev:hover:not(:disabled){background:var(--accent);color:var(--accent-ink)}
#gNext{background:var(--accent);color:var(--accent-ink)}#gNext:hover:not(:disabled){filter:brightness(1.1)}
.g-nav .btn:disabled{opacity:.4;cursor:not-allowed}
.progress{height:4px;background:var(--surface-2);border-radius:2px;margin-top:10px;overflow:hidden}.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.g-body{padding:14px 16px;display:grid;gap:12px}.g-body p{margin:0}
.g-sub{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--ink-2);margin-bottom:2px}
.note{padding:10px 12px;border-radius:4px;background:var(--hint-soft);color:var(--ink)}.note b{color:var(--hint)}
.example{font-family:var(--font-mono);font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:4px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}
.g-actions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:4px}.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.ghost{border-color:transparent;color:var(--accent);background:transparent;padding-inline:6px}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible,.steps button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.steps{list-style:none;margin:0;padding:8px;border-top:1px solid var(--line);display:grid;gap:2px}
.steps button{width:100%;text-align:left;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;align-items:center;background:transparent;border:0;border-radius:4px;padding:6px 8px;color:var(--ink-2)}
.steps button:hover{background:var(--surface-2)}.steps button[aria-current="step"]{background:var(--accent-soft);color:var(--ink);font-weight:500}
.dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;font-weight:600}
.steps .done .dot{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.formcol{grid-area:form;min-width:0;display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;min-width:0}
.tabs{display:flex;gap:2px;padding:8px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto}.tabs:empty{display:none}
.tab{background:transparent;border:0;padding:8px 14px;border-bottom:2px solid transparent;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.ctx{font-family:var(--font-mono);font-size:11px;color:var(--ink-2);padding:8px 16px 0}
.panel{padding:16px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px;align-items:start}
@media (max-width:640px){.panel{grid-template-columns:minmax(0,1fr)}}
.field{min-width:0;padding:6px;margin:-6px;border-radius:6px;transition:box-shadow .15s,background .15s}.field.full{grid-column:1/-1}
.field.is-guided{box-shadow:0 0 0 2px var(--hint);background:var(--hint-soft)}.field[hidden]{display:none!important}
label.lbl{display:block;font-weight:600;font-size:13px;margin-bottom:4px}.req{color:var(--err);margin-left:2px}
input[type=text],input[type=date],select,textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent)}
textarea{resize:vertical}input:disabled{opacity:.6}
input.err,select.err,textarea.err{border-color:var(--err)}
.help{font-size:12px;color:var(--ink-2);margin-top:4px;overflow-wrap:anywhere}.errmsg{font-size:12px;color:var(--err);margin-top:4px}
.sec{grid-column:1/-1;border-bottom:1px solid var(--line);padding-bottom:6px}
.trig{font-family:var(--font-mono);font-size:11px;color:var(--accent);background:var(--accent-soft);border-radius:3px;padding:1px 6px;margin-left:6px;font-weight:400}
body:not(.show-tech) .trig{display:none}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface-2);border-radius:0 0 6px 6px;align-items:center}.toolbar .spacer{flex:1}
.chk{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);font-size:12px}
.locked{grid-column:1/-1;color:var(--ink-2);font-size:12px;padding:10px 12px;background:var(--surface-2);border:1px dashed var(--line);border-radius:4px}
.upd{grid-column:1/-1;border:1px dashed var(--line);border-radius:6px;padding:12px 14px}
.upd h4{margin:0 0 4px;font-size:13px}
#flash{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;max-width:calc(100vw - 32px);padding:10px 16px;border-radius:4px;background:var(--ink);color:var(--bg);box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:10}
#flash.err{background:var(--err);color:#fff}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<div class="wrap">
  <header><div><h1 id="h1"></h1><div class="crumb" id="crumb"></div></div><span class="badge">Demo: no guarda nada real</span></header>
  <aside class="guide" aria-label="Guía paso a paso">
    <div class="g-head"><div class="g-eyebrow" id="gEyebrow"></div>
      <div class="g-nav"><button class="btn" id="gPrev" type="button">← Anterior</button><button class="btn primary" id="gNext" type="button">Siguiente →</button></div>
      <h2 class="g-title" id="gTitle"></h2><div class="progress"><i id="gBar"></i></div></div>
    <div class="g-body" id="gBody"></div>
    <div class="g-actions"><button class="btn ghost" id="gFill" type="button">Rellenar ejemplo</button></div>
    <ol class="steps" id="gSteps"></ol>
  </aside>
  <main class="formcol"><div class="card">
    <div class="ctx" id="ctxLine"></div><div class="tabs" role="tablist" id="tabs"></div><div id="panels"></div>
    <div class="toolbar"><button class="btn primary" type="button" id="btnSave">Crear</button><button class="btn" type="button" id="btnSaveClose">Crear y cerrar</button><button class="btn" type="button" id="btnReset">Reiniciar demo</button><span class="spacer"></span><label class="chk"><input type="checkbox" id="chkTech"> Mostrar reglas técnicas (trigger)</label></div>
  </div></main>
</div>
<div id="flash" hidden role="status"></div>
<script>
var D={
  name:'gestión', title:'Nueva gestión', edit:'Editar gestión', crumb:'/backend/aero/school/years/create',
  saved:'Gestión creada. Ahora estás en la pantalla de edición.',
  tabs:[''],
  fields:[
    {id:'name',l:'Gestión',req:true,max:32,ph:'2026',st:{body:'Es el año escolar que estás abriendo. Máximo 32 caracteres.',tip:'Los cursos, conceptos de cobro y boletines cuelgan de la gestión; ponle un nombre que no se confunda con otra.',x:'2026'}},
    {id:'is_current',l:'Gestión vigente',t:'sw',def:true,c:'Solo una gestión es la vigente.',st:{body:'Marca la gestión con la que se trabaja hoy. Al guardar una gestión como vigente, las demás dejan de serlo.',tip:'No marques la vigente al preparar una gestión futura: cambiarías la que usa el colegio ahora.',ex:'Activada',x:'1'}},
    {id:'starts_on',l:'Inicio de clases',t:'date',st:{body:'Fecha en que empiezan las clases.',tip:'Opcional. Revisa que sea anterior al fin de clases.',ex:'02/02/2026',x:'2026-02-02'}},
    {id:'ends_on',l:'Fin de clases',t:'date',st:{body:'Fecha en que terminan las clases.',tip:'Opcional. Debe ser posterior al inicio.',ex:'30/11/2026',x:'2026-11-30'}},
    {id:'periods',l:'Periodos de evaluación',t:'num',def:3,min:1,mx:6,c:'En Bolivia son 3 trimestres.',st:{body:'Cuántos periodos de evaluación tiene la gestión: un número entero de 1 a 6.',tip:'Define las columnas del boletín. Déjalo en 3 si trabajas por trimestres.',x:'3'}}
  ]
};
</script>
<script>
(function(){
var $=function(s,r){return(r||document).querySelector(s)},$$=function(s,r){return[].slice.call((r||document).querySelectorAll(s))};
var F=D.fields,T=D.tabs&&D.tabs.length?D.tabs:[''],S={mode:'create',tab:0,step:0,touched:{}},ft;
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function V(id){var e=$('#'+id);if(!e)return'';return e.type==='checkbox'?(e.checked?'1':'0'):(e.value||'').trim()}
function fOf(id){return F.filter(function(f){return f.id===id})[0]}
function shown(f){return!f.tr||f.tr.v.indexOf(V(f.tr.f))>=0}
function flash(m,e){var f=$('#flash');f.textContent=m;f.className=e?'err':'';f.hidden=false;clearTimeout(ft);ft=setTimeout(function(){f.hidden=true},4200)}
function build(){
  var panels=T.map(function(n,i){var p=el('div','panel');p.id='tab'+i;p.setAttribute('role','tabpanel');$('#panels').appendChild(p);return p});
  F.forEach(function(f){
    var p=panels[f.tab||0];
    if(f.t==='sec'){var s=el('div','sec');s.appendChild(el('b',null,f.l));if(f.c)s.appendChild(el('div','help',f.c));p.appendChild(s);return}
    if(f.t==='note'){p.appendChild(el('div','locked',f.l));return}
    var box=el('div','field'+(f.sp||f.t==='area'?' full':''));box.setAttribute('data-f',f.id);
    var lb=el('label','lbl',f.l);lb.htmlFor=f.id;if(f.req)lb.appendChild(el('span','req','*'));
    if(f.tr)lb.appendChild(el('span','trig','show si '+f.tr.f+' = '+f.tr.v.join('|')));
    box.appendChild(lb);var inp;
    if(f.t==='sel'){inp=el('select');(f.eo!=null?[['',f.eo]]:[]).concat(f.o).forEach(function(o){var op=el('option',null,o[1]);op.value=o[0];inp.appendChild(op)})}
    else if(f.t==='area'){inp=el('textarea');inp.rows=f.rows||4}
    else{inp=el('input');inp.type=f.t==='sw'?'checkbox':f.t==='date'?'date':'text';if(f.t==='num')inp.inputMode='decimal'}
    inp.id=f.id;if(f.ph)inp.placeholder=f.ph;if(f.dis)inp.disabled=true;
    if(f.def!=null){if(f.t==='sw')inp.checked=!!f.def;else inp.value=f.def}
    box.appendChild(inp);if(f.c)box.appendChild(el('div','help',f.c));
    var er=el('div','errmsg');er.hidden=true;box.appendChild(er);p.appendChild(box);
    inp.addEventListener('input',function(){inp.classList.remove('err');er.hidden=true;S.touched[f.id]=1;refresh()});
    inp.addEventListener('change',function(){S.touched[f.id]=1;triggers();refresh()});
    inp.addEventListener('focus',function(){var i=steps().map(function(s){return s.id}).indexOf(f.id);if(i>=0&&i!==S.step)go(i,false)});
  });
}
function triggers(){F.forEach(function(f){var b=$('[data-f="'+f.id+'"]');if(b&&f.tr)b.hidden=!shown(f)})}
function steps(){
  var s=[];
  F.forEach(function(f){if(!f.st||!shown(f))return;var x=f.st;s.push({id:f.id,f:f,title:x.title||f.l,body:x.body,tip:x.tip,ex:x.ex!=null?x.ex:x.x,x:x.x,req:f.req,tab:f.tab||0})});
  s.push({id:'_save',title:'Guardar',last:1,tab:0,body:D.saveBody||'Pulsa Crear. La demo valida los campos obligatorios y te lleva a la pantalla de edición.',tip:D.saveTip||'Esta demo no guarda nada real: reinícala cuando quieras.'});
  return s;
}
function done(s){if(s.last)return S.mode==='update';if(s.req)return V(s.id)!=='';return!!S.touched[s.id]}
function setv(id,v){var e=$('#'+id);if(e.type==='checkbox')e.checked=v==='1';else e.value=v;S.touched[id]=1;e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}))}
function selTab(t){S.tab=t;$$('.panel').forEach(function(p,i){p.hidden=i!==t});var tb=$('#tabs');tb.innerHTML='';if(T.length>1)T.forEach(function(n,i){var b=el('button','tab',n);b.type='button';b.setAttribute('role','tab');b.setAttribute('aria-selected',String(i===t));b.onclick=function(){selTab(i)};tb.appendChild(b)})}
function render(){
  var ss=steps();S.step=Math.min(S.step,ss.length-1);var cur=ss[S.step];
  $('#gEyebrow').textContent='Paso '+(S.step+1)+' de '+ss.length+(cur.last?'':cur.req?' · obligatorio':' · opcional');
  $('#gTitle').textContent=cur.title;
  var body=$('#gBody');body.innerHTML='';body.appendChild(el('p',null,cur.body));
  if(cur.ex){var w=el('div');w.appendChild(el('div','g-sub','Ejemplo'));w.appendChild(el('div','example',cur.ex));body.appendChild(w)}
  if(cur.tip){var n=el('div','note');n.appendChild(el('b',null,'Ojo. '));n.appendChild(document.createTextNode(cur.tip));body.appendChild(n)}
  $('#gBar').style.width=Math.round(100*ss.filter(done).length/ss.length)+'%';
  $('#gPrev').disabled=S.step===0;$('#gNext').disabled=S.step===ss.length-1;
  $('#gFill').hidden=cur.last?S.mode==='update':false;$('#gFill').textContent=cur.last?'Crear con los datos actuales':'Rellenar ejemplo';
  var ol=$('#gSteps');ol.innerHTML='';
  ss.forEach(function(s,i){var li=el('li'),b=el('button');b.type='button';if(i===S.step)b.setAttribute('aria-current','step');var d=done(s);if(d)b.className='done';
    b.appendChild(el('span','dot',d?'✓':String(i+1)));b.appendChild(el('span',null,s.title));b.onclick=function(){go(i)};li.appendChild(b);ol.appendChild(li)});
  $$('.field').forEach(function(f){f.classList.remove('is-guided')});
  selTab(cur.tab);
  if(cur.f){var bx=$('[data-f="'+cur.id+'"]');if(bx&&!bx.hidden)bx.classList.add('is-guided')}
}
function refresh(){render()}
function go(i,sc){S.step=Math.max(0,i);render();if(sc!==false){var c=steps()[S.step];var b=c.f&&$('[data-f="'+c.id+'"]');if(b&&!b.hidden)b.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})}}
function showErr(id,m){var b=$('[data-f="'+id+'"]');if(!b)return;var e=$('.errmsg',b),i=$('input,select,textarea',b);e.hidden=!m;e.textContent=m||'';i.classList.toggle('err',!!m)}
function validate(){
  var er=[];
  F.forEach(function(f){if(!f.l||f.t==='sec'||f.t==='note')return;showErr(f.id,'');if(!shown(f))return;var v=V(f.id);
    if(f.req&&v==='')er.push([f.id,'El campo '+f.l+' es obligatorio.']);
    else if(v!==''&&f.max&&v.length>f.max)er.push([f.id,f.l+' no puede superar '+f.max+' caracteres.']);
    else if(v!==''&&f.t==='num'){var n=parseFloat(v.replace(',','.'));if(isNaN(n))er.push([f.id,f.l+' debe ser un número.']);else if(f.min!=null&&n<f.min)er.push([f.id,f.l+' no puede ser menor que '+f.min+'.']);else if(f.mx!=null&&n>f.mx)er.push([f.id,f.l+' no puede ser mayor que '+f.mx+'.'])}});
  if(D.chk)D.chk(V).forEach(function(e){if(!er.some(function(x){return x[0]===e[0]}))er.push(e)});
  return er;
}
function save(close){
  var er=validate();
  if(er.length){er.forEach(function(e){showErr(e[0],e[1])});var f=fOf(er[0][0]);if(f)selTab(f.tab||0);var i=steps().map(function(s){return s.id}).indexOf(er[0][0]);if(i>=0)go(i);flash('No se pudo crear: '+er[0][1],true);return}
  S.mode='update';$('#h1').textContent=D.edit;$('#crumb').textContent=D.crumb.replace('/create','/update/1')+' · Guía de capacitación';
  $('#btnSave').textContent='Guardar';$('#btnSaveClose').textContent='Guardar y cerrar';$('#ctxLine').textContent='context: update';
  if(D.upd&&!$('#updBox')){var u=el('div','upd');u.id='updBox';u.appendChild(el('h4',null,D.upd[0]));u.appendChild(el('div','help',D.upd[1]));$('#tab0').appendChild(u)}
  flash(close?D.name+' creado(a). En la app real vuelves a la lista.':D.saved);render();
}
$('#gPrev').onclick=function(){go(S.step-1)};$('#gNext').onclick=function(){go(S.step+1)};
$('#gFill').onclick=function(){var c=steps()[S.step];if(c.last){save(false);return}if(c.x!=null){setv(c.id,c.x)}};
$('#btnSave').onclick=function(){save(false)};$('#btnSaveClose').onclick=function(){save(true)};
$('#btnReset').onclick=function(){location.reload()};
$('#chkTech').onchange=function(e){document.body.classList.toggle('show-tech',e.target.checked)};
$('#h1').textContent=D.title;$('#crumb').textContent=D.crumb+' · Guía de capacitación';$('#ctxLine').textContent='context: create';
build();triggers();selTab(0);render();
})();
</script>
</body></html>
