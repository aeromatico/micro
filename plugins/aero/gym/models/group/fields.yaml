fields:
  tenant_id:
    label: Gimnasio (tenant)
    type: dropdown
    span: auto
    permissions:
    - aero.gym.superadmin
    emptyOption: — Elegir —
  name:
    label: Nombre
    span: left
    required: true
  purpose:
    label: Para qué sirve
    span: right
    placeholder: Entrenamiento, comunicación, convenio…
  is_active:
    label: Activo
    type: switch
    default: true
  description:
    label: Descripción
    type: textarea
    size: small
  members:
    label: Socios del grupo
    type: checkboxlist
    quickselect: true
