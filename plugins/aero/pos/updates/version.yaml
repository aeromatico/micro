    - "La caja ahora consulta y cobra los pedidos que los clientes hacen desde el local: se buscan por su número corto, se verifica el pago con QR y se cobra en efectivo sobre el mismo pedido."

1.2.1:
    - "Pedidos del local: ahora la caja avisa de un pedido nuevo con una tarjeta discreta y un tono suave, sin interrumpir la venta en curso; el panel de pedidos se abre al lado y, al cobrar un pedido, tu venta queda en espera y la retomas después."
