# Ojo: los scopes de filtro de este proyecto solo admiten checkbox, switch,
# dropdown y widget. 'group' y 'relation' devuelven un 500.
scopes:
    category:
        label: Categoría
        type: dropdown
        conditions: category = :value
        options:
            billing: Facturación y cobranza
            orders: Pedidos
            sales: Ventas y CRM
            support: Soporte y mensajería
            system: Sistema
            security: Seguridad
            marketing: Marketing
            general: General

    is_active:
        label: Solo activos
        type: switch
        conditions:
            - is_active = 0
            - is_active = 1
