1.0.0:
    - Primera versión del gateway de notificaciones omnicanal — catálogo de
      eventos, plantillas por canal e idioma y reglas de entrega.
    - create_events_table.php
    - create_templates_table.php
    - create_rules_table.php
    - seed_notify_events.php

1.0.1:
    - Reparte los permisos del gateway entre los roles tenant_admin y superadmin.
    - grant_role_permissions.php

1.0.2:
    - "Revoca los permisos de Notify concedidos a tenant_admin en 1.0.1: el
      catálogo de eventos es genérico para toda la plataforma y el gateway
      queda reservado a superadmin hasta que exista el motor de entrega."
    - revoke_tenant_admin_permissions.php

1.1.0:
    - "Primer motor de entrega real: Notify::fire() resuelve audiencias,
      renderiza la plantilla del canal en Twig y despacha por email
      (Mail::html) o WhatsApp (Aero.Hello, con fallback a la cuenta general
      si el tenant no tiene la suya propia). Cada intento queda en el nuevo
      registro de Entregas. Pendiente: dedup/digest/delay de Rule todavía no
      se aplican, es entrega inmediata sin deduplicar."
    - create_deliveries_table.php
    - grant_view_deliveries_to_tenant_admin.php
    - "'sites.user.invited' suma el canal whatsapp y sus plantillas globales,
      para el invite-by-email de Aero.Crm\\Controllers\\Team."
    - seed_invite_templates.php

1.2.0:
    - "Trait HasAdhocAlert + partial reusable _alert_recipient_fields para que
      cualquier plugin ofrezca 'avisame por WhatsApp/correo' a un destinatario
      suelto (no un usuario del sistema) con 3 columnas propias y un campo de
      form. WhatsAppDriver/EmailDriver ahora soportan adjuntos (media_url/
      media_type, attachment_binary/attachment_url). Nuevo evento
      qrbo.qr.generated (primer consumidor, ver Aero.Qrbo)."
    - seed_qr_generated_templates.php

1.2.1:
    - "Pantallas de backend para Reglas y Plantillas (Rules/Templates): hasta
      ahora la única forma de configurar quién recibe un evento y con qué
      texto era escribir una migración a mano — ver seed_invite_templates.php
      y seed_qr_generated_templates.php como ejemplo del patrón que esto
      reemplaza. Rules separa permiso global (manage_global_rules) de propio
      del tenant (manage_rules) vía ScopesToTenant; Templates queda bajo un
      único manage_templates. Ningún cambio de esquema ni de permisos
      concedidos: hoy ambas pantallas siguen siendo de superadmin, igual que
      el resto del gateway."

1.3.0:
    - "Canales propios del tenant (Models\\Channel, tabla aero_notify_channels):
      SMTP propio, bot de Telegram, cuenta Twilio o WhatsApp explícito.
      Notify::deliverOne() los consulta para CUALQUIER evento con Rule en ese
      canal — no solo el contacto que los originó. Reemplaza al sistema
      legacy de Aero.Sites (NotificationChannel/NotificationDispatcher, ver
      Aero\\Sites\\Jobs\\DispatchContactNotification), que queda dado de baja en
      la 1.4.x de Aero.Sites. Nuevos drivers 'telegram' y 'sms' (Twilio).
      EmailDriver acepta SMTP propio vía channel_config. Nueva pantalla
      Canales bajo manage_channels (permiso ya reservado, sin usar hasta
      ahora). 'sites.contact.submitted' suma whatsapp/telegram/sms a sus
      Rules globales: sin Channel configurado para un tenant, esas Rules
      simplemente se saltan como no_address, igual que el canal
      deshabilitado en el sistema legacy."
    - create_channels_table.php
    - migrate_legacy_notification_channels.php
    - seed_contact_channel_rules.php

1.3.1:
    - "Plantillas globales de 'sites.contact.submitted' para sus 5 canales
      (email, inapp, whatsapp, telegram, sms). Sin esto el evento tenía Rules
      pero ninguna plantilla: toda entrega se saltaba como no_template, con
      Channel configurado o sin él."
    - seed_contact_templates.php

1.3.2:
    - "Plantillas globales de email para sites.tenant.created y
      sites.tenant.suspended — ver Aero\\Sites\\Classes\\TenantProvisioner::
      notifyTenantCreated() y Aero\\Sites\\Models\\Tenant::
      notifyTenantSuspended() (aero/sites 1.28.0), primeros eventos del
      catálogo conectados a un disparador real de negocio en vez de solo
      declarados."
    - seed_tenant_lifecycle_templates.php

1.3.3:
    - "Los 10 códigos 'qrbo.*' del catálogo (EventCatalog::qrbo()) pasan a
      'pay.*', source_plugin 'Aero.Qrbo' -> 'Aero.Pay' — sigue el rename del
      propio plugin (namespace Aero\\Qrbo -> Aero\\Pay, ver aero/pay 1.20.0).
      Solo qrbo.qr.generated (ahora pay.qr.generated) tiene un disparador
      real hoy (QrCodesController::fireAlert); el resto son entradas del
      catálogo sin código que las dispare, heredadas del esquema de
      facturación SaaS ya eliminado de aero/pay en 1.12.0-1.13.0 — no se
      limpian acá, solo se renombran junto con el resto."
    - migrate_qrbo_event_codes_to_pay.php

1.3.4:
    - "Nuevo evento sites.tenant.welcome (audience tenant_admin, solo email)
      + plantilla global: el correo real de confirmación de compra que
      recibe el cliente al terminar comprar.htm. sites.tenant.created sigue
      existiendo tal cual, pero su audience es 'superadmin' — es un aviso
      interno, nunca llegó al comprador. Disparado junto a él desde
      TenantProvisioner::notifyTenantCreated() (aero/sites, cambio de
      código sin migración nueva)."
    - seed_tenant_welcome_template.php

1.4.0:
    - "Motor con cola: Notify::fire() encola un Job por entrega (Redis, 3
      intentos con backoff) y aplica conditions, delay_seconds,
      dedup_window_min, digest_window_min (colapsa, no resume) y
      max_per_hour. Canales nuevos: 'inapp' (bandeja) y 'push' (Web Push
      VAPID, minishlink/web-push). Suscripciones y bandeja en tablas nuevas.
      Comando notify:vapid."
    - add_queue_columns_and_inbox_tables.php

1.4.1:
    - "Reglas 'push' junto a cada 'inapp' del catálogo y plantillas globales
      por defecto para todos los eventos (DefaultTemplates)."
    - seed_push_rules_and_default_templates.php

1.4.2:
    - "Bandeja in-app en el backend (Mis notificaciones) y permiso view_inbox
      para tenant_admin."
    - grant_view_inbox_to_tenant_admin.php

1.5.0:
    - "Consumidores migrados: Aero.Crm (recordatorios de cobranza,
      crm.collection.reminder, texto personalizado vía variable `mensaje`) y
      Aero.Shop (OrderNotifier: shop.order.placed/paid/shipped/cancelled).
      Puentes (Classes\\Bridges) para pay.payment.received, hello.message.
      received/account.disconnected/call.missed, crm.lead.created y
      crm.deal.won/lost. Los avisos de mensaje entrante se deduplican a uno
      por conversación por minuto."
    - collection_reminder_uses_mensaje.php
    - dedup_incoming_message_rules.php

1.5.1:
    - "Comandos de operación: notify:test <evento> (dispara el sample_context
      y muestra las entregas), notify:watch (ráfagas de fallos ->
      notify.delivery.failed_burst, cada 15 min vía schedule) y notify:audit
      (detecta Mail::/Hello::send/Sms::send fuera del gateway; código de
      salida 1 si hay)."

1.5.2:
    - "Disparadores nuevos: shop.stock.low (al cruzar low_stock_threshold hacia
      abajo, vía Bridges sobre StockMovement) y crm.collection.overdue (el
      recordatorio de cobranza usa este evento cuando el cobro ya venció,
      con dias_atraso). sites.domain.* sigue sin disparador: Domain no tiene
      ciclo de verificación."
    - collection_overdue_uses_mensaje.php

1.5.3:
    - "Los avisos shop.order.placed/paid incluyen la dirección de envío y el
      enlace al mapa cuando el cliente compartió su ubicación (OrderNotifier
      manda shipping_address y location_url)."
    - order_placed_templates_include_location.php

1.5.4:
    - "Evento nuevo sites.platform_lead.created: leads de Trial / Gran Empresa
      del landing de la plataforma (no de un tenant), a superadmin por email
      e inapp. Disparado por Aero.Sites\\Jobs\\DispatchPlatformLeadNotification."
    - seed_platform_lead_templates.php

1.5.5:
    - "Evento nuevo shop.order.ready (restaurante: pedido listo) al cliente por
      email y WhatsApp. El aviso de pedido nuevo (shop.order.placed) incluye
      tipo de pedido, mesa, hora programada, detalle con extras y notas."
    - shop_restaurant_order_events.php
