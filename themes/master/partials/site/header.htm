<header
    x-data="{
        open: false,
        dark: (localStorage.getItem('theme') || 'dark') === 'dark',
        toggleTheme() {
            this.dark = !this.dark;
            localStorage.setItem('theme', this.dark ? 'dark' : 'light');
            document.documentElement.classList.toggle('dark', this.dark);
        }
    }"
    class="border-b border-edge"
>
    <div class="max-w-6xl mx-auto px-6 sm:px-10 py-7 flex items-center justify-between">
        <a href="/" class="flex items-center gap-2">
            <span class="w-2.5 h-2.5 rounded-[3px] bg-accent"></span>
            <span class="flex flex-col items-center leading-none">
                <span class="font-logo font-black text-[40px] leading-none">Market</span>
                <span class="font-logo font-light text-xs tracking-wide text-ink-dim">by Clouds</span>
            </span>
        </a>

        <nav class="hidden md:flex items-center gap-8">
            <a href="#funciones" class="text-sm text-ink-dim hover:text-ink transition-colors">Funciones</a>
            <a href="#como-funciona" class="text-sm text-ink-dim hover:text-ink transition-colors">Cómo funciona</a>
            <a href="#configuracion" class="text-sm text-ink-dim hover:text-ink transition-colors">Configuración</a>
            <a href="#precios" class="text-sm text-ink-dim hover:text-ink transition-colors">Precios</a>
        </nav>

        <div class="hidden md:flex items-center gap-3">
            <button @click="toggleTheme()" class="p-2 rounded-lg border border-edge text-ink-dim hover:text-ink hover:border-ink-dim transition-colors" aria-label="Cambiar a modo claro u oscuro">
                <svg x-show="dark" x-cloak class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg x-show="!dark" x-cloak class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
            </button>
            <a href="#precios" class="inline-flex items-center bg-accent text-accent-fg font-bold text-sm px-5 py-2.5 rounded-lg hover:-translate-y-px transition-transform">
                Empezar gratis
            </a>
        </div>

        <div class="flex items-center gap-1 md:hidden">
            <button @click="toggleTheme()" class="p-2 text-ink-dim" aria-label="Cambiar a modo claro u oscuro">
                <svg x-show="dark" x-cloak class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg x-show="!dark" x-cloak class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
            </button>
        <button @click="open = !open" class="p-2 -mr-2 text-ink" aria-label="Abrir menú">
            <svg x-show="!open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M4 7h16M4 12h16M4 17h16"/></svg>
            <svg x-show="open" x-cloak class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.6" d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
        </div>
    </div>

    <nav x-show="open" x-cloak x-transition class="md:hidden border-t border-edge px-6 py-4 flex flex-col gap-4">
        <a href="#funciones" @click="open = false" class="text-sm text-ink-dim">Funciones</a>
        <a href="#como-funciona" @click="open = false" class="text-sm text-ink-dim">Cómo funciona</a>
        <a href="#configuracion" @click="open = false" class="text-sm text-ink-dim">Configuración</a>
        <a href="#precios" @click="open = false" class="text-sm text-ink-dim">Precios</a>
        <a href="#precios" @click="open = false" class="inline-flex justify-center bg-accent text-accent-fg font-bold text-sm px-5 py-2.5 rounded-lg">Empezar gratis</a>
    </nav>
</header>
