<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Iglesia — demo de secretaría</title>
<style>*{box-sizing:border-box}
html,body{margin:0;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.5}
h1,h2,h3,h4,p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:12px}.right{text-align:right}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:7px 14px;font-weight:600;font-size:13px}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ok{background:#15803d;border-color:#15803d;color:#fff}
.btn.danger{background:#fff;border-color:#fca5a5;color:#b91c1c}
.btn.sm{padding:4px 10px;font-size:12px}
.link{border:0;background:none;padding:0;color:var(--brand);font-weight:600;text-decoration:underline}
.inp{width:100%;border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:8px 11px}
textarea.inp{resize:vertical}
.check{display:flex;gap:8px;align-items:flex-start}.check input{margin-top:4px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.card{border:1px solid var(--line);background:#fff;border-radius:var(--r);padding:16px}
.tag{display:inline-block;border-radius:99px;padding:1px 9px;font-size:11px;font-weight:700;background:#eef0f4;color:#475569;white-space:nowrap}
.tag.green{background:#dcfce7;color:#166534}.tag.amber{background:#fef3c7;color:#92400e}.tag.blue{background:#dbeafe;color:#1e40af}.tag.red{background:#fee2e2;color:#991b1b}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:flex-start;justify-content:center;padding:6vh 14px;overflow:auto;z-index:50}
.dialog{position:relative;width:100%;max-width:440px;background:#fff;border-radius:12px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dialog.wide{max-width:680px}
.dialog .x{position:absolute;right:10px;top:6px;border:0;background:none;font-size:22px;color:var(--muted)}
.ask{font-size:15px;margin:6px 18px 18px 0}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#14532d;color:#fff;border-radius:10px;padding:10px 16px;font-weight:600;font-size:13px;z-index:60;width:max-content;max-width:92vw;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.err{background:#991b1b}
:root{--brand:#2563eb;--ink:#1f2937;--muted:#6b7280;--line:#e2e5ea;--bg:#f3f4f6;--r:6px}
.shell{display:flex;min-height:100vh}
aside{width:190px;flex:none;background:#1f2a3c;color:#cbd5e1;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
aside .who{padding:14px;border-bottom:1px solid rgba(255,255,255,.08);color:#fff;font-weight:700}
aside .who span{display:block;font-weight:500;font-size:11px;color:#94a3b8}
aside nav{display:flex;flex-direction:column;padding:8px}
aside nav button{display:flex;justify-content:space-between;gap:8px;border:0;background:none;color:inherit;text-align:left;padding:8px 10px;border-radius:6px;font-weight:600;font-size:13px;white-space:nowrap}
aside nav button:hover{background:rgba(255,255,255,.06)}aside nav button.on{background:#2563eb;color:#fff}
aside nav b{background:#f59e0b;color:#111;border-radius:99px;font-size:10px;padding:0 6px}
main{flex:1;min-width:0;padding:18px 22px 60px}
h1{font-size:20px;margin-bottom:14px}h3{font-size:14px;margin-bottom:8px}
.bar{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:12px}
.bar h1{margin:0}
.bar .inp,.row .inp{width:auto;min-width:150px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:12px;margin-bottom:16px}
.stat b{display:block;font-size:24px;line-height:1.3}.up{color:#15803d}.down{color:#b91c1c}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.hbar{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}.hbar span{width:58px;flex:none;color:var(--muted)}.hbar i{height:11px;border-radius:2px;background:#3b82f6;min-width:2px}.hbar.g i{background:#10b981}
.table{overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#f9fafb}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
tr:last-child td{border-bottom:0}
tr[data-act]{cursor:pointer}tr[data-act]:hover td{background:#eff6ff}
td.wrap{white-space:normal;min-width:200px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;font-weight:600}.form .full{grid-column:1/-1}.form label.check{flex-direction:row;font-weight:500;font-size:13px}
.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;margin:10px 0}.kv dt{color:var(--muted)}.kv dd{margin:0}
.note{border-left:3px solid #cbd5e1;padding:3px 10px;margin:8px 0}
dd{margin:0}
@media (max-width:700px){
 .shell{flex-direction:column}
 aside{width:100%;height:auto;z-index:10}
 aside .who{padding:8px 12px}
 aside nav{flex-direction:row;overflow-x:auto;padding:6px;scrollbar-width:none}
 main{padding:14px 12px 60px}
 .grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}
}
</style>
</head>

<script>/* Utilidades y datos ficticios compartidos por las tres demos (mismos nombres que `church:demo`). Nada se guarda ni se envía. */
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const val = (id) => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
const on = (id) => { const e = document.getElementById(id); return !!(e && e.checked); };
const money = (v) => Number(v).toLocaleString('de-DE', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const CHURCH = 'Comunidad Vida Nueva';
const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
const day = (n, h = 0, m = 0) => { const d = new Date(TODAY); d.setDate(d.getDate() + n); d.setHours(h, m); return d; };
const pad = (n) => String(n).padStart(2, '0');
const fDate = (d) => d ? `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}` : '—';
const fShort = (d) => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`;
const fTime = (d) => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const nextSunday = ((7 - TODAY.getDay()) % 7) || 7;
let seed = 25025;
const rnd = (a, b) => { seed = (seed * 16807) % 2147483647; return a + (seed % (b - a + 1)); };
const pick = (a) => a[rnd(0, a.length - 1)];
let uid = 1000;

/** Dibujo con aspecto de QR. Es decorativo a propósito: no se puede escanear. */
function qrSvg(text, size = 160) {
  let h = 7; for (const c of String(text)) h = (h * 31 + c.charCodeAt(0)) % 2147483647;
  const n = 25; let out = '';
  const finder = (x, y) => `<path d="M${x} ${y}h7v7h-7zM${x + 1} ${y + 1}v5h5v-5z" fill-rule="evenodd"/><path d="M${x + 2} ${y + 2}h3v3h-3z"/>`;
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    h = (h * 16807) % 2147483647;
    if ((x < 8 && (y < 8 || y > n - 9)) || (y < 8 && x > n - 9)) continue;
    if (h % 100 < 47) out += `M${x} ${y}h1v1h-1z`;
  }
  return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" width="${size}" height="${size}" fill="#111" style="background:#fff" role="img" aria-label="Código QR de ejemplo">${finder(0, 0)}${finder(n - 7, 0)}${finder(0, n - 7)}<path d="${out}"/></svg>`;
}

function toast(msg, kind = 'ok') {
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.setAttribute('role', 'status'); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 3200);
}
function closeModal() { const m = $('#modal'); if (m) m.remove(); }
function modal(html, wide) {
  closeModal();
  const m = document.createElement('div'); m.id = 'modal'; m.className = 'overlay';
  m.innerHTML = `<div class="dialog${wide ? ' wide' : ''}" role="dialog" aria-modal="true"><button class="x" data-act="close" aria-label="Cerrar">×</button>${html}</div>`;
  m.addEventListener('click', (e) => { if (e.target === m) closeModal(); });
  document.body.appendChild(m);
}
let pendingYes = null;
function confirmBox(msg, yes) {
  pendingYes = yes;
  modal(`<p class="ask">${esc(msg)}</p><div class="actions"><button class="btn" data-act="close">Volver</button><button class="btn primary" data-act="yes">Confirmar</button></div>`);
}
const ACT = { close: closeModal, yes: () => { const f = pendingYes; pendingYes = null; closeModal(); if (f) f(); } };
document.addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  if (el.tagName === 'A' || el.tagName === 'BUTTON') e.preventDefault();
  const f = ACT[el.dataset.act]; if (f) f(el.dataset.id, el);
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

/* ───── personas ───── */
const BRANCHES = ['Sede Central', 'Sede Zona Sur'];
const MSTAT = { visitor: 'Visitante', new: 'Nuevo asistente', active: 'Miembro activo', inactive: 'Miembro inactivo' };
const MEMBERS = [];
[['Mamani Quispe', 'Juan', 'María', ['Valentina', 'Mateo', 'Camila']], ['Condori Flores', 'Carlos', 'Ana', ['Emanuel', 'Abigail']], ['Choque Gutiérrez', 'Luis', 'Rosa', ['Josué']],
 ['Vargas Rojas', 'Pedro', 'Lucía', ['Noemí', 'Isaac', 'Lía']], ['Quispe Mendoza', 'José', 'Elena', []], ['Torrez Salazar', 'Marcos', 'Carmen', ['Thiago', 'Sara']],
 ['Huanca Pérez', 'Daniel', 'Sofía', ['Benjamín']], ['Rodríguez Cruz', 'Samuel', 'Patricia', ['Ruth', 'Gael']]].forEach(([sur, h, w, kids], i) => {
  const branch = BRANCHES[i % 3 === 2 ? 1 : 0], family = 'Familia ' + sur;
  const add = (first, role, age) => MEMBERS.push({ id: ++uid, first, last: sur, family, role, age, branch, status: 'active', consent: age >= 18 && uid % 4 !== 0, since: -rnd(40, 330), birth: rnd(20, 330) });
  add(h, 'Cabeza de familia', rnd(32, 55)); add(w, 'Cónyuge', rnd(29, 52)); kids.forEach((k) => add(k, 'Hijo/a', rnd(3, 16)));
});
[['Andrea', 'Lima Torrico', 19, 'active', -210], ['Diego', 'Paco Ticona', 22, 'active', -150], ['Karen', 'Poma Limachi', 24, 'active', -95], ['Eulogia', 'Ticona Mamani', 71, 'active', -300],
 ['Silvia', 'Mercado Ortiz', 38, 'active', -62], ['Rolando', 'Gómez Vera', 45, 'active', -180], ['Gonzalo', 'Rivero Sandoval', 31, 'new', -12], ['Mariela', 'Cárdenas Ruiz', 27, 'new', -6],
 ['Teresa', 'Nina Choque', 49, 'inactive', -320]].forEach(([first, last, age, status, since], i) =>
  MEMBERS.push({ id: ++uid, first, last, family: '', role: '', age, branch: BRANCHES[i % 2], status, consent: status !== 'inactive' && i % 3 !== 2, since, birth: rnd(20, 330) }));
[[0, 1], [3, 3], [9, 5]].forEach(([i, n]) => { MEMBERS[i].birth = n; });
const fullName = (m) => m.first + ' ' + m.last;
const member = (id) => MEMBERS.find((m) => m.id === +id);
const adults = () => MEMBERS.filter((m) => m.age >= 18);

/* ───── eventos (cupo, lista de espera, llegada) ───── */
const ETYPE = { service: 'Culto', retreat: 'Retiro', conference: 'Conferencia', special: 'Actividad especial' };
const EVENTS = [
  { id: 1, title: 'Culto dominical', type: 'service', at: day(nextSunday, 10), place: 'Templo principal', cap: 150, pub: true, open: true, text: 'Te esperamos este domingo.', n: 12 },
  { id: 3, title: 'Conferencia de familia', type: 'conference', at: day(10, 18, 30), place: 'Sede Zona Sur', cap: 100, pub: false, open: true, text: 'Solo para miembros.', n: 8 },
  { id: 2, title: 'Retiro de jóvenes', type: 'retreat', at: day(21, 8), place: 'Casa de retiros, Coroico', cap: 12, pub: true, open: true, text: 'Dos días de comunión, enseñanza y descanso. Cupo limitado.', n: 15 },
];
const REGS = [];
// Ana (la del portal) solo empieza inscrita al culto, para que pueda probar las demás inscripciones.
EVENTS.forEach((e) => adults().filter((m) => e.id === 1 || m.first !== 'Ana').slice(e.id, e.id + e.n).forEach((m, i) => REGS.push({ id: ++uid, event: e.id, member: m.id, name: fullName(m), status: i < e.cap ? 'registered' : 'waitlist', in: null })));
const seats = (e) => REGS.filter((r) => r.event === e.id && r.status === 'registered').length;
const waiting = (e) => REGS.filter((r) => r.event === e.id && r.status === 'waitlist').length;
function enroll(e, name, memberId) {
  const r = { id: ++uid, event: e.id, member: memberId || null, name, status: seats(e) < e.cap ? 'registered' : 'waitlist', in: null };
  REGS.push(r); return r;
}
/** Igual que el servicio real: al liberarse un cupo sube el primero de la lista de espera. */
function unenroll(r) {
  const seated = r.status === 'registered'; REGS.splice(REGS.indexOf(r), 1);
  const e = EVENTS.find((x) => x.id === r.event);
  if (!seated || seats(e) >= e.cap) return null;
  const next = REGS.find((x) => x.event === e.id && x.status === 'waitlist');
  if (next) next.status = 'registered';
  return next || null;
}
/* Armazón común de los paneles (menú lateral como en el backend). Cada demo define MENU y VIEWS. */
let view = '';
const table = (heads, rows, empty = 'No hay registros.') => `<div class="table"><table><thead><tr>${heads.map((h) => `<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('') || `<tr><td colspan="${heads.length}" class="muted">${empty}</td></tr>`}</tbody></table></div>`;
const tag = (label, color = '') => `<span class="tag ${color}">${esc(label)}</span>`;
const options = (map, sel, first) => (first ? `<option value="">${first}</option>` : '') + Object.entries(map).map(([k, v]) => `<option value="${esc(k)}"${String(k) === String(sel) ? ' selected' : ''}>${esc(v)}</option>`).join('');
const stat = (label, big, sub = '', go = '') => `<div class="card stat"><span class="muted small">${label}</span><b>${big}</b><span class="small muted">${sub}${go ? ` <button class="link" data-act="go" data-id="${go}">Ver</button>` : ''}</span></div>`;
function render() {
  $('#menu').innerHTML = MENU.map(([k, l, badge]) => { const n = badge ? badge() : 0; return `<button data-act="go" data-id="${k}" class="${view === k ? 'on' : ''}">${l}${n ? `<b>${n}</b>` : ''}</button>`; }).join('');
  $('#main').innerHTML = VIEWS[view]();
}
ACT.go = (v) => { view = v; closeModal(); render(); window.scrollTo(0, 0); };
function start() {
  view = MENU[0][0]; render();
  // Las fechas se aplican al confirmar («change»): redibujar mientras se teclean les quitaría el foco.
  const apply = (e) => { const t = e.target; if (!t.dataset.filter || (e.type === 'input') === (t.type === 'date')) return; FILTER[t.dataset.filter] = t.value; const id = t.id, p = t.selectionStart; render(); const el = document.getElementById(id); if (el) { el.focus(); if (el.type === 'search') el.setSelectionRange(p, p); } };
  document.addEventListener('input', apply); document.addEventListener('change', apply);
}
const FILTER = {};
/* Panel de secretaría y pastoral (plugins/aero/church/controllers). */
const VSTAT = { new: 'Nuevo', contacted: 'Contactado', invited: 'Invitado', integrated: 'Integrado', closed: 'Sin continuidad' };
const VCOL = { new: 'amber', contacted: 'blue', invited: 'blue', integrated: 'green', closed: '' };
const CHAN = { call: 'Llamada', whatsapp: 'WhatsApp', visit: 'Visita' };
const VISITS = [['Daysi Álvarez', 'new', 0, 'Formulario QR'], ['Olga Paredes', 'new', 1, 'Formulario QR'], ['Franz Heredia', 'new', 2, 'Formulario QR'], ['Jimena Soliz', 'new', 3, 'Formulario QR'], ['Marco Antelo', 'contacted', 8, 'Manual'], ['Lidia Crespo', 'contacted', 9, 'Formulario QR'], ['Iván Montaño', 'contacted', 12, 'Formulario QR'], ['Pablo Aguilar', 'invited', 14, 'Formulario QR'], ['Estela Rojas', 'invited', 18, 'Formulario QR'], ['Rubén Calle', 'closed', 60, 'Manual']]
  .map(([name, status, ago, src], i) => ({ id: ++uid, name, status, date: day(-ago), src, resp: status === 'new' && i % 2 ? '' : ['Juan', 'Ana', 'Rolando'][i % 3], next: status === 'contacted' ? day(-1) : status === 'invited' ? day(4) : null,
    interest: ['Quiero conocer los grupos de jóvenes', 'Busco una célula cerca de mi casa', 'Me interesa el ministerio de niños', 'Quiero saber de los bautismos'][i % 4],
    log: status === 'new' ? [] : [{ at: day(-ago + 1), channel: CHAN.whatsapp, note: 'Se conversó sobre su visita y se resolvieron dudas.', next: 'Invitar a la próxima reunión' }] }));
const PSTAT = { open: 'Abierta', in_prayer: 'En oración', answered: 'Respondida', closed: 'Cerrada' };
const PCOL = { open: 'amber', in_prayer: 'blue', answered: 'green', closed: '' };
const PRAYERS = [['Por mi matrimonio, estamos pasando un tiempo difícil.', 'Sin nombre', true, true, 'open', 2], ['Por la salud de mi madre, que está internada.', 'Familia Condori', true, true, 'in_prayer', 4], ['Por los exámenes de mi hijo en la universidad.', 'Rosa V.', false, false, 'open', 6], ['Dirección para el nuevo proyecto de la iglesia.', 'Equipo de liderazgo', false, false, 'in_prayer', 12], ['Agradecemos por el trabajo que nos dio Dios.', 'Anónimo', false, false, 'answered', 25]]
  .map(([text, name, priv, contact, status, ago]) => ({ id: ++uid, text, name, priv, contact, status, date: day(-ago), notes: status === 'in_prayer' ? [{ at: day(-ago + 1), text: 'Se oró con la familia el domingo y se hará seguimiento esta semana.' }] : [] }));
const AKIND = { announcement: 'Comunicado', reminder: 'Recordatorio', schedule_change: 'Cambio o cancelación' };
const AUD = { active: 'Miembros activos', all: 'Activos y nuevos asistentes', youth: 'Grupo de jóvenes' };
const ANN = [{ id: ++uid, title: 'Culto dominical', kind: 'reminder', aud: 'all', body: 'Hola {nombre}, te esperamos este domingo a las 10:00 en nuestro culto. ¡Trae a un amigo!', status: 'draft' }, { id: ++uid, title: 'Reunión de jóvenes', kind: 'announcement', aud: 'youth', body: 'Hola {nombre}, este viernes 19:30 tenemos reunión de jóvenes. ¡No faltes!', status: 'draft' }];
function audience(a) {
  const base = MEMBERS.filter((m) => a.aud === 'youth' ? m.age >= 13 && m.age <= 25 : a.aud === 'active' ? m.status === 'active' : ['active', 'new'].includes(m.status));
  const to = base.filter((m) => m.consent).length; return { to, skipped: base.length - to };
}
const attention = (v) => v.status === 'new' || (v.next && v.next < TODAY && !['integrated', 'closed'].includes(v.status));
const MENU = [['resumen', 'Resumen'], ['miembros', 'Miembros'], ['visitas', 'Visitantes', () => VISITS.filter(attention).length], ['eventos', 'Eventos'], ['oracion', 'Oración', () => PRAYERS.filter((p) => p.status === 'open').length], ['comunicados', 'Comunicados']];
const WEEKLY = [58, 64, 61, 70, 67, 74, 72, 79];
const bars = (rows, cls = '') => { const max = Math.max(1, ...rows.map((r) => r[1])); return rows.map(([l, n]) => `<div class="hbar ${cls}"><span>${l}</span><i style="width:${Math.round(n / max * 150)}px"></i>${n}</div>`).join(''); };
const regTable = (e) => table(['Nombre', 'Estado', 'Llegada', ''], REGS.filter((r) => r.event === e.id).sort((a, b) => (a.status === 'waitlist') - (b.status === 'waitlist') || a.id - b.id).map((r) => `<tr><td>${esc(r.name)}${r.member ? '' : ' <span class="muted">(invitado)</span>'}</td><td>${r.status === 'registered' ? tag('Inscrito', 'green') : tag('En espera', 'amber')}</td><td>${r.in ? fTime(r.in) : '—'}</td><td class="right">${r.status === 'registered' ? `<button class="btn sm ${r.in ? '' : 'ok'}" data-act="checkin" data-id="${r.id}">${r.in ? 'Deshacer llegada' : 'Marcar llegada'}</button> ` : ''}<button class="btn sm" data-act="unreg" data-id="${r.id}">Cancelar</button></td></tr>`), 'Aún no hay inscritos.');
let openEv = null;
const VIEWS = {
  resumen: () => {
    const active = MEMBERS.filter((m) => m.status === 'active').length, fresh = MEMBERS.filter((m) => m.since > -30).length;
    const vis = VISITS.filter((v) => v.date >= day(-30)), integ = vis.filter((v) => v.status === 'integrated').length;
    const months = Array.from({ length: 6 }, (_, i) => { const d = new Date(TODAY.getFullYear(), TODAY.getMonth() - 5 + i, 1); return [d.toLocaleDateString('es', { month: 'short' }).replace('.', ''), [3, 5, 2, 6, 4, fresh][i]]; });
    const bd = MEMBERS.filter((m) => m.birth <= 7).sort((a, b) => a.birth - b.birth);
    return `<h1>Resumen</h1><div class="grid">${stat('Miembros activos', active, `de ${MEMBERS.length} registrados`, 'miembros')}${stat('Nuevos (30 días)', fresh, '<span class="up">en crecimiento</span>')}${stat('Visitantes (30 días)', vis.length, `integrados: ${vis.length ? Math.round(integ / vis.length * 100) : 0}%`)}${stat('Asistencia (28 días)', 292, 'periodo anterior 253: <span class="up">+15%</span>')}${stat('Eventos en 14 días', EVENTS.filter((e) => e.at <= day(15)).length)}${stat('Peticiones de oración abiertas', PRAYERS.filter((p) => ['open', 'in_prayer'].includes(p.status)).length, '', 'oracion')}${stat('Visitantes por atender', VISITS.filter(attention).length, '', 'visitas')}</div>
    <div class="cols"><div class="card"><h3>Altas de miembros</h3>${bars(months)}</div><div class="card"><h3>Asistencia por semana</h3>${bars(WEEKLY.map((n, i) => ['sem. ' + fShort(day(-7 * (8 - i))), n]), 'g')}</div><div class="card"><h3>Cumpleaños de la semana</h3>${bd.map((m) => `<p>${fShort(day(m.birth))} — ${esc(fullName(m))}</p>`).join('')}</div></div>`;
  },
  miembros: () => {
    const q = (FILTER.q || '').toLowerCase(), s = FILTER.st || '';
    const list = MEMBERS.filter((m) => (!s || m.status === s) && fullName(m).toLowerCase().includes(q));
    return `<div class="bar"><h1>Miembros</h1><div class="row"><input id="q" type="search" data-filter="q" class="inp" placeholder="Buscar" value="${esc(FILTER.q || '')}" aria-label="Buscar"><select id="st" data-filter="st" class="inp" aria-label="Estado">${options(MSTAT, s, 'Todos los estados')}</select><button class="btn primary" data-act="newMember">Nuevo miembro</button></div></div>` +
      table(['Nombres', 'Apellidos', 'Estado', 'Sede', 'Familia', 'Edad'], list.map((m) => `<tr data-act="member" data-id="${m.id}"><td>${esc(m.first)}</td><td>${esc(m.last)}</td><td>${tag(MSTAT[m.status], m.status === 'active' ? 'green' : m.status === 'new' ? 'blue' : '')}</td><td>${m.branch}</td><td>${esc(m.family || '—')}</td><td>${m.age}</td></tr>`));
  },
  visitas: () => `<div class="bar"><h1>Visitantes</h1><span class="muted small">Toca un visitante para hacer su seguimiento</span></div>` + table(['Fecha', 'Nombre', 'Estado', 'Responsable', 'Próxima acción', 'Origen'], VISITS.map((v) => `<tr data-act="visit" data-id="${v.id}"><td>${fDate(v.date)}</td><td>${esc(v.name)}</td><td>${tag(VSTAT[v.status], VCOL[v.status])}</td><td>${v.resp || '<span class="muted">Sin asignar</span>'}</td><td class="${v.next && v.next < TODAY ? 'down' : ''}">${v.next ? fDate(v.next) : '—'}</td><td>${v.src}</td></tr>`)),
  eventos: () => {
    const e = EVENTS.find((x) => x.id === openEv);
    if (!e) return `<h1>Eventos</h1>` + table(['Inicio', 'Evento', 'Tipo', 'Lugar', 'Inscritos', 'Llegaron', 'En espera', 'Cupo'], EVENTS.map((x) => `<tr data-act="openEv" data-id="${x.id}"><td>${fDate(x.at)} ${fTime(x.at)}</td><td>${x.title}</td><td>${ETYPE[x.type]}</td><td>${x.place}</td><td>${seats(x)}</td><td>${REGS.filter((r) => r.event === x.id && r.in).length}</td><td>${waiting(x)}</td><td>${x.cap}</td></tr>`));
    return `<button class="link" data-act="openEv" data-id="0">← Eventos</button><div class="bar"><h1>${e.title}</h1><span><strong>Inscritos: ${seats(e)} de ${e.cap}</strong> · Llegaron: ${REGS.filter((r) => r.event === e.id && r.in).length}${waiting(e) ? ` · En espera: ${waiting(e)}` : ''}</span></div>
    <div class="row" style="margin-bottom:10px"><button class="btn" data-act="scan">Simular lectura de un código QR</button><input id="guest" class="inp" placeholder="Nombre del invitado" aria-label="Nombre del invitado"><button class="btn primary" data-act="guest">Inscribir invitado</button></div>${regTable(e)}`;
  },
  oracion: () => `<h1>Oración</h1><p class="muted small" style="margin-bottom:10px">Información confidencial: solo la dirección pastoral y el responsable asignado pueden verla.</p>` + table(['Fecha', 'Nombre', 'Petición', 'Estado', 'Privada', 'Pide contacto'], PRAYERS.map((p) => `<tr data-act="prayer" data-id="${p.id}"><td>${fDate(p.date)}</td><td>${p.name}</td><td class="wrap">${p.text}</td><td>${tag(PSTAT[p.status], PCOL[p.status])}</td><td>${p.priv ? 'Sí' : 'No'}</td><td>${p.contact ? 'Sí' : 'No'}</td></tr>`)),
  comunicados: () => `<div class="bar"><h1>Comunicados</h1><button class="btn primary" data-act="newAnn">Nuevo comunicado</button></div>` + table(['Título', 'Tipo', 'Estado', 'Enviados', 'Sin consentimiento'], ANN.map((a) => `<tr data-act="ann" data-id="${a.id}"><td>${esc(a.title)}</td><td>${AKIND[a.kind]}</td><td>${a.status === 'sent' ? tag('Enviado', 'green') : tag('Borrador')}</td><td>${a.status === 'sent' ? a.sentN : '—'}</td><td>${a.status === 'sent' ? a.skipN : '—'}</td></tr>`)),
};
const by = (list, id) => list.find((x) => x.id === +id);
function visitBox(v) {
  modal(`<h3>${esc(v.name)}</h3>${tag(VSTAT[v.status], VCOL[v.status])}<dl class="kv"><dt>Visitó el</dt><dd>${fDate(v.date)}</dd><dt>Interés</dt><dd>${v.interest}</dd><dt>Responsable</dt><dd>${v.resp || 'Sin asignar'}</dd></dl>
  ${v.status === 'integrated' ? '<p class="up">Integrado como miembro.</p>' : v.status !== 'closed' ? `<button class="btn ok" data-act="integrate" data-id="${v.id}">Integrar como miembro</button>` : ''}
  <h3 style="margin-top:16px">Seguimiento (${v.log.length})</h3>${v.log.map((c) => `<div class="note"><span class="small muted">${fDate(c.at)} · ${c.channel}</span><br>${esc(c.note)}${c.next ? `<br><span class="small">Próxima acción: ${esc(c.next)}</span>` : ''}</div>`).join('') || '<p class="muted">Aún no se le ha contactado.</p>'}
  <div class="form" style="margin-top:10px"><label>Medio<select id="c-ch" class="inp">${options(CHAN, 'call')}</select></label><label>Fecha de próxima acción<input id="c-date" type="date" class="inp" value="${iso(day(3))}"></label><label class="full">¿Qué se habló?<input id="c-note" class="inp"></label><label class="full">Próxima acción<input id="c-next" class="inp" placeholder="Invitar a la célula"></label></div><div class="actions"><button class="btn primary" data-act="contact" data-id="${v.id}">Registrar contacto</button></div>`, true);
}
function prayerBox(p) {
  modal(`<h3>${p.name}</h3><p>${p.text}</p><div class="form" style="margin-top:12px"><label>Estado<select id="p-st" class="inp">${options(PSTAT, p.status)}</select></label></div><h3 style="margin-top:16px">Acompañamiento (${p.notes.length})</h3>${p.notes.map((n) => `<div class="note"><span class="small muted">${fDate(n.at)}</span><br>${esc(n.text)}</div>`).join('')}<input id="p-note" class="inp" placeholder="Nota de acompañamiento" aria-label="Nota"><div class="actions"><button class="btn primary" data-act="savePrayer" data-id="${p.id}">Guardar</button></div>`);
}
function annBox(a) {
  const n = audience(a), body = esc(a.body).replace('{nombre}', 'María');
  modal(`<h3>${esc(a.title)}</h3><p class="muted small">${AKIND[a.kind]} · ${AUD[a.aud]}</p><div class="note">${body}</div>${a.status === 'draft' ? `<h3 style="margin-top:14px">Antes de enviar</h3><p>Lo recibirían <strong>${n.to}</strong> personas. <span class="muted">${n.skipped} quedan fuera por no tener consentimiento o teléfono (los menores reciben el aviso a través de su tutor).</span></p><div class="actions"><button class="btn primary" data-act="send" data-id="${a.id}">Enviar por WhatsApp</button></div>` : `<p style="margin-top:14px">Enviados: <strong>${a.sentN}</strong> · Fallidos: 0 · Sin consentimiento o teléfono: ${a.skipN}</p>`}`);
}
Object.assign(ACT, {
  member: (id) => { const m = member(id); modal(`<h3>${esc(fullName(m))}</h3><dl class="kv"><dt>Sede</dt><dd>${m.branch}</dd><dt>Familia</dt><dd>${esc(m.family || '—')}${m.role ? ' · ' + m.role : ''}</dd><dt>Edad</dt><dd>${m.age}</dd><dt>Mensajes</dt><dd>${m.consent ? 'Aceptó recibirlos' : 'Sin consentimiento'}</dd></dl><div class="form"><label>Estado<select id="m-st" class="inp">${options(MSTAT, m.status)}</select></label></div><div class="actions"><button class="btn primary" data-act="saveMember" data-id="${m.id}">Guardar</button></div>`); },
  saveMember: (id) => { member(id).status = val('m-st'); closeModal(); render(); toast('Miembro actualizado'); },
  newMember: () => modal(`<h3>Nuevo miembro</h3><div class="form"><label>Nombres<input id="n-first" class="inp"></label><label>Apellidos<input id="n-last" class="inp"></label><label>Estado<select id="n-st" class="inp">${options(MSTAT, 'new')}</select></label><label>Sede<select id="n-br" class="inp">${BRANCHES.map((b) => `<option>${b}</option>`).join('')}</select></label><label>Edad<input id="n-age" type="number" class="inp" value="30" min="0" max="110"></label><label class="check full"><input type="checkbox" id="n-con"> Acepta recibir mensajes</label></div><div class="actions"><button class="btn primary" data-act="createMember">Guardar</button></div>`),
  createMember: () => { if (!val('n-first') || !val('n-last')) return toast('Completa nombres y apellidos', 'err'); MEMBERS.unshift({ id: ++uid, first: val('n-first'), last: val('n-last'), family: '', role: '', age: +val('n-age') || 30, branch: val('n-br'), status: val('n-st'), consent: on('n-con'), since: 0, birth: 200 }); FILTER.q = ''; FILTER.st = ''; closeModal(); render(); toast('Miembro registrado'); },
  visit: (id) => visitBox(by(VISITS, id)),
  contact: (id) => { const v = by(VISITS, id); if (!val('c-note')) return toast('Escribe qué se habló', 'err'); v.log.unshift({ at: TODAY, channel: CHAN[val('c-ch')], note: val('c-note'), next: val('c-next') }); v.next = val('c-date') ? new Date(val('c-date') + 'T00:00') : null; if (v.status === 'new') v.status = 'contacted'; if (!v.resp) v.resp = 'Ana'; render(); visitBox(v); toast('Contacto registrado'); },
  integrate: (id) => confirmBox('¿Registrarlo como miembro nuevo?', () => { const v = by(VISITS, id); const [first, ...rest] = v.name.split(' '); MEMBERS.unshift({ id: ++uid, first, last: rest.join(' '), family: '', role: '', age: 29, branch: BRANCHES[0], status: 'new', consent: true, since: 0, birth: 200 }); v.status = 'integrated'; v.next = null; render(); toast(v.name + ' ya figura en Miembros'); }),
  openEv: (id) => { openEv = +id || null; render(); },
  checkin: (id) => { const r = by(REGS, id); r.in = r.in ? null : new Date(); render(); },
  scan: () => { const r = REGS.find((x) => x.event === openEv && x.status === 'registered' && !x.in); if (!r) return toast('Ya llegaron todos los inscritos', 'err'); r.in = new Date(); render(); toast('Llegada marcada: ' + r.name); },
  unreg: (id) => confirmBox('¿Cancelar esta inscripción?', () => { const up = unenroll(by(REGS, id)); render(); toast(up ? `Cupo liberado: ${up.name} subió de la lista de espera` : 'Inscripción cancelada'); }),
  guest: () => { if (!val('guest')) return toast('Escribe el nombre del invitado', 'err'); const r = enroll(EVENTS.find((e) => e.id === openEv), val('guest')); render(); toast(r.status === 'registered' ? 'Invitado inscrito' : 'Cupo lleno: quedó en lista de espera'); },
  prayer: (id) => prayerBox(by(PRAYERS, id)),
  savePrayer: (id) => { const p = by(PRAYERS, id); p.status = val('p-st'); if (val('p-note')) p.notes.unshift({ at: TODAY, text: val('p-note') }); closeModal(); render(); toast('Petición actualizada'); },
  ann: (id) => annBox(by(ANN, id)),
  newAnn: () => modal(`<h3>Nuevo comunicado</h3><div class="form"><label class="full">Título<input id="a-title" class="inp"></label><label>Tipo<select id="a-kind" class="inp">${options(AKIND, 'announcement')}</select></label><label>Para<select id="a-aud" class="inp">${options(AUD, 'active')}</select></label><label class="full">Mensaje<textarea id="a-body" class="inp" rows="4">Hola {nombre}, </textarea></label></div><div class="actions"><button class="btn primary" data-act="createAnn">Guardar borrador</button></div>`),
  createAnn: () => { if (!val('a-title') || !val('a-body')) return toast('Completa título y mensaje', 'err'); const a = { id: ++uid, title: val('a-title'), kind: val('a-kind'), aud: val('a-aud'), body: val('a-body'), status: 'draft' }; ANN.unshift(a); render(); annBox(a); },
  send: (id) => { const a = by(ANN, id), n = audience(a); confirmBox(`¿Enviar este comunicado por WhatsApp a ${n.to} personas? No se puede deshacer.`, () => { a.status = 'sent'; a.sentN = n.to; a.skipN = n.skipped; render(); toast('Demo: comunicado marcado como enviado (no se envió nada)'); }); },
});
start();
</script>
</body>
</html>
