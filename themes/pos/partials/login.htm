<section class="center" x-show="screen === 'login'">
    <form class="card" @submit.prevent="doLogin()">
        <div class="logo">M</div>
        <div><div class="bold" style="font-size:20px" x-text="tenant ? tenant.name : ''"></div><div class="muted">Entra con tu usuario y tu PIN.</div></div>
        <div class="err" x-show="error" x-text="error"></div>
        <label class="label" for="u">Usuario</label>
        <input id="u" class="field" x-model="login" autocapitalize="none" autocomplete="username" placeholder="tu usuario o correo">
        <div class="pin" aria-label="PIN"><template x-for="i in 6"><i :class="pin.length >= i && 'on'"></i></template></div>
        <div class="pad">
            <template x-for="k in ['1','2','3','4','5','6','7','8','9','','0','del']">
                <button type="button" :disabled="k === ''" :style="k === '' ? 'visibility:hidden' : ''" @click="pinKey(k)" x-text="k === 'del' ? '⌫' : k" :aria-label="k === 'del' ? 'Borrar' : k"></button>
            </template>
        </div>
        <button class="btn primary big" type="submit" :disabled="busy" x-text="busy ? 'Entrando…' : 'Entrar'"></button>
    </form>
</section>
